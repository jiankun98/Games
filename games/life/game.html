<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人生模拟器 · 像素版</title>
    <script src="./index.js"></script>
    <style>
      /* ===== PICO-8 风格调色板 ===== */
      :root {
        --bg: #1a1c2c;
        --bg2: #29366f;
        --panel: #352f5c;
        --panel2: #414067;
        --border: #f4f4f4;
        --border-dk: #5d275d;
        --text: #f4f4f4;
        --dim: #8b8bb2;
        --accent: #41a6f6;
        --yellow: #ffcd75;
        --green: #a7f070;
        --red: #b13e53;
        --orange: #ef7d57;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Courier New", "Microsoft YaHei", "PingFang SC", monospace;
        background: var(--bg);
        color: var(--text);
        letter-spacing: 0.5px;
        overflow: hidden;
        /* 像素点阵底纹 */
        background-image:
          repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 2px, transparent 2px 4px),
          radial-gradient(circle at 50% 0%, #2a2350 0%, var(--bg) 60%);
      }
      #app {
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ===== 顶部 ===== */
      header {
        flex-shrink: 0;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        background: var(--bg2);
        border-bottom: 3px solid var(--border-dk);
        box-shadow: 0 3px 0 rgba(0,0,0,0.4);
      }
      .title {
        font-weight: bold;
        font-size: 18px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .title .logo {
        display: inline-block;
        width: 18px; height: 18px;
        background: var(--yellow);
        box-shadow:
          6px 0 0 var(--accent), 0 6px 0 var(--red), 6px 6px 0 var(--green);
      }
      .title small { color: var(--dim); font-size: 12px; font-weight: normal; }

      .hud {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 13px;
      }
      .hud .chip {
        background: var(--panel);
        border: 2px solid var(--border-dk);
        padding: 4px 10px;
      }
      .hud .chip b { color: var(--yellow); }
      .hud .chip.t b { color: var(--accent); }

      .ctrls { display: flex; gap: 8px; }

      /* ===== 像素按钮 ===== */
      .btn {
        font-family: inherit;
        font-size: 13px;
        color: var(--text);
        background: var(--panel2);
        border: 2px solid var(--text);
        padding: 7px 12px;
        cursor: pointer;
        box-shadow: 3px 3px 0 #000;
        transition: transform 0.05s, box-shadow 0.05s;
      }
      .btn:hover { background: var(--border-dk); }
      .btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #000; }
      .btn.primary { background: var(--accent); color: #06122e; border-color: #06122e; }
      .btn.primary:hover { background: var(--yellow); }
      .btn.on { background: var(--green); color: #06122e; border-color: #06122e; }

      /* ===== 主体 ===== */
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .left {
        width: 340px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 3px solid var(--border-dk);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: auto;
      }
      .stage-wrap {
        background: #000;
        border: 3px solid var(--text);
        box-shadow: 4px 4px 0 #000;
        padding: 6px;
        display: flex;
        justify-content: center;
      }
      #stage {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: auto;
        display: block;
      }
      .stats { display: flex; flex-direction: column; gap: 7px; }
      .stat-row {
        display: grid;
        grid-template-columns: 44px 1fr 56px;
        align-items: center;
        gap: 8px;
        font-size: 12px;
      }
      .stat-name { color: var(--dim); }
      .stat-bar {
        height: 14px;
        background: #000;
        border: 2px solid var(--border-dk);
        position: relative;
        overflow: hidden;
      }
      .stat-bar i {
        display: block;
        height: 100%;
        background: var(--accent);
        background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0 4px, transparent 4px 8px);
        transition: width 0.4s ease;
      }
      /* 不同属性不同颜色 */
      .stat-row:nth-child(1) .stat-bar i { background-color: var(--red); }
      .stat-row:nth-child(2) .stat-bar i { background-color: var(--accent); }
      .stat-row:nth-child(3) .stat-bar i { background-color: var(--green); }
      .stat-row:nth-child(4) .stat-bar i { background-color: var(--orange); }
      .stat-row:nth-child(5) .stat-bar i { background-color: var(--yellow); }
      .stat-row:nth-child(6) .stat-bar i { background-color: #c84fa8; }
      .stat-row.warn .stat-bar i { background-color: var(--orange) !important; }
      .stat-row.bad .stat-bar i { background-color: var(--red) !important; animation: blink 0.6s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0.4; } }
      .stat-val { text-align: right; color: var(--text); font-weight: bold; }

      /* ===== 右侧日志 + 选项 ===== */
      .right {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        background: var(--bg);
      }
      .log-head {
        flex-shrink: 0;
        padding: 8px 18px;
        font-size: 12px;
        color: var(--dim);
        border-bottom: 2px solid var(--border-dk);
        background: var(--panel);
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 14px 18px;
        font-size: 14px;
        line-height: 1.7;
      }
      .log-line { margin-bottom: 4px; padding-left: 10px; border-left: 2px solid transparent; }
      .log-line.birth { color: var(--yellow); border-left-color: var(--yellow); font-weight: bold; }
      .log-line.talent { color: var(--accent); border-left-color: var(--accent); }
      .log-line.event { color: var(--text); border-left-color: var(--border-dk); margin-top: 8px; }
      .log-line.result { color: var(--green); }
      .log-line.delta { color: var(--orange); font-size: 12px; }
      .log-line.filler { color: var(--dim); }
      .log-line.mystic { color: #c84fa8; }
      .log-line.death { color: var(--red); border-left-color: var(--red); font-weight: bold; margin-top: 12px; }

      .choices {
        flex-shrink: 0;
        padding: 12px 18px 16px;
        background: var(--panel);
        border-top: 3px solid var(--border-dk);
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 70px;
      }
      .choice {
        font-family: inherit;
        font-size: 14px;
        text-align: left;
        color: var(--text);
        background: var(--panel2);
        border: 2px solid var(--border-dk);
        padding: 10px 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.08s, transform 0.05s;
      }
      .choice:hover { background: var(--border-dk); border-color: var(--accent); }
      .choice:active { transform: translateX(2px); }
      .choice .choice-idx {
        display: inline-block;
        width: 20px; height: 20px;
        line-height: 18px;
        text-align: center;
        background: var(--accent);
        color: #06122e;
        font-weight: bold;
        font-size: 12px;
        flex-shrink: 0;
      }
      .choice.continue { background: var(--green); color: #06122e; border-color: #06122e; justify-content: center; font-weight: bold; }
      .choice.continue .choice-idx { background: #06122e; color: var(--green); }

      /* ===== 模态框 ===== */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 8, 24, 0.85);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
      }
      .modal.show { display: flex; }
      .modal-box {
        background: var(--panel);
        border: 3px solid var(--text);
        box-shadow: 8px 8px 0 #000;
        width: 540px;
        max-width: 100%;
        max-height: 90vh;
        overflow: auto;
        padding: 22px 24px;
      }
      .modal-box h2 {
        margin: 0 0 4px;
        font-size: 20px;
        color: var(--yellow);
      }
      .modal-box h2 small { color: var(--dim); font-size: 12px; font-weight: normal; }
      .modal-box .sub { color: var(--dim); font-size: 13px; margin-bottom: 16px; }
      .section-label {
        font-size: 12px;
        color: var(--accent);
        letter-spacing: 2px;
        margin: 14px 0 8px;
        text-transform: uppercase;
      }

      .attr-row {
        display: grid;
        grid-template-columns: 56px 1fr 40px;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 13px;
      }
      .attr-name { color: var(--dim); }
      .attr-bar { height: 16px; background: #000; border: 2px solid var(--border-dk); overflow: hidden; }
      .attr-bar i { display: block; height: 100%; background: var(--accent); background-image: repeating-linear-gradient(90deg, rgba(255,255,255,0.25) 0 4px, transparent 4px 8px); }
      .attr-val { text-align: right; font-weight: bold; color: var(--yellow); }
      #c-total { color: var(--dim); font-size: 12px; margin-top: 6px; }

      .talents { display: flex; flex-direction: column; gap: 8px; }
      .talent {
        background: var(--panel2);
        border: 2px solid var(--border-dk);
        padding: 9px 12px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .talent:hover { border-color: var(--accent); }
      .talent.selected { border-color: var(--yellow); background: var(--border-dk); box-shadow: inset 0 0 0 2px var(--yellow); }
      .talent b { color: var(--yellow); font-size: 14px; }
      .talent span { color: var(--dim); font-size: 12px; }

      .modal-foot {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-end;
      }
      #c-tip { color: var(--red); font-size: 12px; margin-right: auto; }

      /* 结局 */
      .end-head { text-align: center; margin-bottom: 12px; }
      .end-grade {
        font-size: 64px;
        font-weight: bold;
        line-height: 1;
        margin: 6px 0;
        text-shadow: 4px 4px 0 #000;
      }
      .end-grade.g-s { color: var(--yellow); }
      .end-grade.g-a { color: var(--green); }
      .end-grade.g-b { color: var(--accent); }
      .end-grade.g-c { color: var(--orange); }
      .end-grade.g-d { color: var(--red); }
      .end-grade.g-f { color: #c84fa8; }
      .end-title { font-size: 18px; color: var(--text); }
      #end-summary { font-size: 13px; line-height: 1.8; margin: 12px 0; }
      #end-summary p { margin: 4px 0; }
      #end-summary .muted { color: var(--dim); }
      #end-summary .ach { color: var(--yellow); }
      #end-log {
        max-height: 220px;
        overflow-y: auto;
        background: #000;
        border: 2px solid var(--border-dk);
        padding: 10px 12px;
        font-size: 12px;
        line-height: 1.6;
        margin: 10px 0 16px;
      }

      /* 滚动条 */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: var(--border-dk); border: 2px solid #000; }

      @media (max-width: 720px) {
        .left { width: 100%; border-right: none; border-bottom: 3px solid var(--border-dk); }
        main { flex-direction: column; }
        .right { min-height: 320px; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="title"><a href="../../index.html" style="color:var(--accent);text-decoration:none;font-size:13px;margin-right:12px;opacity:.85;">← 主页</a><span class="logo"></span>人生模拟器 <small>PIXEL LIFE SIM</small></div>
        <div class="hud">
          <span class="chip"><b id="hud-name">--</b></span>
          <span class="chip"><b id="hud-age">--</b></span>
          <span class="chip t">天赋·<b id="hud-talent">--</b></span>
        </div>
        <div class="ctrls">
          <button class="btn" id="btn-auto">⏩ 自动</button>
          <button class="btn" id="btn-restart">↻ 重开</button>
        </div>
      </header>

      <main>
        <section class="left">
          <div class="stage-wrap">
            <canvas id="stage" width="192" height="192"></canvas>
          </div>
          <div class="stats" id="stats"></div>
        </section>

        <section class="right">
          <div class="log-head">▌ 人生轨迹</div>
          <div id="log"></div>
          <div class="choices" id="choices"></div>
        </section>
      </main>
    </div>

    <!-- 角色创建 -->
    <div class="modal show" id="creation">
      <div class="modal-box">
        <h2>开启你的人生 <small>· CHARACTER CREATION</small></h2>
        <div class="sub">掷出初始属性，挑选一个天赋，然后降临人世。</div>

        <div class="section-label">▌ 初始属性</div>
        <div id="c-attrs"></div>
        <div id="c-total"></div>

        <div class="section-label">▌ 选择天赋（三选一）</div>
        <div class="talents" id="c-talents"></div>

        <div class="modal-foot">
          <span id="c-tip"></span>
          <button class="btn" id="c-reroll">🎲 重掷属性</button>
          <button class="btn" id="c-reroll-talent">🔄 换天赋</button>
          <button class="btn primary" id="c-start">开始人生 ▶</button>
        </div>
      </div>
    </div>

    <!-- 结局 -->
    <div class="modal" id="ending">
      <div class="modal-box">
        <div class="end-head">
          <div class="sub" style="margin:0">人生终结</div>
          <div class="end-grade" id="end-grade">-</div>
          <div class="end-title" id="end-title">-</div>
        </div>
        <div id="end-summary"></div>
        <div class="section-label">▌ 一生回放</div>
        <div id="end-log"></div>
        <div class="modal-foot">
          <button class="btn primary" id="end-restart">↻ 再活一次</button>
        </div>
      </div>
    </div>

    <script>
      const game = new LifeGame(document.getElementById("app"));
      game.start();

      // 顶部按钮
      document.getElementById("btn-auto").onclick = () => game.toggleAuto();
      document.getElementById("btn-restart").onclick = () => game.restart();
      document.getElementById("end-restart").onclick = () => game.restart();

      // 键盘：1-4 选选项 / Enter 下一年
      document.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        const choices = document.getElementById("choices");
        if (!choices) return;
        const btns = choices.querySelectorAll(".choice");
        if (!btns.length) return;
        if (e.key >= "1" && e.key <= "9") {
          const idx = parseInt(e.key, 10) - 1;
          if (btns[idx]) btns[idx].click();
        } else if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          btns[0].click();
        }
      });
    </script>
  </body>
</html>
