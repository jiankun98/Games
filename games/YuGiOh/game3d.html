<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏王·决斗对战（3D）</title>
    <script src="./cards.js"></script>
    <script src="./index.js"></script>
    <script src="./ai-player.js"></script>
    <style>
      :root {
        --bg: #0b0e16;
        --panel: #1a2030;
        --panel-2: #232b3f;
        --border: #324056;
        --text: #eef1f7;
        --dim: #8a93a8;
        --accent: #e6b24a;
        --accent-2: #c75548;
        --mon: #d9b441;
        --spell: #2fae63;
        --trap: #a45fdc;
        --lp-me: #4aa3ff;
        --lp-ai: #e5484d;
        --ok: #43b581;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }

      /* ============ 顶栏 ============ */
      header {
        height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
        padding: 0 16px; background: rgba(16,20,32,0.8); backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--border); z-index: 20;
      }
      header a.home { color: var(--dim); text-decoration: none; font-size: 13px; }
      header a.home:hover { color: var(--accent); }
      header .title { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      header .title b { color: var(--accent); }
      .phase-tag {
        padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600;
        background: var(--panel-2); border: 1px solid var(--border); transition: all 0.3s;
      }
      .phase-tag.me { color: var(--lp-me); border-color: var(--lp-me); box-shadow: 0 0 10px rgba(74,163,255,0.3); }
      .phase-tag.ai { color: var(--lp-ai); border-color: var(--lp-ai); box-shadow: 0 0 10px rgba(229,72,77,0.3); }
      .turn-info { font-size: 12px; color: var(--dim); }
      header .spacer { flex: 1; }
      .icon-btn {
        width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer;
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
        font-size: 15px; color: var(--text); transition: all 0.15s;
      }
      .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
      .btn {
        background: linear-gradient(180deg, var(--accent), #c89432); color: #1a1208; border: none;
        border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
        box-shadow: 0 2px 8px rgba(230,178,74,0.3); transition: all 0.15s;
      }
      .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }
      .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); box-shadow: none; }

      /* ============ 布局 ============ */
      .board { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 6px 12px; gap: 4px; }
      .lp-row { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
      .lp-name { font-size: 13px; font-weight: 700; width: 56px; }
      .lp-name.ai { color: var(--lp-ai); }
      .lp-name.me { color: var(--lp-me); }
      .lp-bar { flex: 1; height: 12px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; }
      .lp-fill { height: 100%; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
      .lp-fill.me { background: linear-gradient(90deg, #1e5fa0, var(--lp-me)); }
      .lp-fill.ai { background: linear-gradient(90deg, #8a2f2f, var(--lp-ai)); }
      .lp-bar.flash { animation: lpFlash 0.5s ease; }
      @keyframes lpFlash { 0%,100% { box-shadow: none; } 30% { box-shadow: 0 0 18px rgba(229,72,77,0.9); } }
      .lp-val { font-size: 13px; font-weight: 700; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

      /* 3D 舞台 */
      .stage { flex: 1; min-height: 0; position: relative; border-radius: 14px; overflow: hidden; border: 1px solid var(--mat-edge, #2b3550); cursor: pointer; }
      .stage canvas { display: block; }
      .stage .hint3d {
        position: absolute; left: 12px; top: 10px; z-index: 3; font-size: 11px; color: var(--dim);
        background: rgba(16,20,32,0.6); border-radius: 8px; padding: 4px 10px; pointer-events: none;
      }
      /* 堆数量标签（投影到 3D 场景上的 DOM 小签） */
      .pile-tag {
        position: absolute; z-index: 3; transform: translate(-50%, -50%); pointer-events: none;
        background: rgba(16,20,32,0.75); border: 1px solid var(--border); border-radius: 8px;
        padding: 1px 6px; font-size: 10px; color: var(--text); white-space: nowrap;
      }

      /* ============ 回合控制条（底部） ============ */
      .turn-bar {
        flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 6px 14px; border-top: 1px solid var(--border);
        background: rgba(16,20,32,0.88); border-radius: 0 0 12px 12px;
      }
      .turn-bar .tb-phase { display: flex; flex-direction: column; gap: 1px; min-width: 200px; }
      .turn-bar .tb-phase > div:first-child { font-size: 13px; font-weight: 700; color: var(--lp-me); letter-spacing: 1px; white-space: nowrap; }
      .turn-bar .tb-tip { font-size: 11px; color: var(--dim); white-space: nowrap; letter-spacing: 0.5px; }
      .turn-bar.ai .tb-phase > div:first-child { color: var(--lp-ai); }
      .tb-btn {
        border: none; border-radius: 18px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease; white-space: nowrap;
      }
      .tb-btn.primary { background: linear-gradient(180deg, var(--accent), #c89432); color: #1a1208; box-shadow: 0 3px 12px rgba(230,178,74,0.4); }
      .tb-btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
      .tb-btn:hover { filter: brightness(1.12); transform: translateY(-2px); }
      .tb-btn:active { transform: translateY(0) scale(0.94); filter: brightness(0.95); }
      .tb-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }

      /* ============ 浮动操作条 ============ */
      .mode-bar {
        position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); z-index: 55;
        background: rgba(16,20,32,0.95); border: 1px solid var(--accent); border-radius: 24px;
        padding: 8px 10px; display: none; gap: 8px; align-items: center;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: popIn 0.16s ease;
      }
      .mode-bar.show { display: flex; }
      .mode-bar .lbl { font-size: 12px; color: var(--dim); padding: 0 8px; }
      .mode-bar .btn { padding: 6px 14px; font-size: 12px; }

      /* ============ 连锁横幅 ============ */
      .chain-banner {
        position: fixed; top: 52px; left: 50%; transform: translateX(-50%); z-index: 40;
        background: rgba(16,20,32,0.96); border: 1px solid var(--accent); border-radius: 10px;
        padding: 8px 14px; font-size: 12px; display: none; max-width: 70vw;
        box-shadow: 0 6px 22px rgba(0,0,0,0.5);
      }
      .chain-banner.show { display: block; animation: popIn 0.18s ease; }
      .chain-banner .links { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
      .chain-banner .link { font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; animation: linkIn 0.2s ease; }
      @keyframes linkIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }

      /* ============ 日志面板 ============ */
      .log-panel {
        position: fixed; bottom: 0; left: 0; right: 0; height: 240px; z-index: 50;
        background: rgba(12,16,26,0.97); border-top: 1px solid var(--accent); display: none;
        flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,0.5); animation: slideUp 0.2s ease;
      }
      .log-panel.show { display: flex; }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .log-panel header { height: 38px; border-bottom: 1px solid var(--border); background: var(--panel); }
      .log-panel .log-body { flex: 1; overflow-y: auto; padding: 10px 16px; font-family: "SF Mono", Consolas, monospace; font-size: 12px; line-height: 1.6; }
      .log-panel .entry { color: #cdd3dc; }
      .log-panel .entry.imp { color: var(--accent); }
      .log-panel .entry:hover { background: rgba(255,255,255,0.04); }

      /* ============ 模态 ============ */
      .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; place-items: center; z-index: 70; padding: 20px; backdrop-filter: blur(2px); }
      .modal-mask.show { display: grid; animation: fadeIn 0.15s; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 680px; width: 100%; max-height: 84vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,0.6); animation: popIn 0.18s ease; }
      .modal h3 { margin: 0 0 14px; font-size: 16px; }
      .modal .opts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .modal .opt { cursor: pointer; text-align: center; }
      .modal .opt:hover .card { transform: translateY(-6px) scale(1.05); }
      .modal .opt-label { font-size: 11px; color: var(--dim); margin-top: 4px; max-width: 96px; }
      .modal .btns { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
      .help-list { font-size: 13px; color: var(--dim); line-height: 1.8; }
      .help-list b { color: var(--accent); }
      .help-list p { margin: 8px 0; }
      .gameover { text-align: center; }
      .gameover h2 { font-size: 32px; margin: 10px 0; }
      .gameover h2.win { color: var(--ok); text-shadow: 0 0 20px rgba(67,181,129,0.5); }
      .gameover h2.lose { color: var(--lp-ai); text-shadow: 0 0 20px rgba(229,72,77,0.5); }
      .pick-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 12px 0 8px; letter-spacing: 2px; }
      .pick-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .opt.picked .card { box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(230,178,74,0.55); }

      /* ============ DOM 卡牌（仅用于菜单/弹窗/列表展示） ============ */
      .card {
        border-radius: 7px; position: relative; cursor: pointer; flex-shrink: 0;
        width: 96px; height: 134px; overflow: hidden;
        border: 1px solid rgba(0,0,0,0.5); box-shadow: 0 2px 6px rgba(0,0,0,0.45);
        transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      }
      .card.monster { background: linear-gradient(160deg, #e8c64b, #b8902a); }
      .card.spell { background: linear-gradient(160deg, #3fb06c, #247a42); }
      .card.trap { background: linear-gradient(160deg, #a85fd6, #6e3392); }
      .card .namebar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 4;
        background: linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.28));
        color: #fff; font-size: 10px; padding: 2px 5px; line-height: 1.15; overflow: hidden; font-weight: 700;
        text-shadow: 0 1px 2px rgba(0,0,0,0.85);
      }
      .card .art { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
      .card .art::before {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 42%, rgba(255,255,255,0.20), transparent 55%);
      }
      .card .art .em { font-size: 30px; opacity: 0.92; text-shadow: 0 1px 3px rgba(0,0,0,0.45); position: relative; }
      .card .attr {
        position: absolute; top: 16px; right: 3px; z-index: 3; font-size: 10px;
        background: rgba(0,0,0,0.35); border-radius: 4px; padding: 0 3px; line-height: 1.4;
      }
      .card .stars { position: absolute; top: 15px; left: 0; right: 0; text-align: center; z-index: 3; font-size: 7px; color: #ffe08a; letter-spacing: 0.5px; text-shadow: 0 1px 1px #000; }
      .card .foot {
        position: absolute; bottom: 0; left: 0; right: 0; z-index: 4;
        background: linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.82));
        color: #fff; font-size: 10px; padding: 2px 5px 3px; display: flex; justify-content: space-between;
        font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.85); letter-spacing: 0.3px;
      }
      .card .foot b { color: #ffe08a; font-variant-numeric: tabular-nums; }
      .card .sub {
        position: absolute; bottom: 18px; left: 0; right: 0; z-index: 3;
        font-size: 8px; color: rgba(255,255,255,0.92); padding: 0; text-align: center;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      .card .scan { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; border-radius: 7px; }
      .card.has-art .namebar, .card.has-art .attr, .card.has-art .stars, .card.has-art .sub, .card.has-art .em { display: none; }
      .card.has-art:hover .namebar { display: block; }
      .card.back { background: repeating-linear-gradient(45deg, #3a2350 0 8px, #2c1a3e 8px 16px); border: 1px solid #5a3a78; }
      .card.back .art::after { content: "✦"; font-size: 22px; color: rgba(255,255,255,0.45); }
      .card.back .namebar, .card.back .foot, .card.back .stars, .card.back .attr, .card.back .sub { display: none; }
      .card.set { background: repeating-linear-gradient(45deg, #3a2350 0 8px, #2c1a3e 8px 16px); border: 1px solid #5a3a78; transform: rotate(90deg); }
      .card.set .namebar, .card.set .art, .card.set .foot, .card.set .stars, .card.set .attr, .card.set .sub { display: none; }
      .card-menu .menu-card { width: 116px; height: 162px; }
      .card-menu .menu-card .namebar { font-size: 11px; padding: 3px 6px; }
      .card-menu .menu-card .art .em { font-size: 44px; }
      .card-menu .menu-card .attr { font-size: 13px; top: 22px; right: 5px; }
      .card-menu .menu-card .stars { top: 22px; font-size: 9px; }
      .card-menu .menu-card .foot { font-size: 11px; padding: 2px 7px 3px; }
      .card-menu .menu-card .sub { font-size: 8px; bottom: 19px; }

      /* ============ popover 卡牌操作菜单 ============ */
      .backdrop { position: fixed; inset: 0; z-index: 60; }
      .card-menu {
        position: fixed; z-index: 61; background: var(--panel); border: 1px solid var(--accent);
        border-radius: 12px; padding: 12px; box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 0 0 1px rgba(230,178,74,0.2);
        display: flex; gap: 12px; min-width: 280px; animation: popIn 0.16s ease;
      }
      @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(6px); } to { opacity: 1; transform: scale(1); } }
      .card-menu .menu-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
      .card-menu .meta { font-size: 11px; color: var(--dim); line-height: 1.4; }
      .card-menu .meta b { color: var(--text); font-size: 13px; }
      .card-menu .text { font-size: 11px; line-height: 1.5; color: #c8c0d2; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px 8px; max-height: 70px; overflow-y: auto; }
      .card-menu .actions { display: flex; flex-direction: column; gap: 6px; }
      .card-menu .act-btn {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-size: 13px;
        font-weight: 600; transition: all 0.12s;
      }
      .card-menu .act-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(2px); background: rgba(230,178,74,0.1); }
      .card-menu .act-btn.primary { background: linear-gradient(180deg, var(--accent), #c89432); color: #1a1208; border-color: transparent; }
      .card-menu .act-btn .ic { width: 22px; height: 22px; display: grid; place-items: center; font-size: 15px; }
      .card-menu .empty { font-size: 12px; color: var(--dim); padding: 8px 0; }

      /* ============ Toast / 特效 ============ */
      .toast {
        position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
        background: rgba(16,20,32,0.95); color: #fff; padding: 9px 18px; border-radius: 20px;
        font-size: 13px; border: 1px solid var(--accent); opacity: 0; transition: opacity 0.25s, transform 0.25s;
        z-index: 80; pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
      .screen-flash { position: fixed; inset: 0; pointer-events: none; z-index: 90; opacity: 0; }
      .screen-flash.on { animation: scrFlash 0.4s ease; }
      @keyframes scrFlash { 0% { opacity: 0; } 20% { opacity: 0.5; } 100% { opacity: 0; } }

      .fx { position: fixed; pointer-events: none; z-index: 95; }
      .fx-dmg { transform: translate(-50%, -50%); }
      .fx-dmg b.fx-dmg-txt {
        display: block; font-size: 30px; font-weight: 900; color: #ff6b6b; font-style: normal;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9); animation: fxDmgUp 1s ease-out forwards; transform: translate(-50%, -50%);
      }
      .fx-dmg b.small { font-size: 19px; color: #ff9d9d; }
      @keyframes fxDmgUp {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        15% { opacity: 1; transform: translate(-50%, -62%) scale(1.2); }
        100% { opacity: 0; transform: translate(-50%, -170%) scale(1); }
      }
      .fx-burst-txt {
        font-size: 32px; font-weight: 900; color: #ffd24a; white-space: nowrap;
        text-shadow: 0 0 16px rgba(255,120,40,0.9); transform: translate(-50%, -50%); animation: fxBurstPop 0.55s ease-out forwards;
      }
      @keyframes fxBurstPop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1.35); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
      }
      .fx-act-banner, .fx-turn-banner { left: 0; right: 0; text-align: center; }
      .fx-act-banner { top: 30%; animation: fxBannerIn 1s ease forwards; }
      .fx-act-txt {
        display: inline-block; background: rgba(10,14,24,0.94); border: 1px solid var(--accent); border-radius: 12px;
        padding: 8px 20px; font-size: 16px; font-weight: 700; color: var(--accent);
        box-shadow: 0 0 26px rgba(230,178,74,0.35);
      }
      .fx-turn-banner { top: 34%; animation: fxBannerIn 1.3s ease forwards; }
      .turn-banner-inner {
        display: inline-block; padding: 12px 36px; border-radius: 16px; background: rgba(10,14,24,0.94);
        border: 2px solid var(--accent); box-shadow: 0 0 44px rgba(230,178,74,0.4); position: relative; overflow: hidden;
      }
      .turn-banner-inner::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
        transform: translateX(-100%); animation: tbSweep 0.9s ease 0.1s;
      }
      @keyframes tbSweep { to { transform: translateX(100%); } }
      .turn-banner-inner b { display: block; font-size: 32px; letter-spacing: 10px; color: var(--accent); }
      .turn-banner-inner span { font-size: 13px; color: var(--dim); letter-spacing: 4px; }
      .turn-banner-inner.me b { color: var(--lp-me); }
      .turn-banner-inner.ai b { color: var(--lp-ai); }
      .fx-phase-banner { left: 0; right: 0; top: 26%; text-align: center; animation: fxBannerIn 1.5s ease forwards; }
      .fx-phase-inner {
        display: inline-block; background: rgba(16,20,32,0.93); border: 1px solid var(--lp-me); border-radius: 12px;
        padding: 7px 22px; box-shadow: 0 0 22px rgba(74,163,255,0.28);
      }
      .fx-phase-inner b { display: block; color: var(--lp-me); font-size: 17px; letter-spacing: 3px; }
      .fx-phase-inner span { display: block; color: #b8c2d8; font-size: 12px; margin-top: 3px; letter-spacing: 1px; }
      .fx-phase-inner.ai { border-color: var(--lp-ai); box-shadow: 0 0 22px rgba(229,72,77,0.28); }
      .fx-phase-inner.ai b { color: var(--lp-ai); }
      @keyframes fxBannerIn {
        0% { opacity: 0; transform: translateY(-14px); }
        14% { opacity: 1; transform: translateY(0); }
        78% { opacity: 1; }
        100% { opacity: 0; transform: translateY(8px); }
      }
      .board.shake { animation: boardShake 0.4s ease; }
      @keyframes boardShake {
        0%, 100% { transform: none; }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="home" href="../../index.html">← 主页</a>
      <div class="title">游戏王 · <b>决斗</b> <span style="color:var(--accent);font-size:11px;">3D</span></div>
      <span class="phase-tag" id="phase-tag">准备</span>
      <span class="turn-info" id="turn-info">第 1 回合</span>
      <div class="spacer"></div>
      <div class="icon-btn" id="btn-pace" title="游戏节奏">▶</div>
      <div class="icon-btn" id="btn-sfx" title="音效开关">🔊</div>

      <header><div style="font-size:14px;font-weight:700;">对局日志</div><div class="spacer" style="flex:1;"></div><div class="icon-btn" id="btn-log-close">✕</div></header>

    <script type="importmap">
      { "imports": { "three": "../../node_modules/three/build/three.module.js" } }
    </script>
    <script type="module">
      import * as THREE from "three";

      "use strict";
      const $ = (id) => document.getElementById(id);
      const ATTR_EM = { "光": "☀", "暗": "☾", "地": "⛰", "水": "💧", "炎": "🔥", "风": "🌬" };
      const RACE_EM = { "龙族": "🐉", "魔法师族": "🧙", "恶魔族": "😈", "战士族": "⚔", "岩石族": "🪨", "兽族": "🐺", "机械族": "⚙", "昆虫族": "🐛", "水族": "🐟", "爬虫类族": "🦎", "兽战士族": "🦁", "鸟兽族": "🦅", "雷族": "⚡", "植物族": "🌿", "天使族": "👼" };

      let duel;
      let mode = null;
      let attackZone = null;
      let tributeHandIdx = null;
      let tributePool = [];
      let toastTimer = null;
      let logBuf = [];
      let prevLp = { me: 8000, ai: 8000 };
      let winnerShown = false;
      let menuOpen = false;
      let deckChoice = "classic";
      let aiDeckChoice = "classic";
      let lastChainLen = 0;
      const PACE_PRESETS = {
        fast: { label: "⚡ 快速", pace: 120, promptDelay: 100 },
        normal: { label: "▶ 标准", pace: 350, promptDelay: 220 },
        slow: { label: "🐢 悠闲", pace: 650, promptDelay: 400 },
      };
      let paceMode = (() => { try { return localStorage.getItem("ygoPace2") || "slow"; } catch (e) { return "slow"; } })();
      if (!PACE_PRESETS[paceMode]) paceMode = "slow";
      let sfxOn = true;
      let ac = null;

      /* ===================== Three.js 场景 ===================== */
      const stage = $("stage");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0e16);
      scene.fog = new THREE.Fog(0x0b0e16, 14, 30);

      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.set(0, 5.0, 9.0);
      camera.lookAt(0, -0.3, -0.8);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      stage.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0x8899cc, 0x1a2030, 0.9));
      const dir = new THREE.DirectionalLight(0xffffff, 1.1);
      dir.position.set(4, 8, 5);
      scene.add(dir);

      // 桌面
      const tableMat = new THREE.MeshStandardMaterial({ color: 0x151b2a, roughness: 0.85, metalness: 0.15 });
      const table = new THREE.Mesh(new THREE.PlaneGeometry(19, 14), tableMat);
      table.rotation.x = -Math.PI / 2;
      scene.add(table);
      // 桌面装饰线
      const grid = new THREE.GridHelper(19, 19, 0x2b3550, 0x1d2436);
      grid.position.y = 0.01;
      scene.add(grid);
      // 中央场地分隔光带
      const lane = new THREE.Mesh(
        new THREE.PlaneGeometry(12.4, 0.12),
        new THREE.MeshBasicMaterial({ color: 0xe6b24a, transparent: true, opacity: 0.35 })
      );
      lane.rotation.x = -Math.PI / 2;
      lane.position.y = 0.02;
      scene.add(lane);
      // 场地分区底色：玩家半场（近，蓝调）/ AI 半场（远，红调），覆盖怪兽区+魔陷区两行
      const meZone = new THREE.Mesh(
        new THREE.PlaneGeometry(11.0, 2.7),
        new THREE.MeshBasicMaterial({ color: 0x2b4a8c, transparent: true, opacity: 0.22, depthWrite: false })
      );
      meZone.rotation.x = -Math.PI / 2;
      meZone.position.set(0, 0.012, 2.75);
      scene.add(meZone);
      const aiZone = new THREE.Mesh(
        new THREE.PlaneGeometry(11.0, 2.7),
        new THREE.MeshBasicMaterial({ color: 0x8c2f2f, transparent: true, opacity: 0.22, depthWrite: false })
      );
      aiZone.rotation.x = -Math.PI / 2;
      aiZone.position.set(0, 0.012, -2.75);
      scene.add(aiZone);

      /* ===================== 卡牌纹理 ===================== */
      const TEX_W = 512, TEX_H = 720; // 卡牌纹理分辨率（约 1:1.41）
      const texCache = new Map(); // key -> CanvasTexture
      function texKey(card, faceUp, landscape) {
        return (faceUp ? "u:" : "d:") + (card ? card.uid : "back") + (landscape ? ":L" : "");
      }
      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      // 名字条 + 数值条叠加层（程序卡面与立绘卡面共用，按画布尺寸等比缩放）
      function drawCardOverlay(ctx, card, w, h) {
        const isMon = card.type === "monster";
        // 顶部名字条
        const nbh = Math.round(h * 0.11);
        const nb = ctx.createLinearGradient(0, 0, 0, nbh);
        nb.addColorStop(0, "rgba(0,0,0,0.75)"); nb.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = nb;
        ctx.fillRect(0, 0, w, nbh);
        ctx.fillStyle = "#fff";
        ctx.font = "bold " + Math.round(w * 0.075) + "px 'PingFang SC','Microsoft YaHei',sans-serif";
        ctx.textAlign = "left"; ctx.textBaseline = "top";
        ctx.fillText(card.name, Math.round(w * 0.03), Math.round(h * 0.012));
        if (isMon) {
          ctx.textAlign = "right";
          ctx.fillStyle = "rgba(255,255,255,0.9)";
          ctx.font = Math.round(w * 0.06) + "px serif";
          ctx.fillText((ATTR_EM[card.attribute] || "") + " " + "★".repeat(Math.min(card.level || 0, 12)), w - Math.round(w * 0.024), Math.round(h * 0.042));
        }
        // 底部数值条
        const fbh = Math.round(h * 0.10);
        const fb = ctx.createLinearGradient(0, h - fbh, 0, h);
        fb.addColorStop(0, "rgba(0,0,0,0)"); fb.addColorStop(1, "rgba(0,0,0,0.82)");
        ctx.fillStyle = fb;
        ctx.fillRect(0, h - fbh, w, fbh);
        ctx.font = "bold " + Math.round(w * 0.075) + "px 'SF Mono',Consolas,monospace";
        ctx.textBaseline = "middle";
        if (isMon) {
          const st = optsStats(card);
          ctx.textAlign = "left";
          ctx.fillStyle = "#ffe08a";
          ctx.fillText("ATK " + st.atk, Math.round(w * 0.035), h - Math.round(fbh / 2));
          ctx.textAlign = "right";
          ctx.fillText("DEF " + st.def, w - Math.round(w * 0.035), h - Math.round(fbh / 2));
        } else {
          ctx.textAlign = "left";
          ctx.fillStyle = "rgba(255,255,255,0.85)";
          ctx.fillText(card.type === "spell" ? "魔法" : "陷阱", Math.round(w * 0.035), h - Math.round(fbh / 2));
          ctx.textAlign = "right";
          ctx.fillText(card.subtype || "", w - Math.round(w * 0.035), h - Math.round(fbh / 2));
        }
      }
      // 游戏王卡背（本地图片，同源无污染；未加载完成前用程序卡背回退）
      const backImg = new Image();
      backImg.src = "assets/card-back.jpg";
      let backImgReady = false;
      backImg.onload = () => { backImgReady = true; refreshBackTexture(); };
      backImg.onerror = () => { backImgReady = false; };
      // 卡背图就绪后：清空背面纹理缓存并重新绑定所有卡背
      function refreshBackTexture() {
        for (const key of [...texCache.keys()]) if (key.startsWith("d:")) texCache.delete(key);
        for (const g of cardMeshes.values()) {
          const landscape = isLandscape(g.userData.slot, g.userData.card);
          g.userData.backMat.map = getTexture(null, false, landscape);
          g.userData.backMat.needsUpdate = true;
          if (!g.userData.faceUp) {
            g.userData.frontMat.map = getTexture(g.userData.card, false, landscape);
            g.userData.frontMat.needsUpdate = true;
          }
        }
      }
      function makeCardTexture(card, faceUp) {
        const cv = document.createElement("canvas");
        cv.width = TEX_W; cv.height = TEX_H;
        const ctx = cv.getContext("2d");
        const r = 28;
        if (!faceUp) {
          if (backImgReady && backImg.naturalWidth) {
            // 游戏王卡背：本地图片 cover 铺满整张卡背
            const bw = backImg.naturalWidth, bh = backImg.naturalHeight;
            const sc = Math.max(TEX_W / bw, TEX_H / bh);
            ctx.drawImage(backImg, (TEX_W - bw * sc) / 2, (TEX_H - bh * sc) / 2, bw * sc, bh * sc);
          } else {
            // 未加载完成时的程序卡背回退
            ctx.fillStyle = "#3a2350";
            roundRect(ctx, 0, 0, TEX_W, TEX_H, r); ctx.fill();
            ctx.strokeStyle = "#5a3a78"; ctx.lineWidth = 8;
            roundRect(ctx, 6, 6, TEX_W - 12, TEX_H - 12, r - 6); ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,0.25)";
            ctx.font = "bold 180px serif";
            ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText("✦", TEX_W / 2, TEX_H / 2);
          }
        } else {
          // 程序化卡面（无立绘时的回退；有立绘时走 makeArtTexture，不经过 Canvas）
          const isMon = card.type === "monster";
          const grad = ctx.createLinearGradient(0, 0, TEX_W, TEX_H);
          if (isMon) { grad.addColorStop(0, "#e8c64b"); grad.addColorStop(1, "#b8902a"); }
          else if (card.type === "spell") { grad.addColorStop(0, "#3fb06c"); grad.addColorStop(1, "#247a42"); }
          else { grad.addColorStop(0, "#a85fd6"); grad.addColorStop(1, "#6e3392"); }
          ctx.fillStyle = grad;
          roundRect(ctx, 0, 0, TEX_W, TEX_H, r); ctx.fill();
          const glow = ctx.createRadialGradient(TEX_W / 2, TEX_H * 0.42, 40, TEX_W / 2, TEX_H * 0.42, TEX_H * 0.7);
          glow.addColorStop(0, "rgba(255,255,255,0.25)");
          glow.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, TEX_W, TEX_H);
          ctx.font = "150px serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillStyle = "rgba(0,0,0,0.55)";
          ctx.fillText(isMon ? (RACE_EM[card.race] || "★") : (card.type === "spell" ? "✨" : "🪤"), TEX_W / 2, TEX_H * 0.42);
          // 名字条 + 数值条
          drawCardOverlay(ctx, card, TEX_W, TEX_H);
        }
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
      }
      const artCache = new Map(); // uid -> Texture | null（立绘纹理，null=未就绪走程序卡面）
      const ART_ORIGIN = "https://images.ygoprodeck.com/images/cards_cropped/";
      function artUrl(password) {
        // ygoprodeck 裁剪图按数字 id 命名（无前导零），8 位卡密需去掉前导零拼接
        return "/api/img?url=" + encodeURIComponent(ART_ORIGIN + String(Number(password)) + ".jpg");
      }
      // 立绘纹理：方形立绘按卡面竖版比例居中裁剪（cover），再传 CanvasTexture
      // （图片走本地代理同源，无污染；img.decode() 确保像素解码完成再绘制，避免空白/灰面）
      function buildArtTexture(img, card) {
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const A = CARD_W / CARD_H; // 卡面宽高比 ≈0.707（竖版）
        const sw = Math.min(iw, Math.round(ih * A));
        const sh = Math.min(ih, Math.round(iw / A));
        const cv = document.createElement("canvas");
        cv.width = sw; cv.height = sh;
        const ctx = cv.getContext("2d");
        ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, 0, 0, sw, sh);
        // 名字条 + 数值条叠加在立绘上
        drawCardOverlay(ctx, card, sw, sh);
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
      }
      function ensureArt(card) {
        if (!card || !card.password || artCache.has(card.uid)) return;
        const img = new Image();
        img.src = artUrl(card.password);
        img.onload = () => {
          // decode() 确保像素数据就绪，避免 drawImage/上传拿到空白
          img.decode().then(() => {
            artCache.set(card.uid, buildArtTexture(img, card));
            refreshCardTexture(card.uid);
          }).catch(() => { artCache.set(card.uid, null); });
        };
        img.onerror = () => { artCache.set(card.uid, null); };
        artCache.set(card.uid, null); // 占位：未就绪前用程序卡面
      }
      // 横向（防守/埋伏）纹理：在竖版纹理基础上绕中心旋转 -90°，恰好铺满横放卡面（无拉伸），立绘朝上
      function landscapeClone(tex) {
        const c = tex.clone();
        c.center.set(0.5, 0.5);
        c.rotation = -Math.PI / 2;
        return c;
      }
      function buildTexture(card, faceUp, landscape) {
        let t = null;
        if (faceUp && card && card.password) t = artCache.get(card.uid);
        if (!t) t = makeCardTexture(card, faceUp);
        return landscape ? landscapeClone(t) : t;
      }
      function getTexture(card, faceUp, landscape) {
        const key = texKey(card, faceUp, landscape);
        if (!texCache.has(key)) texCache.set(key, buildTexture(card, faceUp, landscape));
        return texCache.get(key);
      }
      function optsStats(card) {
        if (duel && duel.state) { try { return duel.stats(card); } catch (e) { /* 未开局 */ } }
        return { atk: card.atk ?? 0, def: card.def ?? 0 };
      }
      function refreshCardTexture(uid) {
        texCache.delete("u:" + uid);
        texCache.delete("u:" + uid + ":L");
        for (const m of cardMeshes.values()) {
          if (m.userData.card && m.userData.card.uid === uid && m.userData.faceUp) {
            const t = getTexture(m.userData.card, true, isLandscape(m.userData.slot, m.userData.card));
            m.userData.frontMat.map = t;
            m.userData.frontMat.needsUpdate = true;
          }
        }
      }

      /* ===================== 3D 卡牌 ===================== */
      const CARD_W = 1.06, CARD_H = 1.5, CARD_T = 0.045;
      const cardMeshes = new Map(); // uid -> Group
      const pileMeshes = new Map(); // key -> Group（卡组/墓地/额外/除外/场地）
      const pileTags = new Map(); // key -> DOM 标签

      const sideMat = new THREE.MeshStandardMaterial({ color: 0xe8e4da, roughness: 0.6 });
      function makeCard3D() {
        const g = new THREE.Group();
        // 卡面用 Basic 材质：直接显示纹理颜色，不受光照影响（鲜艳清晰）
        // BoxGeometry 材质顺序：[+x, -x, +y, -y, +z, -z]，正面(+z)放立绘、背面(-z)放卡背
        const backMat = new THREE.MeshBasicMaterial({ color: 0x3a2350 });
        const frontMat = new THREE.MeshBasicMaterial();
        const box = new THREE.Mesh(new THREE.BoxGeometry(CARD_W, CARD_H, CARD_T), [
          sideMat, sideMat, sideMat, sideMat, frontMat, backMat,
        ]);
        g.add(box);
        g.userData = { frontMat, backMat, card: null, slot: null, targetPos: new THREE.Vector3(), targetRot: new THREE.Euler(), targetScale: 1, dying: false, hover: false };
        return g;
      }
      // 摆放形态：里侧（翻转）→ 平躺贴桌（像书平放）；正面防守 → 横向竖立；其余（攻击/魔陷）→ 竖向竖立
      function isFlat(slot, card) {
        return !!card && !!card.faceDown;
      }
      function isLandscape(slot, card) {
        return !!card && !card.faceDown && slot && slot.kind === "monster" && card.position === "def";
      }
      function setCard3D(g, card, faceUp, landscape, flat, rotX) {
        g.userData.card = card;
        g.userData.faceUp = faceUp;
        g.userData.frontMat.map = getTexture(card, faceUp, landscape);
        g.userData.frontMat.needsUpdate = true;
        g.userData.backMat.map = getTexture(null, false, landscape);
        g.userData.backMat.needsUpdate = true;
        // 里侧平躺（绕 x -90° 贴桌 + 绕 z 90° 横向，长边左右摆放）；防守横向竖立（绕 z 90°）；其余直立
        g.userData.targetRot.set(flat ? -Math.PI / 2 : (rotX || 0), 0, (landscape || flat) ? Math.PI / 2 : 0);
      }

      // 槽位坐标：怪兽区一行 5 槽（近中线），魔陷区一行 5 槽（靠玩家侧），场地魔法在魔陷区左端；
      // 槽距 1.9：横向卡（守备/里侧）长边 ≈ CARD_H*FIELD_SCALE ≈ 1.73，保证相邻槽位有可见间隔
      const HAND_SCALE = 0.62;  // 手牌缩放（比场上小）
      const HAND_PITCH = -0.42; // 手牌绕X后仰，让牌面正对俯视镜头（修正“朝下”感）
      const FIELD_SCALE = 1.15; // 场上卡牌缩放
      function slotPos(who, kind, idx) {
        const S = 1.9;
        let x, z;
        if (kind === "monster") { x = (idx - 2) * S; z = 2.15; }
        else if (kind === "field") { x = -5.6; z = 3.4; }
        else { x = (idx - 2) * S; z = 3.4; }
        return new THREE.Vector3(x, CARD_H / 2, who === "me" ? z : -z);
      }
      function handPos(i, n, who) {
        const spread = Math.min(n * 0.85, 5.2);
        const x = (i - (n - 1) / 2) * (spread / Math.max(n - 1, 1));
        const z = who === "me" ? 4.6 : -4.6;
        return new THREE.Vector3(x, CARD_H / 2 * HAND_SCALE, z);
      }
      function pilePos(who, kind) {
        const base = { deck: -5.6, grave: -4.2, extra: -2.8, banished: -1.4 }[kind] || 0;
        const z = (who === "me" ? 1 : -1) * (3.4 + base);
        return new THREE.Vector3(8.2, 0.14, z);
      }

      /* ===================== 状态同步 ===================== */
      function sync3D() {
        const s = duel && duel.state;
        if (!s) return;
        const alive = new Set();
        // 场上（怪兽+魔陷）
        for (const who of ["me", "ai"]) {
          const p = s[who];
          for (let i = 0; i < 5; i++) {
            const m = p.monsterZone[i];
            const st = p.spellZone[i];
            if (m) { placeCard3D(m, { kind: "monster", who, idx: i }); alive.add(m.uid); }
            if (st) { placeCard3D(st, { kind: "st", who, idx: i }); alive.add(st.uid); }
          }
          if (p.fieldZone) { placeCard3D(p.fieldZone, { kind: "field", who, idx: 0 }); alive.add(p.fieldZone.uid); }
          // 手牌
          p.hand.forEach((c, i) => { placeCard3D(c, { kind: "hand", who, idx: i, handN: p.hand.length }); alive.add(c.uid); });
        }
        // 移除离场卡
        for (const [uid, g] of cardMeshes) {
          if (!alive.has(uid) && !g.userData.dying) {
            g.userData.dying = true;
            leaveCard3D(g, "#ff6b4a");
          }
        }
        // 堆
        for (const who of ["me", "ai"]) {
          const p = s[who];

      function availableActions(card, info) {

        const inMain = s.phase === "main1" || s.phase === "main2";
        if (info && info.kind === "hand" && myTurn && inMain) {

          } else if (card.type === "spell") {

            acts.push({ icon: "🎴", label: "覆盖", primary: !canFire, fn: () => { duel.setSpellTrap(handIdx); closeMenu(); } });

      /* ===================== 特效（3D + DOM 横幅混合） ===================== */
      const PHASE_TIPS = {
        draw: ["抽卡阶段", "自动从卡组抽 1 张"],
        standby: ["准备阶段", "自动推进"],
        main1: ["主要阶段 1", "点击卡牌：召唤怪兽 / 发动魔法 / 覆盖卡牌"],

      function fxEl(inner, x, y, cls) {
        const el = document.createElement("div");
        el.className = "fx " + cls;
        if (x != null && y != null) { el.style.left = x + "px"; el.style.top = y + "px"; }
        el.innerHTML = inner;

        setTimeout(kill, 3000);
        return el;
      }
      function fxTurnBanner(player, turn) {
        const me = player === "me";
        const tip = me ? PHASE_TIPS.main1[1] : "AI 行动中…";
        fxEl(`<div class="turn-banner-inner ${me ? "me" : "ai"}"><b>${me ? "你的回合" : "AI 的回合"}</b><span>第 ${turn} 回合 · ${tip}</span></div>`, null, null, "fx-turn-banner");
      }
      function fxActBanner(card, actor) {
        const name = card ? card.name : "";
        const extra = card && card.cid === "kuriboh" ? "（该次战斗伤害无效）" : "";
        fxEl(`<span class="fx-act-txt">✨ ${actor === "me" ? "玩家" : "AI"} 发动：${name}${extra}</span>`, null, null, "fx-act-banner");
      }
      function fxPhaseBanner(phase, player) {
        const t = PHASE_TIPS[phase];
        if (!t) return;
        const me = player === "me";
        fxEl(`<div class="fx-phase-inner ${me ? "me" : "ai"}"><b>${t[0]}</b>${t[1] ? `<span>${t[1]}</span>` : ""}</div>`, null, null, "fx-phase-banner");
      }
      function projectCard3D(uid) {
        const g = cardMeshes.get(uid);
        if (!g) return null;
        const v = g.position.clone().project(camera);
        const rect = renderer.domElement.getBoundingClientRect();
        return { x: (v.x * 0.5 + 0.5) * rect.width + rect.left, y: (-v.y * 0.5 + 0.5) * rect.height + rect.top };
      }
      function fxGlow3D(card, color) {
        const p = projectCard3D(card.uid);
        if (!p) return;
        fxEl(`<div class="fx-burst-txt">✨</div>`, p.x, p.y - 40, "fx-burst");
      }
      function fxAttack3D(attacker, target) {
        const ag = cardMeshes.get(attacker.uid);
        if (!ag) return;
        const fromPos = ag.position.clone();
        const tg = target ? cardMeshes.get(target.uid) : null;
        const toPos = tg ? tg.position.clone().add(new THREE.Vector3(0, 0, -0.55)) : fromPos.clone().add(new THREE.Vector3(0, 0.4, -2.2));
        tween3D(ag, { pos: toPos }, 170, "easeInOut", () => {
          tween3D(ag, { pos: fromPos }, 240, "easeOut", null);
        });
        burst3D(toPos, "#e6b24a", 10);
        sfx("attack");
      }
      function fxImpact3D(ev) {
        const dmg = ev.damage || 0;
        const posCard = ev.direct ? null : (ev.damageTo === "def" ? ev.target : ev.attacker);
        let p = posCard ? projectCard3D(posCard.uid) : null;
        if (!p) {
          const who = ev.damageTo || "ai";
          const bar = $(`lp-${who}-bar`);
          const r = bar.getBoundingClientRect();
          p = { x: r.x + r.width / 2, y: r.y };
        }
        if (ev.direct) fxEl(`<div class="fx-burst-txt">💥 直接攻击！</div>`, p.x, p.y - 54, "fx-burst");
        else fxEl(`<div class="fx-burst-txt">${ev.damageTo === "def" ? "💥" : "↩"}</div>`, p.x, p.y - 30, "fx-burst");
        if (dmg > 0) fxEl(`<b class="fx-dmg-txt">−${dmg}</b>`, p.x, p.y - 58, "fx-dmg");
        shakeBoard();
        sfx("damage");
      }
      function fxBurst3D(card, color) {
        const g = cardMeshes.get(card.uid);
        if (!g) return;
        burst3D(g.position.clone(), color || "#ffd24a", 26);
        sfx("destroy");

        fxGlow3D(card, "#e6b24a");
        sfx("summon");
      }
      function fxPause(ms) { return new Promise((r) => setTimeout(r, ms)); }

      function fxEvent(ev) {
        if (!ev || !ev.kind) return null;
        switch (ev.kind) {
          case "turn_start": fxTurnBanner(ev.player, ev.turn); sfx("turn"); return fxPause(600);
          case "phase_start":
            if (ev.phase === "battle" || ev.phase === "main2") { fxPhaseBanner(ev.phase, ev.player); return fxPause(500); }
            return null;
          case "draw_card": sfx("draw"); break;
          case "summon": if (!ev.hidden) { fxSummon3D(ev.monster); return fxPause(300); } break;
          case "activate":
            if (ev.source === "auto") { fxGlow3D(ev.card, "#e6b24a"); break; }
            fxActBanner(ev.card, ev.actor); fxGlow3D(ev.card, "#e6b24a"); sfx("activate"); return fxPause(320);
          case "attack_declare": fxAttack3D(ev.attacker, ev.target); return fxPause(340);
          case "damage_calc": fxImpact3D(ev); return fxPause(290);
          case "destroyed_by_battle": fxBurst3D(ev.card, "#ffd24a"); return fxPause(240);
          case "sent_to_grave":
            if (ev.from === "field") {
              if (ev.reason === "effect" || ev.reason === "negate") fxBurst3D(ev.card, "#ff6b4a");
              else if (ev.reason === "tribute" || ev.reason === "fusion") fxGlow3D(ev.card, "#c9a86a");
            }
            break;
          case "flip":
            if (ev.monster) { const g = cardMeshes.get(ev.monster.uid); if (g) tween3D(g, { rotY: Math.PI * 2 }, 380, "easeInOut", null); sfx("flip"); return fxPause(240); }
            break;
          case "lp_change": fxLpFloat(ev.player, ev.delta); if (ev.delta < 0) shakeBoard(); break;
        }
        return null;
      }
      function fxLpFloat(player, delta) {
        if (delta >= 0) return;
        const bar = $(`lp-${player}-bar`);
        const r = bar.getBoundingClientRect();
        fxEl(`<b class="fx-dmg-txt small">−${-delta}</b>`, r.x + r.width / 2, r.y - 14, "fx-dmg");
      }

      /* ===================== 启动 ===================== */
      function newGame() {
        logBuf = []; $("log-body").innerHTML = ""; winnerShown = false; prevLp = { me: 8000, ai: 8000 }; lastChainLen = 0;
        const mask = $("modal-mask"); delete mask.dataset.gameover; mask.classList.remove("show"); $("modal").innerHTML = "";
        $("log-panel").classList.remove("show");
        closeMenu(); exitMode();
        // 清空 3D 场景
        for (const [, g] of cardMeshes) scene.remove(g);
        cardMeshes.clear();
        texCache.clear(); artCache.clear();
        duel = new Duel({ playerPreset: deckChoice, aiPreset: aiDeckChoice, pace: PACE_PRESETS[paceMode].pace, promptDelay: PACE_PRESETS[paceMode].promptDelay }, { onState: () => { render(); sync3D(); }, onLog: (m) => pushLog(m), onToast: (m) => toast(m), onEvent: (ev) => fxEvent(ev), onGameOver: (who) => { sfx(who === "me" ? "win" : who === "draw" ? "chain" : "lose"); } });
        duel.start();
      }

      // 事件
      $("btn-new").onclick = () => openDeckSelect();
      const canAct = () => duel && duel.state && duel.state.turnPlayer === "me" && !duel.state.pending && !duel.state.resolving && !duel.state.winner;
      $("tb-main").onclick = () => { if (canAct() && ["main1", "battle", "main2"].includes(duel.state.phase)) duel.nextPhase(); };
      $("tb-alt").onclick = () => { if (canAct() && duel.state.phase === "battle") duel.nextPhase(); };
      $("tb-end").onclick = () => { if (canAct() && ["main1", "battle"].includes(duel.state.phase)) duel.endTurn(); };
      $("btn-sfx").onclick = () => { sfxOn = !sfxOn; $("btn-sfx").textContent = sfxOn ? "🔊" : "🔇"; if (sfxOn) sfx("turn"); };
      $("btn-pace").onclick = () => {
        const order = ["fast", "normal", "slow"];
        paceMode = order[(order.indexOf(paceMode) + 1) % order.length];
        try { localStorage.setItem("ygoPace2", paceMode); } catch (e) { /* 忽略存储失败 */ }
        $("btn-pace").textContent = PACE_PRESETS[paceMode].label.charAt(0);
        $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
        toast("游戏节奏：" + PACE_PRESETS[paceMode].label);
      };
      $("btn-pace").textContent = PACE_PRESETS[paceMode].label.charAt(0);
      $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
      $("btn-log").onclick = () => $("log-panel").classList.toggle("show");
      $("btn-log-close").onclick = () => $("log-panel").classList.remove("show");
      $("btn-help").onclick = () => showHelp();
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); if (mode) exitMode(); $("log-panel").classList.remove("show"); } });

      newGame();
    </script>
  </body>
</html>
