      }
      const linkedUids = new Set(); // 常驻魔陷关联的怪兽 uid（渲染循环抬升用）
      function sync3D() {
        const s = duel && duel.state;
        if (!s) return;
        const alive = new Set();
        // 场上（怪兽+魔陷）
        for (const who of ["me", "ai"]) {
          const p = s[who];
          for (let i = 0; i < 5; i++) {
            const m = p.monsterZone[i];
            const st = p.spellZone[i];
            if (m) {
              placeCard3D(m, { kind: "monster", who, idx: i });
              alive.add(m.uid);
            }
            if (st) {
              placeCard3D(st, { kind: "st", who, idx: i });
              alive.add(st.uid);
            }
          }
          if (p.fieldZone) {
            placeCard3D(p.fieldZone, { kind: "field", who, idx: 0 });
            alive.add(p.fieldZone.uid);
          }
          // 手牌
          p.hand.forEach((c, i) => {
            placeCard3D(c, { kind: "hand", who, idx: i, handN: p.hand.length });
            alive.add(c.uid);
          });
        }
        // 移除离场卡
        for (const [uid, g] of cardMeshes) {
          if (!alive.has(uid) && !g.userData.dying) {
            g.userData.dying = true;
            leaveCard3D(g, "#ff6b4a");
          }
        }
        // 堆
        for (const who of ["me", "ai"]) {
          const p = s[who];
          setPile("deck", who, p.deck.length, p.deck[0] || null);
          setPile(
            "grave",
            who,
            p.graveyard.length,
            p.graveyard[p.graveyard.length - 1] || null,
          );
          if (p.extra.length)
            setPile("extra", who, p.extra.length, p.extra[0] || null);
          if (p.banished.length)
            setPile(
              "banished",
              who,
              p.banished.length,
              p.banished[p.banished.length - 1] || null,
            );
        }
        // 常驻魔陷关联怪兽（装备目标 / 链接 / 种族场地buff），用于金色高亮与抬升
        linkedUids.clear();
        for (const who of ["me", "ai"]) {
          const p = s[who];
          for (const c of [...p.spellZone, p.fieldZone]) {
            if (!c || c.faceDown) continue;
            if (c.equipTarget) linkedUids.add(c.equipTarget);
            if (c.linkPartner) linkedUids.add(c.linkPartner);
            if (c.effect && c.effect.races) {
              for (const key of ["me", "ai"])
                for (const m of s[key].monsterZone)
                  if (m && c.effect.races.includes(m.race))
                    linkedUids.add(m.uid);
            }
          }
        }
        // 模式高亮：攻击者（蓝）/可选目标（红）/祭品候选（浅金）/祭品已选（金）
        for (const [uid, g] of cardMeshes) {
          const slot = g.userData.slot;
          let color = 0xffffff;
          if (mode === "attack") {
            if (
              slot &&
              slot.who === "me" &&
              slot.kind === "monster" &&
              slot.idx === attackZone
            )
              color = 0x8fc2ff;
            else if (slot && slot.who === "ai" && slot.kind === "monster")
              color = 0xff9d8a;
          } else if (
            mode === "tribute" &&
            slot &&
            slot.who === "me" &&
            slot.kind === "monster"
          ) {
            color = tributePool.includes(slot.idx) ? 0xffd24a : 0xffcc66;
          } else if (g.userData.card && linkedUids.has(g.userData.card.uid)) {
            color = 0xffd24a; // 常驻魔陷关联怪兽：金色高亮
          }
          g.userData.frontMat.color.set(color);
        }
        // 攻守数值同步：装备/场地/攻守互换等改变数值时，重绘卡面纹理（攻击结算与菜单始终取实时值）
        for (const [uid, g] of cardMeshes) {
          const card = g.userData.card;
          if (
            !card ||
            card.type !== "monster" ||
            !g.userData.faceUp ||
            g.userData.dying
          )
            continue;
          let st;
          try {
            st = duel.stats(card);
          } catch (e) {
            continue;
          }
          const prev = g.userData.lastStats;
          if (prev && prev.atk === st.atk && prev.def === st.def) continue;
          g.userData.lastStats = { atk: st.atk, def: st.def };
          const img = artImg.get(card.uid);
          if (img) {
            const oldArt = artCache.get(card.uid);
            if (oldArt) oldArt.dispose();
            artCache.set(card.uid, buildArtTexture(img, card)); // 用原图按新数值重绘立绘卡面
          }
          refreshCardTexture(card.uid);
        }
      }
      function placeCard3D(card, slot) {
        let g = cardMeshes.get(card.uid);
        const faceUp =
          slot.kind === "hand" ? slot.who === "me" : !card.faceDown;
        // 手牌立放（卡面正对相机）；AI 手牌背面朝向玩家（绕 y 旋转 180°）
        const handRotY =
          slot.kind === "hand" && slot.who === "ai" ? Math.PI : 0;
        const landscape = isLandscape(slot, card);
        const flat = isFlat(slot, card);
        if (!g) {
          g = makeCard3D();
          cardMeshes.set(card.uid, g);
          scene.add(g);
          setCard3D(
            g,
            card,
            faceUp,
            landscape,
            flat,
            slot.kind === "hand" ? 0 : fieldPitch(slot.who, slot.kind),
          );
          g.userData.targetRot.set(
            slot.kind === "hand" ? HAND_PITCH : g.userData.targetRot.x,
            handRotY,
            g.userData.targetRot.z,
          );
          // 落卡动画（从槽位上方落下）
          g.position.set(
            slotPos(slot.who, slot.kind, slot.idx).x,
            CARD_H / 2 + 3.5,
            slotPos(slot.who, slot.kind, slot.idx).z,
          );
          g.rotation.set(0, handRotY, 0);
          g.userData.slot = slot;
          const sticky =
            (slot.kind === "st" || slot.kind === "field") &&
            faceUp &&
            isStickyST(card);
          g.userData.targetScale =
            slot.kind === "hand"
              ? HAND_SCALE
              : sticky
                ? FIELD_SCALE * STICKY_SCALE
                : FIELD_SCALE;
          g.userData.targetPos =
            slot.kind === "hand"
              ? handPos(slot.idx, slot.handN, slot.who)
              : slotPos(slot.who, slot.kind, slot.idx);
          if (flat)
            g.userData.targetPos.y = CARD_T / 2; // 平躺贴桌
          else if (landscape)
            g.userData.targetPos.y = (CARD_W / 2) * FIELD_SCALE; // 横向竖立：贴桌站立
          else if (sticky)
            g.userData.targetPos.y = (CARD_H / 2) * FIELD_SCALE * STICKY_SCALE; // 常驻魔陷：缩小并贴桌
        } else {
          // 更新（翻面/位置变化）
          const newFaceUp = faceUp;
          const curFaceUp = g.userData.faceUp;
          const curLandscape = isLandscape(g.userData.slot, g.userData.card);
          const curFlat = isFlat(g.userData.slot, g.userData.card);
          if (
            curFaceUp !== newFaceUp ||
            curLandscape !== landscape ||
            curFlat !== flat
          ) {
            g.userData.faceUp = newFaceUp;
            g.userData.frontMat.map = getTexture(card, newFaceUp, landscape);
            g.userData.frontMat.needsUpdate = true;
            if (newFaceUp) ensureArt(card);
          }
          g.userData.slot = slot;
          const sticky =
            (slot.kind === "st" || slot.kind === "field") &&
            faceUp &&
            isStickyST(card);
          g.userData.targetScale =
            slot.kind === "hand"
              ? HAND_SCALE
              : sticky
                ? FIELD_SCALE * STICKY_SCALE
                : FIELD_SCALE;
          g.userData.targetPos =
            slot.kind === "hand"
              ? handPos(slot.idx, slot.handN, slot.who)
              : slotPos(slot.who, slot.kind, slot.idx);
          if (flat)
            g.userData.targetPos.y = CARD_T / 2; // 平躺贴桌
          else if (landscape)
            g.userData.targetPos.y = (CARD_W / 2) * FIELD_SCALE; // 横向竖立：贴桌站立
          else if (sticky)
            g.userData.targetPos.y = (CARD_H / 2) * FIELD_SCALE * STICKY_SCALE; // 常驻魔陷：缩小并贴桌
          g.userData.targetRot.set(
            slot.kind === "hand"
              ? HAND_PITCH
              : flat
                ? -Math.PI / 2
                : fieldPitch(slot.who, slot.kind),
            handRotY,
            landscape || flat ? Math.PI / 2 : 0,
          );
        }
        if (faceUp) ensureArt(card);
        if (g.userData.dying) {
          g.userData.dying = false;
          g.visible = true;
        }
      }
      function leaveCard3D(g, color) {
        // 离场动画：飞起旋转缩小 + 粒子
        burst3D(g.position.clone(), color, 18);
        tween3D(
          g,
          {
            pos: g.position.clone().add(new THREE.Vector3(0, 2.2, 0)),
            scale: 0.05,
            rotY: g.rotation.y + Math.PI * 2,
          },
          420,
          "easeIn",
          () => {
            // 死亡动画期间同 uid 卡牌回到场上（dying 已被 placeCard3D 复位）则放弃移除
            if (!g.userData.dying) return;
            scene.remove(g);
            cardMeshes.delete(g.userData.card && g.userData.card.uid);
            disposeCardGroup(g);
          },
        );
      }
      function setPile(kind, who, count, topCard) {
        const key = kind + ":" + who;
        let g = pileMeshes.get(key);
        if (!g) {
          g = new THREE.Group();
          // 顶面与前后两面都贴牌图：侧视/俯视都能看到卡背图案
          const topTex = new THREE.MeshBasicMaterial({
            map: topCard
              ? getTexture(topCard, true)
              : getTexture(null, false),
          });
          const box = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.86, 0.05), [
            sideMat,
            sideMat,
            topTex,
            new THREE.MeshBasicMaterial({ color: 0x241a33 }),
            topTex,
            topTex,
          ]);
          box.castShadow = true;
          g.userData.topMat = box.material[2];
          g.userData.topUid = topCard ? topCard.uid : null;
          g.add(box);
          scene.add(g);
          pileMeshes.set(key, g);
          // DOM 数量标签
          const tag = document.createElement("div");
          tag.className = "pile-tag";
          tag.textContent =
            ({ deck: "卡组", grave: "墓地", extra: "额外", banished: "除外" }[
              kind
            ] || kind) +
            " " +
            count;
          stage.appendChild(tag);
          pileTags.set(key, tag);
          g.userData.key = key;
        }
        g.userData.count = count;
        g.position.copy(pilePos(who, kind));
        // 堆叠厚度
        g.scale.y = Math.min(1 + count * 0.02, 2.2);
        // 顶卡变化（如墓地顶）时换面并刷新标签
        const uid = topCard ? topCard.uid : null;
        if (uid !== g.userData.topUid) {
          g.userData.topUid = uid;
          g.userData.topMat.map = topCard
            ? getTexture(topCard, true)
            : getTexture(null, false);
          g.userData.topMat.needsUpdate = true;
          const tag = pileTags.get(key);
          if (tag)
            tag.textContent =
              ({ deck: "卡组", grave: "墓地", extra: "额外", banished: "除外" }[
                kind
              ] || kind) +
              " " +
              count;
        }
      }

      /* ===================== 动画系统（anime.js 统一驱动 3D + DOM） ===================== */
      // 说明：3D 对象用“代理状态对象”接入 anime（anime 管时间轴/缓动，onUpdate 写回 three 属性），
      // 避免 v4.5 three 适配器对数值初始值的解析缺陷，同时天然支持贝塞尔/弹簧缓动。
      // 缓动映射：兼容旧签名 + 贝塞尔/弹簧
      const EASE3D = {
        easeIn: "inQuad",
        easeOut: "outCubic",
        easeInOut: "inOutQuad",
        attack: cubicBezier(0.62, -0.28, 0.74, 0.05), // 攻击突进：急冲骤停
        recoil: "outElastic", // 回弹
      };
      const tween3DMap = new Map(); // obj -> anime Animation（同一对象新 tween 自动停止旧的）
      function tween3D(obj, to, dur, ease, onDone) {
        const prev = tween3DMap.get(obj);
        if (prev && !prev.completed) prev.cancel();
        if (obj.userData) obj.userData.busy = true; // 动画接管期间，阻尼趋近循环跳过该对象
        const fromPos = obj.position.clone();
        const fromScale = obj.scale.x;
        const fromRotY = obj.rotation.y;
        const toPos = to.pos || fromPos;
        const toScale = to.scale != null ? to.scale : fromScale;
        const toRotY = to.rotY != null ? to.rotY : fromRotY;
        const state = { k: 0 };
        const anim = animate(state, {
          k: 1,
          duration: dur,
          ease: EASE3D[ease] || ease || "outCubic",
          onUpdate: () => {
            const k = state.k;
            obj.position.lerpVectors(fromPos, toPos, k);
            obj.scale.setScalar(fromScale + (toScale - fromScale) * k);
            obj.rotation.y = fromRotY + (toRotY - fromRotY) * k;
          },
          onComplete: () => {
            tween3DMap.delete(obj);
            if (obj.userData) obj.userData.busy = false;
            if (onDone) onDone();
          },
        });
        tween3DMap.set(obj, anim);
        return anim;
      }
      // 粒子爆发：小方块上抛 + 淡出（代理状态接入 anime，无需自管更新循环）
      function burst3D(pos, color, count) {
        const geo = new THREE.BoxGeometry(0.09, 0.09, 0.09);
        let alive = count;
        for (let i = 0; i < count; i++) {
          const m = new THREE.Mesh(
            geo,
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(color),
              transparent: true,
            }),
          );
          m.position
            .copy(pos)
            .add(
              new THREE.Vector3(
                (Math.random() - 0.5) * 0.4,
                0.06,
                (Math.random() - 0.5) * 0.4,
              ),
            );
          scene.add(m);
          const st = {
            x: m.position.x,
            y: m.position.y,
            z: m.position.z,
            s: 1,
            o: 1,
          };
          animate(st, {
            x: st.x + (Math.random() - 0.5) * 1.6,
            z: st.z + (Math.random() - 0.5) * 1.6,
            y: st.y + 0.9 + Math.random() * 1.1,
            s: 0.1,
            o: 0,
            duration: 420 + Math.random() * 320,
            ease: "outCubic",
            onUpdate: () => {
              m.position.set(st.x, st.y, st.z);
              m.scale.setScalar(st.s);
              m.material.opacity = st.o;
            },
            onComplete: () => {
              scene.remove(m);
              m.material.dispose();
              if (--alive <= 0) geo.dispose();
            },
          });
        }
      }
      // 冲击波圆环：扩散 + 淡出
      function shockwave3D(pos) {
        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.3, 0.42, 32),
          new THREE.MeshBasicMaterial({
            color: 0xffd24a,
            transparent: true,
            opacity: 0.95,
            side: THREE.DoubleSide,
            depthWrite: false,
          }),
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.copy(pos).setY(0.06);
        scene.add(ring);
        const st = { s: 1, o: 0.95 };
        animate(st, {
          s: 3.2,
          o: 0,
          duration: 430,
          ease: "outCubic",
          onUpdate: () => {
            ring.scale.setScalar(st.s);
            ring.material.opacity = st.o;
          },
          onComplete: () => {
            scene.remove(ring);
            ring.geometry.dispose();
            ring.material.dispose();
          },
        });
      }
      // 受击闪光：材质颜色红闪后恢复（anime 驱动颜色插值）
      function flashMesh3D(g) {
        if (!g) return;
        const mat = g.userData.frontMat;
        const red = new THREE.Color(0xff5a4a),
          white = new THREE.Color(0xffffff);
        const st = { k: 0 };
        animate(st, {
          k: 1,
          duration: 55,
          ease: "linear",
          onUpdate: () => mat.color.lerpColors(white, red, st.k),
          onComplete: () => {
            animate(st, {
              k: 0,
              duration: 260,
              ease: "outQuad",
              onUpdate: () => mat.color.lerpColors(white, red, st.k),
            });
          },
        });
      }
      // 卡片碎裂：按当前纹理分片，碎片随机飞散旋转淡出（里侧/横置卡取各自实际纹理）
      function shatter3D(g, color) {
        if (!g || !g.visible) return;
        g.visible = false;
        const COLS = 5,
          ROWS = 7;
        const frontTex = g.userData.frontMat.map;
        const src =
          frontTex && frontTex.image && frontTex.image.getContext
            ? frontTex.image
            : null;
        const shardW = CARD_W / COLS,
          shardH = CARD_H / ROWS;
        const holder = new THREE.Group();
        holder.position.copy(g.position);
        holder.rotation.copy(g.rotation);
        holder.scale.copy(g.scale);
        scene.add(holder);
        let alive = COLS * ROWS;
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const mat = new THREE.MeshBasicMaterial({
              transparent: true,
              side: THREE.DoubleSide,
              depthWrite: false,
            });
            if (src) {
              const s = 64;
              const cv = document.createElement("canvas");
              cv.width = s;
              cv.height = s;
              const ctx = cv.getContext("2d");
              ctx.drawImage(
                src,
                Math.floor((c * src.width) / COLS),
                Math.floor((r * src.height) / ROWS),
                Math.ceil(src.width / COLS),
                Math.ceil(src.height / ROWS),
                0,
                0,
                s,
                s,
              );
              const tex = new THREE.CanvasTexture(cv);
              tex.colorSpace = THREE.SRGBColorSpace;
              mat.map = tex;
            } else {
              mat.color.set(color || 0x9a8fb0);
            }
            const piece = new THREE.Mesh(
              new THREE.PlaneGeometry(shardW * 0.92, shardH * 0.92),
              mat,
            );
            piece.position.set(
              (c - (COLS - 1) / 2) * shardW,
              ((ROWS - 1) / 2 - r) * shardH,
              CARD_T / 2 + 0.01,
            );
            holder.add(piece);
            const st = {
              x: piece.position.x,
              y: piece.position.y,
              z: piece.position.z,
              rx: 0,
              ry: 0,
              rz: 0,
              o: 1,
            };
            animate(st, {
              x: st.x + (Math.random() - 0.5) * 1.7,
              y: st.y + 0.35 - Math.random() * 1.0,
              z: st.z + 0.35 + Math.random() * 0.9,
              rx: ((Math.random() - 0.5) * 720 * Math.PI) / 180,
              ry: ((Math.random() - 0.5) * 720 * Math.PI) / 180,
              rz: ((Math.random() - 0.5) * 360 * Math.PI) / 180,
              o: 0,
              duration: 750 + Math.random() * 400,
              ease: "outQuad",
              onUpdate: () => {
                piece.position.set(st.x, st.y, st.z);
                piece.rotation.set(st.rx, st.ry, st.rz);
                mat.opacity = st.o;
              },
              onComplete: () => {
                holder.remove(piece);
                if (mat.map) mat.map.dispose();
                mat.dispose();
                piece.geometry.dispose();
                if (--alive <= 0) scene.remove(holder);
              },
            });
          }
        }
      }

      /* ===================== 拾取交互 ===================== */
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let hoveredMesh = null;
      let downPos = null;
      const pickables = () =>
        [...cardMeshes.values(), ...pileMeshes.values()].filter(
          (g) => g.visible,
        );
      function pick(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(pickables(), true);
        if (!hits.length) return null;
        let g = hits[0].object;
        while (g && !g.userData.slot && !g.userData.key) g = g.parent;
        return g || null;
      }
      /* 指针事件统一处理：悬停拾取 + 提示文案（仅变化时写 DOM）+ 水平拖拽视角。
         （原 pointer/mouse 双份监听会让同一次移动做两次射线检测，现只保留 Pointer 一路） */
      let dragStart = null;
      let lastHint = null;
      function setHint(t) {
        if (t === lastHint) return;
        lastHint = t;
        const hint = document.querySelector(".hint3d");
        if (hint) hint.textContent = t || "";
      }
      renderer.domElement.addEventListener("pointerdown", (e) => {
        downPos = { x: e.clientX, y: e.clientY };
        dragStart = { x: e.clientX };
      });
      renderer.domElement.addEventListener("pointermove", (e) => {
        // 视角水平拖拽
        if (dragStart && e.buttons === 1) {
          const dx = e.clientX - dragStart.x;
          if (Math.abs(dx) > 8) {
            camera.position.x = THREE.MathUtils.clamp(
              camera.position.x - dx * 0.008,
              -2.5,
              2.5,
            );
            camera.lookAt(0, -0.4, 0);
            dragStart = { x: e.clientX };
          }
        }
        // 悬停拾取（拖拽中沿用旧目标，省一次 raycast）
        const dragging = dragStart && e.buttons === 1;
        const g = dragging ? hoveredMesh : pick(e);
        if (!dragging) {
          if (hoveredMesh && hoveredMesh !== g) {
            hoveredMesh.userData.hover = false;
            hoveredMesh = null;
          }
          if (g && g.userData.slot) {
            hoveredMesh = g;
            g.userData.hover = true;
          }
        }
        renderer.domElement.style.cursor =
          g && (g.userData.slot || g.userData.key) ? "pointer" : "default";
        setHint(
          g
            ? g.userData.key
              ? "堆:" + g.userData.key
              : g.userData.card
                ? "卡:" + g.userData.card.name
                : "?"
            : "点击卡牌查看/操作",
        );
      });
      renderer.domElement.addEventListener("pointerup", () => {
        dragStart = null;
      });
      // 统一用 click 事件处理拾取（pointer/mouse 派发均兼容）
      renderer.domElement.addEventListener("click", (e) => {
        const moved = downPos
          ? Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y)
          : 0;
        if (moved > 8) return;
        const g = pick(e);
        if (!g) {
          if (menuOpen) closeMenu();
          return;
        }
        if (g.userData.key) {
          // 卡组/墓地堆：查看列表
          const [kind, who] = g.userData.key.split(":");
          const p = duel.state[who];
          if (kind === "deck") toast("卡组不可查看");
          else if (kind === "extra") openListModal("额外卡组", p.extra);
          else if (kind === "banished") openListModal("除外", p.banished);
          else openListModal("墓地", p.graveyard);
          return;
        }
        const slot = g.userData.slot;
        const card = g.userData.card;
        if (mode === "attack" && slot.who === "ai" && slot.kind === "monster") {
          duel.declareAttack(attackZone, slot.idx);
          exitMode();
          return;
        }
        if (
          mode === "tribute" &&
          slot.who === "me" &&
          slot.kind === "monster"
        ) {
          toggleTribute(slot.idx);
          return;
        }
        openMenu(card, slot, g);
      });

      /* ===================== 渲染循环 ===================== */
      let viewW = 1,
        viewH = 1; // 缓存画布尺寸，投影循环不再每帧 getBoundingClientRect
      function resize() {
        const w = stage.clientWidth,
          h = stage.clientHeight;
        if (!w || !h) return;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        viewW = w;
        viewH = h;
      }
      window.addEventListener("resize", resize);
      new ResizeObserver(resize).observe(stage);
      resize();
      requestAnimationFrame(resize); // 布局稳定后再校正一次
      function renderLoop() {
        requestAnimationFrame(renderLoop);
        camera.updateMatrixWorld(true);
        // 平滑趋近目标位（tween3D 接管中的卡跳过，避免阻尼覆盖动画）
        for (const g of cardMeshes.values()) {
          if (g.userData.dying || g.userData.busy) continue;
          const tp = g.userData.targetPos;
          g.position.lerp(tp, 0.22);
          if (g.userData.hover && !g.userData.dying) g.position.y = tp.y + 0.18;
          // 选中态（攻击者/祭品已选）抬升，强化视觉反馈
          const slotInfo = g.userData.slot;
          const liftedSel =
            (mode === "attack" &&
              slotInfo &&
              slotInfo.who === "me" &&
              slotInfo.kind === "monster" &&
              slotInfo.idx === attackZone) ||
            (mode === "tribute" &&
              slotInfo &&
              slotInfo.who === "me" &&
              slotInfo.kind === "monster" &&
              tributePool.includes(slotInfo.idx));
          if (liftedSel) g.position.y = tp.y + 0.3;
          // 常驻魔陷关联怪兽：轻微抬升
          else if (g.userData.card && linkedUids.has(g.userData.card.uid))
            g.position.y = tp.y + 0.12;
          // 手牌/场上缩放趋近
          const ts = g.userData.targetScale;
          g.scale.x += (ts - g.scale.x) * 0.22;
          g.scale.y += (ts - g.scale.y) * 0.22;
          g.scale.z += (ts - g.scale.z) * 0.22;
          const damp = 0.25;
          // 手牌：水平方向始终朝向镜头（消除透视偏转），并保持后仰角
          const slot = g.userData.slot;
          if (slot && slot.kind === "hand") {
            const dir = new THREE.Vector3().subVectors(
              camera.position,
              g.position,
            );
            const ry =
              Math.atan2(dir.x, dir.z) + (slot.who === "ai" ? Math.PI : 0);
            g.rotation.y += (ry - g.rotation.y) * damp;
            g.rotation.x += (HAND_PITCH - g.rotation.x) * damp;
            g.rotation.z += (0 - g.rotation.z) * damp;
            continue;
          }
          const tr = g.userData.targetRot;
          g.rotation.z += (tr.z - g.rotation.z) * damp;
          g.rotation.x += (tr.x - g.rotation.x) * damp;
          g.rotation.y += (tr.y - g.rotation.y) * damp;
        }
        // 堆标签投影（取整定位，避免亚像素抖动；文案仅变化时更新）
        for (const [key, g] of pileMeshes) {
          const tag = pileTags.get(key);
          if (!tag) continue;
          const v = g.position.clone().project(camera);
          tag.style.left = Math.round((v.x * 0.5 + 0.5) * viewW) + "px";
          tag.style.top = Math.round((-v.y * 0.5 + 0.5) * viewH + 26) + "px";
          const txt =
            ({ deck: "卡组", grave: "墓地", extra: "额外", banished: "除外" }[
              key.split(":")[0]
            ] || "") +
            " " +
            g.userData.count;
          if (tag.textContent !== txt) tag.textContent = txt;
          tag.style.display = g.userData.count > 0 ? "" : "none";
        }
        // 卡牌引导 chip 投影（跟随对应卡牌，取整定位）
        for (const [key, el] of chipEls) {
          const uid = key.split(":")[0];
          const g = cardMeshes.get(uid);
          if (!g) {
            el.remove();
            chipEls.delete(key);
            continue;
          }
          const v = g.position.clone().project(camera);
          el.style.left = Math.round((v.x * 0.5 + 0.5) * viewW) + "px";
          el.style.top = Math.round((-v.y * 0.5 + 0.5) * viewH - 40) + "px";
        }
        // 星尘缓慢漂移与明暗呼吸
        const tNow = performance.now() / 1000;
        stars.rotation.y = tNow * 0.006;
        stars.material.opacity = 0.72 + Math.sin(tNow * 0.7) * 0.13;
        // 悬停光环：贴桌发光框，跟随指针下场上卡牌的落脚点
        const hvSlot = hoveredMesh && hoveredMesh.userData.slot;
        if (hoveredMesh && hvSlot && hvSlot.kind !== "hand") {
          hoverRing.visible = true;
          hoverRing.position.set(hoveredMesh.position.x, 0.05, hoveredMesh.position.z);
          hoverRing.scale.setScalar(hoveredMesh.scale.x / FIELD_SCALE);
        } else hoverRing.visible = false;
        renderer.render(scene, camera);
      }
      renderLoop();

      /* ===================== 音效 ===================== */
      function acCtx() {
        if (!sfxOn) return null;
        if (!ac) {
          try {
            ac = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            return null;
          }
        }
        if (ac.state === "suspended") ac.resume().catch(() => {});
        return ac;
      }
      function tone(freq, dur, type, vol, slideTo, delay) {
        const ctx = acCtx();
        if (!ctx) return;
        const t0 = ctx.currentTime + (delay || 0);
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo)
          o.frequency.exponentialRampToValueAtTime(
            Math.max(20, slideTo),
            t0 + dur,
          );
        g.gain.setValueAtTime(vol || 0.12, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g);
        g.connect(ctx.destination);
        o.start(t0);
        o.stop(t0 + dur + 0.03);
      }
      function sfx(kind) {
        if (!sfxOn) return;
        switch (kind) {
          case "turn":
            tone(392, 0.12, "triangle", 0.1);
            tone(523, 0.18, "triangle", 0.1, null, 0.09);
            break;
          case "draw":
            tone(660, 0.08, "sine", 0.06, 920);
            break;
          case "summon":
            tone(220, 0.1, "sawtooth", 0.06, 520);
            tone(520, 0.14, "triangle", 0.1, 780, 0.08);
            break;
          case "activate":
            tone(520, 0.1, "square", 0.05, 700);
            tone(700, 0.16, "triangle", 0.08, 1040, 0.08);
            break;
          case "attack":
            tone(900, 0.12, "sawtooth", 0.07, 200);
            break;
          case "damage":
            tone(160, 0.22, "square", 0.14, 55);
            tone(95, 0.28, "sawtooth", 0.12, 40, 0.04);
            break;
          case "destroy":
            tone(320, 0.26, "sawtooth", 0.12, 60);
            tone(190, 0.18, "square", 0.08, 50, 0.02);
            break;
          case "flip":
            tone(500, 0.09, "sine", 0.07, 720);
            break;
          case "win":
            [523, 659, 784, 1047].forEach((f, i) =>
              tone(f, 0.2, "triangle", 0.1, null, i * 0.12),
            );
            break;
          case "lose":
            [392, 330, 262, 196].forEach((f, i) =>
              tone(f, 0.24, "sawtooth", 0.08, null, i * 0.14),
            );
            break;
          case "chain":
            tone(600, 0.07, "square", 0.05, 900);
            break;
        }
      }
      function shakeBoard() {
        animate($("board"), {
          x: [0, -7, 6, -5, 4, -2, 0],
          duration: 380,
          ease: "linear",
        });
      }

      /* ===================== DOM 卡牌（菜单/弹窗展示用） ===================== */
      function cardEl(card, opts = {}) {
        const el = document.createElement("div");
        if (!card) return el;
        if (opts.back) {
          el.className = "card back" + (opts.extraClass || "");
          return el;
        }
        el.className = "card " + card.type + (opts.extraClass || "");
        if (opts.set) {
          el.className = "card set";
          return el;
        }
        const nb = document.createElement("div");
        nb.className = "namebar";
        nb.textContent = card.name;
        el.appendChild(nb);
        const art = document.createElement("div");
        art.className = "art";
        const em = document.createElement("div");
        em.className = "em";
        em.textContent =
          card.type === "monster"
            ? RACE_EM[card.race] || "★"
            : card.type === "spell"
              ? "✨"
              : "🪤";
        art.appendChild(em);
        if (card.password && !opts.back && !opts.set) {
          const img = document.createElement("img");
          img.className = "scan";
          img.src = artUrl(card.password);
          img.onerror = () => img.remove();
          img.onload = () => {
            el.classList.add("has-art");
            em.style.display = "none";
          };
          art.appendChild(img);
        }
        el.appendChild(art);
        if (card.type === "monster") {
          const attr = document.createElement("div");
          attr.className = "attr";
          attr.textContent = ATTR_EM[card.attribute] || "";
          el.appendChild(attr);
          if (card.level) {
            const stars = document.createElement("div");
            stars.className = "stars";
            stars.textContent = "★".repeat(Math.min(card.level, 12));
            el.appendChild(stars);
          }
        } else {
          const sub = document.createElement("div");
          sub.className = "sub";
          sub.textContent = card.subtype || "";
          el.appendChild(sub);
        }
        const foot = document.createElement("div");
        foot.className = "foot";
        if (card.type === "monster") {
          const st = opts.stats || { atk: card.atk, def: card.def };
          foot.innerHTML = `<span>ATK <b>${st.atk ?? "?"}</b></span><span>DEF <b>${st.def ?? "?"}</b></span>`;
        } else {
          foot.innerHTML = `<span>${card.type === "spell" ? "魔法" : "陷阱"}</span><span></span>`;
        }
        el.appendChild(foot);
        return el;
      }
      function timingManual(m) {
        return !!(
          m.effect &&
          m.effect.triggers &&
          m.effect.triggers.some((t) => t.event === "manual" && !t.auto)
        );
      }

      /* ===================== 渲染（DOM 部分） ===================== */
      function render() {
        const s = duel && duel.state;
        if (!s) return;
        updateLP("me", s.me.lp);
        updateLP("ai", s.ai.lp);
        // 当前行动方 LP 行呼吸光晕
        const meTurn = s.turnPlayer === "me" && !s.winner;
        $("lp-row-me").classList.toggle("active", meTurn);
        $("lp-row-ai").classList.toggle("active", !meTurn && !s.winner);
        const phaseNames = {
          draw: "抽卡",
          standby: "准备",
          main1: "主要1",
          battle: "战斗",
          main2: "主要2",
        };
        const tp = s.turnPlayer;
        $("phase-tag").textContent =
          (tp === "me" ? "你的回合 · " : "AI 回合 · ") +
          (phaseNames[s.phase] || s.phase);
        $("phase-tag").className = "phase-tag " + tp;
        $("turn-info").textContent = `第 ${s.turn} 回合`;
        renderTurnBar(s);
        renderChainBanner(s);
        renderPrompt(s);
        renderModeBar();
        try {
          renderChips();
        } catch (e) {
          if (!window.__rcErr) {
            window.__rcErr = true;
            pushLog("[ui] chip渲染失败: " + (e && e.message));
          }
        }
        if (s.winner && !winnerShown) showGameOver(s.winner);
      }
      function updateLP(who, val) {
        const el = $(`lp-${who}`);
        if (el.textContent !== String(val)) {
          el.textContent = val;
          el.classList.remove("bump");
          void el.offsetWidth; // 重启动画
          el.classList.add("bump");
        }
        const fill = $(`lp-${who}-fill`);
        fill.style.width = Math.max(0, (val / 8000) * 100) + "%";
        if (val < prevLp[who]) {
          animate($(`lp-${who}-bar`), {
            boxShadow: [
              "0 0 0px rgba(229,72,77,0)",
              "0 0 18px rgba(229,72,77,0.9)",
              "0 0 0px rgba(229,72,77,0)",
            ],
            duration: 460,
            ease: "linear",
          });
          if (who === "me") flashScreen("rgba(229,72,77,0.25)");
        }
        prevLp[who] = val;
      }
      function flashScreen(color) {
        const f = $("screen-flash");
        f.style.background = color;
        animate(f, { opacity: [0, 0.55, 0], duration: 420, ease: "linear" });
      }
      function renderTurnBar(s) {
        const mine =
          s.turnPlayer === "me" && !s.pending && !s.resolving && !s.winner;
        const phaseNames = {
          draw: "抽卡阶段",
          standby: "准备阶段",
          main1: "主要阶段 1",
          battle: "战斗阶段",
          main2: "主要阶段 2",
        };
        $("tb-phase").textContent =
          (mine ? "你的回合" : "AI 回合") +
          " · " +
          (phaseNames[s.phase] || s.phase);
        const phaseTips = {
          draw: "自动从卡组抽 1 张",
          standby: "自动推进",
          main1: "点击卡牌：召唤怪兽 / 发动魔法 / 覆盖卡牌",
          battle: "点击攻击表示怪兽发起攻击",
          main2: "还可召唤、覆盖魔法·陷阱卡",
          end: "手卡多于 6 张需丢弃",
        };
        $("tb-tip").textContent = mine
          ? phaseTips[s.phase] || ""
          : "AI 行动中…";
        $("turn-bar").className = "turn-bar" + (mine ? "" : " ai");
        const mainBtn = $("tb-main"),
          altBtn = $("tb-alt"),
          endBtn = $("tb-end");
        const set = (b, label, show, primary, enabled) => {
          if (b.innerHTML !== label) b.innerHTML = label;
          b.style.visibility = show ? "" : "hidden"; // 占位隐藏而非 display:none，避免回合条宽度跳动
          b.className = "tb-btn" + (primary ? " primary" : " ghost");
          b.disabled = !(mine && enabled);
        };
        if (s.phase === "main1") {
          set(mainBtn, IC.sword + " 进入战斗", true, true, true);
          set(altBtn, "", false, false, false);
          set(endBtn, IC.flag + " 结束回合", true, false, true);
        } else if (s.phase === "battle") {
          set(mainBtn, IC.gear + " 主阶段 2", true, true, true);
          set(altBtn, "", false, false, false);
          set(endBtn, IC.flag + " 结束回合", true, false, true);
        } else if (s.phase === "main2") {
          set(mainBtn, IC.flag + " 结束回合", true, true, true);
          set(altBtn, "", false, false, false);
          set(endBtn, "", false, false, true);
        } else {
          set(mainBtn, "—", true, false, false);
          set(altBtn, "", false, false, false);
          set(endBtn, "", false, false, false);
        }
      }
      function renderChainBanner(s) {
        const el = $("chain-banner");
        const n = s.chain ? s.chain.length : 0;
        if (n) {
          if (n !== lastChainLen) sfx("chain");
          el.classList.add("show");
          el.innerHTML =
            `<b>⚡ 连锁 ${n}</b>` +
            s.chain
              .map(
                (l, i) =>
                  `<span class="link">${i + 1}. ${l.card.name}（${l.player === "me" ? "玩家" : "AI"}）</span>`,
              )
              .join("");
        } else el.classList.remove("show");
        lastChainLen = n;
      }

      /* ===================== popover 菜单 ===================== */
      function openMenu(card, info, mesh3d) {
        if (duel.state.pending || duel.state.resolving) return;
        if (mode && (mode === "attack" || mode === "tribute")) return;
        closeMenu();
        menuOpen = true;
        const mask = document.createElement("div");
        mask.className = "backdrop";
        mask.onclick = () => closeMenu();
        document.body.appendChild(mask);
        const menu = document.createElement("div");
        menu.className = "card-menu";
        menu.id = "card-menu";
        const isOppFacedown = info && info.who === "ai" && card.faceDown;
        const preview = cardEl(card, {
          stats: card.type === "monster" ? duel.stats(card) : null,
          back: isOppFacedown,
        });
        preview.classList.add("menu-card");
        menu.appendChild(preview);
        const body = document.createElement("div");
        body.className = "menu-body";
        const meta = document.createElement("div");
        meta.className = "meta";
        if (isOppFacedown) meta.innerHTML = `<b>里侧卡牌</b><br>信息未知`;
        else if (card.type === "monster") {
          const st = duel.stats(card);
          meta.innerHTML = `<b>${card.name}</b><br>${card.attribute} · ${card.race} · ${"★".repeat(card.level)} 等级${card.level}<br>ATK <b style="color:var(--accent)">${st.atk}</b> / DEF <b style="color:var(--accent)">${st.def}</b>`;
        } else
          meta.innerHTML = `<b>${card.name}</b><br>${card.type === "spell" ? "魔法" : "陷阱"} · ${card.subtype}`;
        body.appendChild(meta);

          const t = document.createElement("div");

        }

        actions.className = "actions";
        const acts = availableActions(card, info);
        if (acts.length)
          acts.forEach((a) => {
            const b = document.createElement("div");
            b.className = "act-btn" + (a.primary ? " primary" : "");
            b.innerHTML = `<span class="ic">${a.icon}</span><span>${a.label}</span>`;
            b.onclick = (e) => {
              e.stopPropagation();
              a.fn();
            };
            actions.appendChild(b);
          });
        else {
          const e = document.createElement("div");

        // 定位在 3D 卡牌投影处
        if (mesh3d) {
          const v = mesh3d.position.clone().project(camera);
          const rect = renderer.domElement.getBoundingClientRect();
          positionMenuAt(
            (v.x * 0.5 + 0.5) * rect.width + rect.left,
            (-v.y * 0.5 + 0.5) * rect.height + rect.top,
            menu,
          );
        } else {
          menu.style.left = "50%";
          menu.style.top = "50%";
          menu.style.transform = "translate(-50%,-50%)";

        render();

      function positionMenuAt(x, y, menu) {
        const mw = menu.offsetWidth,
          mh = menu.offsetHeight;
        let left = x - mw / 2;
        let top = y + 10;
        if (top + mh > window.innerHeight - 8) top = y - mh - 10;
        if (top < 8) top = 8;
        left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
        menu.style.left = left + "px";
        menu.style.top = top + "px";
        menu.style.transform = "none";
      }
      function closeMenu() {
        const m = $("card-menu");
        if (m) m.remove();
        document.querySelectorAll(".backdrop").forEach((b) => b.remove());
        if (menuOpen) {
          menuOpen = false;
          render();
        }
      }
      function availableActions(card, info) {
        const s = duel.state;
        const acts = [];
        const myTurn = s.turnPlayer === "me" && !s.pending && !s.resolving;
        const inMain = s.phase === "main1" || s.phase === "main2";
        if (info && info.kind === "hand" && myTurn && inMain) {
          const handIdx = info.idx;
          if (card.type === "monster") {
            if (card.level < 5) {
              acts.push({
                icon: IC.sword,
                label: "通常召唤·攻击表示",
                primary: true,
                fn: () => {
                  duel.normalSummon(handIdx, null, "atk");
                  closeMenu();
                },
              });
              acts.push({
                icon: IC.shield,
                label: "通常召唤·守备表示",
                fn: () => {
                  duel.normalSummon(handIdx, null, "def");
                  closeMenu();
                },
              });
              acts.push({
                icon: IC.setCard,
                label: "覆盖（里侧守备）",
                fn: () => {
                  duel.setMonster(handIdx, null);
                  closeMenu();
                },
              });
            } else {
              acts.push({
                icon: IC.sword,
                label: `祭品召唤（需${card.level >= 7 ? 2 : 1}祭品）`,
                primary: true,
                fn: () => {
                  startTribute(handIdx);
                },
              });
            }
            if (duel.manualCondOk(card))
              acts.push({
                icon: IC.spark,
                label: "发动效果",
                fn: () => {
                  duel.activateHandMonsterEffect(handIdx);
                  closeMenu();
                },
              });
          } else if (card.type === "spell") {
            const canFire = duel.manualCondOk(card);
            if (canFire)
              acts.push({
                icon: IC.spark,
                label: "发动",
                primary: true,
                fn: () => {
                  duel.activateHandSpell(handIdx);
                  closeMenu();
                },
              });
            acts.push({
              icon: IC.setCard,
              label: "覆盖",
              primary: !canFire,
              fn: () => {
                duel.setSpellTrap(handIdx);
                closeMenu();
              },
            });
          } else if (card.type === "trap") {
            acts.push({
              icon: IC.setCard,
              label: "覆盖",
              primary: true,
              fn: () => {
                duel.setSpellTrap(handIdx);
                closeMenu();
              },
            });
          }
        }
        if (info && info.kind === "monster" && info.who === "me" && myTurn) {
          const idx = info.idx;
          if (card.faceDown) {
            if (inMain)
              acts.push({
                icon: IC.flip,
                label: "翻转召唤",
                primary: true,
                fn: () => {
                  duel.flipSummon(idx);
                  closeMenu();
                },
              });
          } else {
            if (
              s.phase === "battle" &&
              card.position === "atk" &&
              !s.me.attacked[idx] &&
              s.turn > 1
            )
              acts.push({
                icon: IC.sword,
                label: "攻击",
                primary: true,
                fn: () => {
                  enterAttackMode(idx);
                },
              });
            if (inMain) {
              acts.push({
                icon: IC.flip,
                label: "切换表示形式",
                fn: () => {
                  duel.changePosition(idx);
                  closeMenu();
                },
              });
              if (duel.manualCondOk(card))
                acts.push({
                  icon: IC.spark,
                  label: "发动效果",
                  fn: () => {
                    duel.activateMonsterEffect(idx);
                    closeMenu();
                  },
                });
            }
          }
        }
        if (
          info &&
          info.kind === "st" &&
          info.who === "me" &&
          card.faceDown &&
          myTurn &&
          inMain &&
          card.turnSet < s.turn
        )
          acts.push({
            icon: "✨",
            label: "发动",
            primary: true,
            fn: () => {
              duel.activateSetTrap(info.idx);
              closeMenu();
            },
          });
        return acts;
      }

      /* ===================== 攻击/祭品模式 ===================== */
      function enterAttackMode(zoneIdx) {
        closeMenu();
        mode = "attack";
        attackZone = zoneIdx;
        render();
        renderModeBar();
      }
      function startTribute(handIdx) {
        closeMenu();
        mode = "tribute";
        tributeHandIdx = handIdx;
        tributePool = [];
        render();
        renderModeBar();
      }
      function exitMode() {
        mode = null;
        attackZone = null;
        tributeHandIdx = null;
        tributePool = [];
        render();
        renderModeBar();
      }
      function toggleTribute(idx) {
        if (tributePool.includes(idx))
          tributePool = tributePool.filter((x) => x !== idx);
        else tributePool.push(idx);
        render();
        renderModeBar();
      }
      function renderModeBar() {
        const bar = $("mode-bar");
        const overlay = $("atk-overlay");
        if (!mode) {
          bar.classList.remove("show");
          overlay.classList.remove("show");
          overlay.innerHTML = "";
          return;
        }
        if (mode === "attack") {
          // 攻击选择：悬浮居中面板（大按钮/目标提示，远离回合条防误点）
          bar.classList.remove("show");
          overlay.classList.add("show");
          overlay.innerHTML = "";
          const attacker = duel.state.me.monsterZone[attackZone];
          const title = document.createElement("div");
          title.className = "atk-title";
          title.textContent = (attacker ? attacker.name : "?") + " 正在攻击";
          overlay.appendChild(title);
          if (duel.state.ai.monsterZone.every((x) => !x)) {
            const b = document.createElement("button");
            b.className = "btn big";
            b.textContent = "💥 直接攻击";
            b.onclick = () => {
              duel.declareAttack(attackZone, null);
              exitMode();
            };
            overlay.appendChild(b);
          } else {
            const hint = document.createElement("div");
            hint.className = "atk-hint";
            hint.textContent = "🖱 点击对方怪兽（红色高亮）选择攻击目标";
            overlay.appendChild(hint);
          }
          const c = document.createElement("button");
          c.className = "btn ghost";
          c.textContent = "取消";
          c.onclick = () => exitMode();
          overlay.appendChild(c);
          return;
        }
        overlay.classList.remove("show");
        overlay.innerHTML = "";
        bar.classList.add("show");
        bar.innerHTML = "";
        if (mode === "tribute") {
          const card = duel.state.me.hand[tributeHandIdx];
          const need = card.level >= 7 ? 2 : 1;
          const lbl = document.createElement("div");
          lbl.className = "lbl";
          lbl.textContent = `祭品 ${tributePool.length}/${need}（金色高亮为已选）`;
          bar.appendChild(lbl);
          const ok = document.createElement("button");
          ok.className = "btn";
          ok.textContent = "确认召唤";
          ok.disabled = tributePool.length !== need;
          ok.onclick = () => {
            if (tributePool.length === need) {
              duel.tributeSummon(tributeHandIdx, [...tributePool], null, "atk");
              exitMode();
            }
          };
          bar.appendChild(ok);
          const c = document.createElement("button");
          c.className = "btn ghost";
          c.textContent = "取消";
          c.onclick = () => exitMode();
          bar.appendChild(c);
        }
      }

      /* ===================== 卡牌引导 chip（战斗攻击 / 祭品已选） ===================== */
      function renderChips() {
        const want = new Map(); // key -> { cls, text, fn }
        const s = duel && duel.state;
        if (s) {
          // 战斗阶段（未进入攻击选择模式）：可攻击显示 ⚔ 攻击，不可攻击显示原因
          if (
            s.turnPlayer === "me" &&
            s.phase === "battle" &&
            !s.pending &&
            !s.resolving &&
            !mode
          ) {
            s.me.monsterZone.forEach((m, i) => {
              if (!m) return;
              const blk = duel.attackBlock(i);
              want.set(
                m.uid,
                blk.ok
                  ? { cls: "atk", text: IC.sword + " 攻击", fn: () => enterAttackMode(i) }
                  : {
                      cls: "dim",
                      text: IC.ban + " " + blk.reason,
                      fn: () => toast(blk.reason),
                    },
              );
            });
          }
          // 祭品选择：已选卡打勾
          if (mode === "tribute") {
            s.me.monsterZone.forEach((m, i) => {
              if (!m || !tributePool.includes(i)) return;
              want.set(m.uid + ":sel", {
                cls: "sel",
                text: IC.check + " 已选",
                fn: null,
              });
            });
          }
        }
        // 差异更新：不重建未变化的 chip，避免 popIn 动画反复重播引起抖动
        for (const [key, el] of chipEls) {
          if (!want.has(key)) {
            el.remove();
            chipEls.delete(key);
          }
        }
        for (const [key, w] of want) {
          let el = chipEls.get(key);
          if (!el) {
            el = document.createElement("div");
            stage.appendChild(el);
            chipEls.set(key, el);
          }
          if (el.__cls !== w.cls || el.__text !== w.text) {
            el.className = "card-chip " + w.cls;
            el.innerHTML = w.text; // 含内联 SVG 图标
            el.onclick = w.fn || null;
            el.__cls = w.cls;
            el.__text = w.text;
          }
        }
      }

      /* ===================== 弹窗 ===================== */
      function renderPrompt(s) {
        const mask = $("modal-mask");
        const modal = $("modal");
        if (s.winner) return;
        if (!s.pending) {
          if (!mask.dataset.gameover) {
            mask.classList.remove("show");
            modal.innerHTML = "";
          }
          return;
        }
        const p = s.pending;
        mask.classList.add("show");
        if (p.kind === "select") {
          modal.innerHTML = `<h3>${p.msg}</h3><div class="opts" id="opts"></div>`;
          const opts = $("opts");
          (p.options || []).forEach((o) => {
            const w = document.createElement("div");
            w.className = "opt";
            const ce = cardEl(o.card, {});
            w.appendChild(ce);
            const lab = document.createElement("div");
            lab.className = "opt-label";
            lab.textContent = o.label || o.card.name;
            w.appendChild(lab);
            w.onclick = () => duel.answer(o.value);
            opts.appendChild(w);
          });
        } else if (p.kind === "chain") {
          const ev = p.event || {};
          let title = "是否连锁？";
          if (ev.kind === "attack_declare")
            title = `是否连锁？（${ev.attacker ? ev.attacker.name + " 攻击宣言" : "攻击"}）`;
          else if (ev.kind === "summon")
            title = `是否连锁？（${ev.monster ? (ev.hidden ? "怪兽覆盖" : ev.monster.name + " 召唤") : "召唤"}）`;
          else if (ev.kind === "activate")
            title = `是否连锁？（${ev.card ? ev.card.name + " 发动" : ""}）`;
          else if (ev.kind === "damage_calc") title = `是否连锁？（伤害计算）`;
          modal.innerHTML = `<h3>${title}</h3><div class="opts" id="opts"></div><div class="btns"></div>`;
          const opts = $("opts");
          (p.options || []).forEach((o) => {
            const w = document.createElement("div");
            w.className = "opt";
            const ce = cardEl(o.card, {});
            w.appendChild(ce);
            const lab = document.createElement("div");
            lab.className = "opt-label";
            lab.textContent = o.card.name;
            w.appendChild(lab);
            w.onclick = () => duel.answer(o);
            opts.appendChild(w);
          });
          const btns = modal.querySelector(".btns");
          const pass = document.createElement("button");
          pass.className = "btn ghost";
          pass.textContent = "不连锁";
          pass.onclick = () => duel.answer({ pass: true });
          btns.appendChild(pass);
        } else if (p.kind === "confirm") {
          modal.innerHTML = `<h3>${p.msg}</h3><div class="btns"></div>`;
          const btns = modal.querySelector(".btns");
          const yes = document.createElement("button");
          yes.className = "btn";
          yes.textContent = "是";
          yes.onclick = () => duel.answer(true);
          btns.appendChild(yes);
          const no = document.createElement("button");
          no.className = "btn ghost";
          no.textContent = "否";
          no.onclick = () => duel.answer(false);
          btns.appendChild(no);
        }
      }

      /* ===================== 日志/Toast/列表 ===================== */

        logBuf.push(msg);

        div.textContent = msg;
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;

      /* ===================== 特效（3D + DOM 横幅混合） ===================== */

      function fxEl(inner, x, y, cls, opts = {}) {
        const el = document.createElement("div");
        el.className = "fx " + cls;
        if (x != null && y != null) {
          el.style.left = x + "px";
          el.style.top = y + "px";
        }
        el.innerHTML = inner;
        document.body.appendChild(el);
        // anime 统一驱动：模糊→清晰滑入放大 → 停留 → 上浮淡出移除
        const hold = opts.hold != null ? opts.hold : 1100;
        const isBanner = cls.includes("banner");
        animate(el, {
          opacity: [0, 1],
          y: [14, 0],
          scale: [0.92, 1],
          filter: isBanner ? ["blur(8px)", "blur(0px)"] : undefined,
          duration: opts.dur || 300,
          ease: "outCubic",
          onComplete: () => {
            animate(el, {
              opacity: 0,
              y: -14,
              duration: 420,
              delay: hold,
              ease: "inQuad",
              onComplete: () => el.remove(),
            });
          },
        });
        return el;
      }
      function fxTurnBanner(player, turn) {
        const me = player === "me";
        const tip = me ? PHASE_TIPS.main1[1] : "AI 行动中…";
        fxEl(
          `<div class="turn-banner-inner ${me ? "me" : "ai"}"><b>${me ? "你的回合" : "AI 的回合"}</b><span>第 ${turn} 回合 · ${tip}</span></div>`,
          null,
          null,
          "fx-turn-banner",
          { dur: 340, hold: 1500 },
        );
      }
      /* ===================== 事件通知队列（串行） =====================
         引擎每 emit 一个事件，fxEvent 调 notify() 入队并 await 播完，
         因此召唤/发动/攻击等反馈永远一条一条出现，不再同时堆叠。 */
      const NOTIFY_HOLD = {
        summon: 950,
        activate: 1150,
        attack: 850,
        damage: 800,
        destroy: 900,
        grave: 780,
        draw: 520,
        info: 680,
      };
      const NOTIFY_CAP = 4; // 洪峰保护：队列上限，过旧通知直接放行
      const notifyQueue = [];
      let notifyBusy = false;
      let notifyEl = null;
      function actorText(actor) {
        return actor === "me" ? "你" : "AI";
      }
      function notify(text, kind = "info", opts = {}) {
        return new Promise((resolve) => {
          notifyQueue.push({ text, kind, opts, resolve });
          while (notifyQueue.length > NOTIFY_CAP) notifyQueue.shift().resolve();
          pumpNotify();
        });
      }
      function pumpNotify() {
        if (notifyBusy) return;
        notifyBusy = true;
        (async () => {
          while (notifyQueue.length) {
            const item = notifyQueue.shift();
            await showNotify(item);
            item.resolve();
          }
          notifyBusy = false;
        })();
      }
      function showNotify({ text, kind, opts }) {
        return new Promise((resolve) => {
          if (!notifyEl) {
            notifyEl = $("event-notify");
          }
          const scale = PACE_SCALE[paceMode] || 1;
          const hold = (NOTIFY_HOLD[kind] ?? 720) * scale;
          notifyEl.className = "event-notify k-" + kind + (opts.big ? " big" : "");
          notifyEl.querySelector(".en-ic").innerHTML =
            opts.icon ||
            {
              summon: IC.setCard,
              activate: IC.spark,
              attack: IC.sword,
              damage: IC.sword,
              destroy: IC.ban,
              grave: IC.ban,
              draw: IC.draw,
              info: IC.spark,
            }[kind] ||
            "";
          notifyEl.querySelector(".en-tx").textContent = text;
          void notifyEl.offsetWidth; // 重启入场过渡
          notifyEl.classList.add("show");
          setTimeout(() => {
            notifyEl.classList.remove("show");
            setTimeout(resolve, 170); // 等退场过渡结束再放下一条
          }, 200 + hold);
        });
      }
      function fxActBanner(card, actor) {
        const name = card ? card.name : "";
        const extra =
          card && card.cid === "kuriboh" ? "（该次战斗伤害无效）" : "";
        return notify(
          `${actorText(actor)}发动「${name}」${extra}`,
          "activate",
          { big: true },
        );
      }
      function fxPhaseBanner(phase, player) {
        const t = PHASE_TIPS[phase];
        if (!t) return;
        const me = player === "me";
        fxEl(
          `<div class="fx-phase-inner ${me ? "me" : "ai"}"><b>${t[0]}</b>${t[1] ? `<span>${t[1]}</span>` : ""}</div>`,
          null,
          null,
          "fx-phase-banner",
          { dur: 300, hold: 1300 },
        );
      }
      function projectCard3D(uid) {
        const g = cardMeshes.get(uid);
        if (!g) return null;
        const v = g.position.clone().project(camera);
        const rect = renderer.domElement.getBoundingClientRect();
        return {
          x: (v.x * 0.5 + 0.5) * rect.width + rect.left,
          y: (-v.y * 0.5 + 0.5) * rect.height + rect.top,
        };
      }
      function fxGlow3D(card, color) {
        const p = projectCard3D(card.uid);
        if (!p) return;
        fxEl(`<div class="fx-burst-txt">✨</div>`, p.x, p.y - 40, "fx-burst");
      }
      function fxAttack3D(attacker, target) {
        const ag = cardMeshes.get(attacker.uid);
        if (!ag) return;
        const fromPos = ag.position.clone();
        const tg = target ? cardMeshes.get(target.uid) : null;
        const toPos = tg
          ? tg.position.clone().add(new THREE.Vector3(0, 0, -0.55))
          : fromPos.clone().add(new THREE.Vector3(0, 0.4, -2.2));
        sfx("attack");
        // 1) 突进（贝塞尔急冲）→ 2) 命中：冲击波 + 闪光 + 目标受击后退 → 3) 弹性回弹
        tween3D(ag, { pos: toPos }, 150, "attack", () => {
          shockwave3D(tg ? tg.position.clone() : toPos);
          burst3D(toPos, "#e6b24a", 10);
          if (tg) {
            flashMesh3D(tg);
            const base = tg.position.clone();
            const nudge = base.clone().add(new THREE.Vector3(0, 0, 0.22));
            tween3D(tg, { pos: nudge }, 90, "easeIn", () => {
              tween3D(tg, { pos: base }, 240, "easeOut", null);
            });
          }
          shakeBoard();
          tween3D(ag, { pos: fromPos }, 420, "recoil", null);
        });
      }
      function fxImpact3D(ev) {
        const dmg = ev.damage || 0;
        const posCard = ev.direct
          ? null
          : ev.damageTo === "def"
            ? ev.target
            : ev.attacker;
        let p = posCard ? projectCard3D(posCard.uid) : null;
        if (!p) {
          const who = ev.damageTo || "ai";
          const bar = $(`lp-${who}-bar`);
          const r = bar.getBoundingClientRect();
          p = { x: r.x + r.width / 2, y: r.y };
        }
        if (ev.direct)
          fxEl(
            `<div class="fx-burst-txt">💥 直接攻击！</div>`,
            p.x,
            p.y - 54,
            "fx-burst",
          );
        else
          fxEl(
            `<div class="fx-burst-txt">${ev.damageTo === "def" ? "💥" : "↩"}</div>`,
            p.x,
            p.y - 30,
            "fx-burst",
          );
        if (dmg > 0)
          fxEl(`<b class="fx-dmg-txt">−${dmg}</b>`, p.x, p.y - 58, "fx-dmg");
        shakeBoard();
        sfx("damage");
      }
      function fxBurst3D(card, color) {
        const g = cardMeshes.get(card.uid);
        if (!g) return;
        shatter3D(g, color || "#ffd24a"); // 碎裂飞散
        burst3D(g.position.clone(), color || "#ffd24a", 12); // 碎屑
        sfx("destroy");
      }
      function fxSummon3D(card) {
        fxGlow3D(card, "#e6b24a");
        sfx("summon");
      }
      function fxPause(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      function fxEvent(ev) {
        if (!ev || !ev.kind) return null;
        switch (ev.kind) {
          case "turn_start":
            fxTurnBanner(ev.player, ev.turn);
            sfx("turn");
            return fxPause(600);
          case "phase_start":
            if (ev.phase === "battle" || ev.phase === "main2") {
              fxPhaseBanner(ev.phase, ev.player);
              return fxPause(500);
            }
            return null;
          case "draw_card":
            sfx("draw");
            // 只提示张数动作，不透露抽到的卡（对方手牌信息保密）
            return notify(
              ev.player === "me" ? "你抽到了一张卡" : "AI 抽了一张卡",
              "draw",
            );
          case "summon": {
            const who = actorText(ev.actor);
            let text;
            if (ev.hidden) {
              text = `${who}覆盖了1只怪兽`;
            } else {
              const kindName =
                {
                  normal: "通常召唤",
                  tribute: "祭品召唤",
                  special: "特殊召唤",
                  fusion: "融合召唤",
                }[ev.summonKind] || "召唤";
              text = `${who}${who === "AI" ? " " : ""}${kindName}「${ev.monster ? ev.monster.name : "?"}」`;
              fxSummon3D(ev.monster);
              sfx("summon");
            }
            return Promise.all([fxPause(ev.hidden ? 0 : 300), notify(text, "summon")]);
          }
          case "activate":
            if (ev.source === "auto") {
              fxGlow3D(ev.card, "#e6b24a");
              return null;
            }
            fxGlow3D(ev.card, "#e6b24a");
            sfx("activate");
            return Promise.all([
              fxActBanner(ev.card, ev.actor),
              fxPause(320),
            ]);
          case "attack_declare": {
            fxAttack3D(ev.attacker, ev.target);
            sfx("attack");
            const text = ev.target
              ? `${actorText(ev.actor)}的「${ev.attacker ? ev.attacker.name : "?"}」攻击「${ev.target.name}」`
              : `${actorText(ev.actor)}的「${ev.attacker ? ev.attacker.name : "?"}」直接攻击！`;
            return Promise.all([fxPause(340), notify(text, "attack")]);
          }
          case "damage_calc": {
            fxImpact3D(ev);
            const text =
              (ev.direct ? "直接攻击！造成 " : "造成 ") +
              (ev.damage || 0) +
              " 点战斗伤害";
            return Promise.all([fxPause(290), notify(text, "damage")]);
          }
          case "destroyed_by_battle":
            fxBurst3D(ev.card, "#ffd24a");
            return Promise.all([
              fxPause(240),
              notify(`「${ev.card.name}」被战斗破坏`, "destroy"),
            ]);
          case "sent_to_grave":
            if (ev.from === "field") {
              if (ev.reason === "effect" || ev.reason === "negate") {
                fxBurst3D(ev.card, "#ff6b4a");
                return Promise.all([
                  fxPause(240),
                  notify(`「${ev.card.name}」被效果破坏`, "destroy"),
                ]);
              } else if (ev.reason === "tribute") {
                fxGlow3D(ev.card, "#c9a86a");
                return Promise.all([
                  fxPause(200),
                  notify(`「${ev.card.name}」成为祭品`, "grave"),
                ]);
              } else if (ev.reason === "fusion") {
                fxGlow3D(ev.card, "#c9a86a");
                return Promise.all([
                  fxPause(200),
                  notify(`「${ev.card.name}」作为融合素材送入墓地`, "grave"),
                ]);
              }
            }
            return null;
          case "banish":
            return notify(`「${ev.card.name}」被除外`, "destroy");
          case "return_to_hand":
            return notify(`「${ev.card.name}」回到手牌`, "grave");
          case "control_change":
            return notify(
              `「${ev.monster.name}」控制权转移给${actorText(ev.to)}`,
              "info",
            );
          case "flip":
            if (ev.monster) {
              const g = cardMeshes.get(ev.monster.uid);
              if (g) tween3D(g, { rotY: Math.PI * 2 }, 380, "easeInOut", null);
              sfx("flip");
              const who = ev.by === "flipSummon" ? actorText(ev.owner) : null;
              return Promise.all([
                fxPause(240),
                who
                  ? notify(`${who}翻转召唤「${ev.monster.name}」`, "summon")
                  : Promise.resolve(),
              ]);
            }
            break;
          case "position_change":
            return notify(
              `「${ev.monster.name}」切换为${ev.to === "atk" ? "攻击" : "守备"}表示`,
              "info",
            );
          case "lp_change":
            fxLpFloat(ev.player, ev.delta);
            if (ev.delta < 0) shakeBoard();
            break;
        }
        return null;
      }
      function fxLpFloat(player, delta) {
        if (delta >= 0) return;
        const bar = $(`lp-${player}-bar`);
        const r = bar.getBoundingClientRect();
        fxEl(
          `<b class="fx-dmg-txt small">−${-delta}</b>`,
          r.x + r.width / 2,
          r.y - 14,
          "fx-dmg",
        );
      }

      /* ===================== 启动 ===================== */
      function newGame() {
        logBuf = [];
        $("log-body").innerHTML = "";
        $("llm-think").classList.remove("show");
        winnerShown = false;
        prevLp = { me: 8000, ai: 8000 };
        lastChainLen = 0;
        const mask = $("modal-mask");
        delete mask.dataset.gameover;
        mask.classList.remove("show");
        $("modal").innerHTML = "";
        $("log-panel").classList.remove("show");
        closeMenu();
        exitMode();
        // 清空 3D 场景并释放 GPU 资源（几何体/材质/纹理），避免重开局累积显存
        for (const [, g] of cardMeshes) {
          scene.remove(g);
          disposeCardGroup(g);
        }
        cardMeshes.clear();
        for (const t of texCache.values()) t.dispose();
        texCache.clear();
        for (const t of artCache.values()) if (t) t.dispose();
        artCache.clear();
        artImg.clear();
        if (duel) {
          duel.state.winner = null;
          duel = null;
        }
        duel = new Duel(
          {
            playerPreset: deckChoice,
            aiPreset: aiDeckChoice,
            pace: PACE_PRESETS[paceMode].pace,
            promptDelay: PACE_PRESETS[paceMode].promptDelay,
            aiDelay: opponentMode === "llm" ? 150 : 650, // 大模型模式下思考耗时本身构成节奏
          },
          {
            onState: () => {
              render();
              sync3D();
            },
            onLog: (m) => pushLog(m),
            onToast: (m) => toast(m),
            onEvent: (ev) => fxEvent(ev),
            onGameOver: (who) => {
              sfx(who === "me" ? "win" : who === "draw" ? "chain" : "lose");
            },
          },
        );
        if (opponentMode === "llm") {
          // 引擎构造后再挂载自定义 AI（start() 前生效）；内置 AiPlayer 作为兜底
          const llm = ensureLlmPlayer();
          llm._fallbackToasted = false;
          llm.attach(duel, new AiPlayer(duel));
          duel.ai = llm;
          pushLog("本局对手：🤖 大模型（" + (window.YGO_LLM.loadCfg().model || "未配置") + "）", true);
        }
        duel.start();
      }

      // 事件
      $("btn-new").onclick = () => openDeckSelect();
      const canAct = () =>
        duel &&
        duel.state &&
        duel.state.turnPlayer === "me" &&
        !duel.state.pending &&
        !duel.state.resolving &&
        !duel.state.winner;
      $("tb-main").onclick = () => {
        if (canAct() && ["main1", "battle", "main2"].includes(duel.state.phase))
          duel.nextPhase();
      };
      $("tb-alt").onclick = () => {
        if (canAct() && duel.state.phase === "battle") duel.nextPhase();
      };
      $("tb-end").onclick = () => {
        if (canAct() && ["main1", "battle"].includes(duel.state.phase))
          duel.endTurn();
      };
      // 头部图标按钮：统一注入内联 SVG
      $("btn-pace").innerHTML = IC.pace;
      $("btn-sfx").innerHTML = IC.sfxOn;
      $("btn-log").innerHTML = IC.log;
      $("btn-help").innerHTML = IC.help;
      $("btn-log-close").innerHTML = IC.close;
      $("btn-sfx").onclick = () => {
        sfxOn = !sfxOn;
        $("btn-sfx").innerHTML = sfxOn ? IC.sfxOn : IC.sfxOff;
        if (sfxOn) sfx("turn");
      };
      $("btn-pace").onclick = () => {
        const order = ["fast", "normal", "slow"];
        paceMode = order[(order.indexOf(paceMode) + 1) % order.length];
        try {
          localStorage.setItem("ygoPace2", paceMode);
        } catch (e) {
          /* 忽略存储失败 */
        }
        $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
        toast("游戏节奏：" + PACE_PRESETS[paceMode].label);
      };
      $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
      $("btn-log").onclick = () => $("log-panel").classList.toggle("show");
      $("btn-log-close").onclick = () =>
        $("log-panel").classList.remove("show");
      $("btn-help").onclick = () => showHelp();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenu();
          if (mode) exitMode();
          $("log-panel").classList.remove("show");
        }
      });

      newGame();
    </script>
  </body>
</html>
