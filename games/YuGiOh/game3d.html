<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏王·决斗对战（3D）</title>
    <link rel="stylesheet" href="./game3d.css?v=2" />
  </head>
  <body>
    <header>
      <a class="home" href="../../index.html" title="返回主页">← 主页</a>
      <div class="title">
        游戏王 · <b>决斗</b>
        <span class="b3d">3D</span>
      </div>
      <span class="phase-tag" id="phase-tag">准备</span>
      <span class="phase-help" id="phase-help" title="阶段说明">?</span>
      <div class="spacer"></div>
      <button type="button" class="icon-btn" id="btn-pace" title="游戏节奏" aria-label="游戏节奏"></button>
      <button type="button" class="icon-btn" id="btn-sfx" title="音效开关" aria-label="音效开关"></button>
      <button type="button" class="icon-btn" id="btn-log" title="对局日志" aria-label="对局日志"></button>
      <button type="button" class="icon-btn" id="btn-help" title="说明" aria-label="说明"></button>
      <button class="btn" id="btn-new">新对局</button>
    </header>

    <div class="board" id="board">
      <div class="lp-row ai-side" id="lp-row-ai">
        <span class="lp-name ai">AI</span>
        <div class="lp-bar" id="lp-ai-bar">
          <div class="lp-fill ai" id="lp-ai-fill"></div>
        </div>
        <span class="lp-val" id="lp-ai">8000</span>
      </div>
      <div class="stage" id="stage">
        <div class="hint3d">点击卡牌查看/操作 · 拖拽旋转视角（水平）</div>
      </div>
      <div class="lp-row" id="lp-row-me">
        <span class="lp-name me">玩家</span>
        <div class="lp-bar" id="lp-me-bar">
          <div class="lp-fill me" id="lp-me-fill"></div>
        </div>
        <span class="lp-val" id="lp-me">8000</span>
      </div>
      <div class="turn-bar" id="turn-bar">
        <div class="tb-phase">
          <div class="tb-tip" id="tb-tip">—</div>
        </div>
        <button class="tb-btn primary" id="tb-main">⚔ 进入战斗</button>
        <button class="tb-btn ghost" id="tb-alt">🛠 主阶段 2</button>
        <button class="tb-btn" id="tb-end">▶ 结束回合</button>
      </div>
    </div>

    <div class="mode-bar" id="mode-bar"></div>
    <div class="card-preview" id="card-preview"></div>
    <div class="atk-overlay" id="atk-overlay"></div>
    <div class="chain-banner" id="chain-banner"></div>
    <div class="llm-think" id="llm-think"><span class="tdot"></span>🤖 大模型思考中…</div>
    <div class="event-notify" id="event-notify"><span class="en-ic"></span><span class="en-tx"></span></div>
    <div class="log-panel" id="log-panel">
      <header>
        <div style="font-size: 14px; font-weight: 700">对局日志</div>
        <div class="spacer" style="flex: 1"></div>
        <div class="icon-btn" id="btn-log-close">✕</div>
      </header>
      <div class="log-body" id="log-body"></div>
    </div>
    <div class="modal-mask" id="modal-mask">
      <div class="modal" id="modal"></div>
    </div>
    <div class="toast" id="toast"></div>
    <div class="screen-flash" id="screen-flash"></div>
        <script type="importmap">
      {
        "imports": {
          "three": "../../node_modules/three/build/three.module.js",
          "animejs": "../../node_modules/animejs/dist/modules/index.js"
        }
      }
    </script>
    <script type="module">
      window.__errs = window.__errs || [];
      window.addEventListener("error", (e) => window.__errs.push(String((e && e.message) || e) + " @ " + ((e && e.error && e.error.stack) || "").split(String.fromCharCode(10)).slice(0,4).join(" | ")));
      window.addEventListener("unhandledrejection", (e) => window.__errs.push("promise: " + ((e.reason && e.reason.message) || e.reason)));
    </script>
    <script type="module" src="./ui3d/main.mjs?v=2"></script>
  </body>
</html>
