          actions.appendChild(e);
        }
        body.appendChild(actions);
        menu.appendChild(body);
        document.body.appendChild(menu);
        // 定位在 3D 卡牌投影处
        if (mesh3d) {
          const v = mesh3d.position.clone().project(camera);
          const rect = renderer.domElement.getBoundingClientRect();
          positionMenuAt(
            (v.x * 0.5 + 0.5) * rect.width + rect.left,
            (-v.y * 0.5 + 0.5) * rect.height + rect.top,
            menu,
          );
        } else {
          menu.style.left = "50%";
          menu.style.top = "50%";
          menu.style.transform = "translate(-50%,-50%)";
        }
        render();
      }
      function positionMenuAt(x, y, menu) {
        const mw = menu.offsetWidth,
          mh = menu.offsetHeight;
        let left = x - mw / 2;
        let top = y + 10;
        if (top + mh > window.innerHeight - 8) top = y - mh - 10;
        if (top < 8) top = 8;
        left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
        menu.style.left = left + "px";
        menu.style.top = top + "px";
        menu.style.transform = "none";
      }
      function closeMenu() {
        const m = $("card-menu");
        if (m) m.remove();
        document.querySelectorAll(".backdrop").forEach((b) => b.remove());
        if (menuOpen) {
          menuOpen = false;
          render();
        }
      }
      function availableActions(card, info) {
        const s = duel.state;
        const acts = [];
        const myTurn = s.turnPlayer === "me" && !s.pending && !s.resolving;
        const inMain = s.phase === "main1" || s.phase === "main2";
        if (info && info.kind === "hand" && myTurn && inMain) {
          const handIdx = info.idx;
          if (card.type === "monster") {
            if (card.level < 5) {
              acts.push({
                icon: "⚔",
                label: "通常召唤·攻击表示",
                primary: true,
                fn: () => {
                  duel.normalSummon(handIdx, null, "atk");
                  closeMenu();
                },
              });
              acts.push({
                icon: "🛡",
                label: "通常召唤·守备表示",
                fn: () => {
                  duel.normalSummon(handIdx, null, "def");
                  closeMenu();
                },
              });
              acts.push({
                icon: "🎴",
                label: "覆盖（里侧守备）",
                fn: () => {
                  duel.setMonster(handIdx, null);
                  closeMenu();
                },
              });
            } else {
              acts.push({
                icon: "⚔",
                label: `祭品召唤（需${card.level >= 7 ? 2 : 1}祭品）`,
                primary: true,
                fn: () => {
                  startTribute(handIdx);
                },
              });
            }
            if (duel.manualCondOk(card))
              acts.push({
                icon: "✨",
                label: "发动效果",
                fn: () => {
                  duel.activateHandMonsterEffect(handIdx);
                  closeMenu();
                },
              });
          } else if (card.type === "spell") {
            const canFire = duel.manualCondOk(card);
            if (canFire)
              acts.push({
                icon: "✨",
                label: "发动",
                primary: true,
                fn: () => {
                  duel.activateHandSpell(handIdx);
                  closeMenu();
                },
              });
            acts.push({
              icon: "🎴",
              label: "覆盖",
              primary: !canFire,
              fn: () => {
                duel.setSpellTrap(handIdx);
                closeMenu();
              },
            });
          } else if (card.type === "trap") {
            acts.push({
              icon: "🎴",
              label: "覆盖",
              primary: true,
              fn: () => {
                duel.setSpellTrap(handIdx);
                closeMenu();
              },
            });
          }
        }
        if (info && info.kind === "monster" && info.who === "me" && myTurn) {
          const idx = info.idx;
          if (card.faceDown) {
            if (inMain)
              acts.push({
                icon: "🔄",
                label: "翻转召唤",
                primary: true,
                fn: () => {
                  duel.flipSummon(idx);
                  closeMenu();
                },
              });
          } else {
            if (
              s.phase === "battle" &&
              card.position === "atk" &&
              !s.me.attacked[idx] &&
              s.turn > 1
            )
              acts.push({
                icon: "⚔",
                label: "攻击",
                primary: true,
                fn: () => {
                  enterAttackMode(idx);
                },
              });
            if (inMain) {
              acts.push({
                icon: "🔄",
                label: "切换表示形式",
                fn: () => {
                  duel.changePosition(idx);
                  closeMenu();
                },
              });
              if (duel.manualCondOk(card))
                acts.push({
                  icon: "✨",
                  label: "发动效果",
                  fn: () => {
                    duel.activateMonsterEffect(idx);
                    closeMenu();
                  },
                });
            }
          }
        }
        if (
          info &&
          info.kind === "st" &&
          info.who === "me" &&
          card.faceDown &&
          myTurn &&
          inMain &&
          card.turnSet < s.turn
        )
          acts.push({
            icon: "✨",
            label: "发动",
            primary: true,
            fn: () => {
              duel.activateSetTrap(info.idx);
              closeMenu();
            },
          });
        return acts;
      }

      /* ===================== 攻击/祭品模式 ===================== */
      function enterAttackMode(zoneIdx) {
        closeMenu();
        mode = "attack";
        attackZone = zoneIdx;
        render();
        renderModeBar();
      }
      function startTribute(handIdx) {
        closeMenu();
        mode = "tribute";
        tributeHandIdx = handIdx;
        tributePool = [];
        render();
        renderModeBar();
      }
      function exitMode() {
        mode = null;
        attackZone = null;
        tributeHandIdx = null;
        tributePool = [];
        render();
        renderModeBar();
      }
      function toggleTribute(idx) {
        if (tributePool.includes(idx))
          tributePool = tributePool.filter((x) => x !== idx);
        else tributePool.push(idx);
        render();
        renderModeBar();
      }
      function renderModeBar() {
        const bar = $("mode-bar");
        const overlay = $("atk-overlay");
        if (!mode) {
          bar.classList.remove("show");
          overlay.classList.remove("show");
          overlay.innerHTML = "";
          return;
        }
        if (mode === "attack") {
          // 攻击选择：悬浮居中面板（大按钮/目标提示，远离回合条防误点）
          bar.classList.remove("show");
          overlay.classList.add("show");
          overlay.innerHTML = "";
          const attacker = duel.state.me.monsterZone[attackZone];
          const title = document.createElement("div");
          title.className = "atk-title";
          title.textContent = (attacker ? attacker.name : "?") + " 正在攻击";
          overlay.appendChild(title);
          if (duel.state.ai.monsterZone.every((x) => !x)) {
            const b = document.createElement("button");
            b.className = "btn big";
            b.textContent = "💥 直接攻击";
            b.onclick = () => {
              duel.declareAttack(attackZone, null);
              exitMode();
            };
            overlay.appendChild(b);
          } else {
            const hint = document.createElement("div");
            hint.className = "atk-hint";
            hint.textContent = "🖱 点击对方怪兽（红色高亮）选择攻击目标";
            overlay.appendChild(hint);
          }
          const c = document.createElement("button");
          c.className = "btn ghost";
          c.textContent = "取消";
          c.onclick = () => exitMode();
          overlay.appendChild(c);
          return;
        }
        overlay.classList.remove("show");
        overlay.innerHTML = "";
        bar.classList.add("show");
        bar.innerHTML = "";
        if (mode === "tribute") {
          const card = duel.state.me.hand[tributeHandIdx];
          const need = card.level >= 7 ? 2 : 1;
          const lbl = document.createElement("div");
          lbl.className = "lbl";
          lbl.textContent = `祭品 ${tributePool.length}/${need}（金色高亮为已选）`;
          bar.appendChild(lbl);
          const ok = document.createElement("button");
          ok.className = "btn";
          ok.textContent = "确认召唤";
          ok.disabled = tributePool.length !== need;
          ok.onclick = () => {
            if (tributePool.length === need) {
              duel.tributeSummon(tributeHandIdx, [...tributePool], null, "atk");
              exitMode();
            }
          };
          bar.appendChild(ok);
          const c = document.createElement("button");
          c.className = "btn ghost";
          c.textContent = "取消";
          c.onclick = () => exitMode();
          bar.appendChild(c);
        }
      }

      /* ===================== 卡牌引导 chip（战斗攻击 / 祭品已选） ===================== */
      function renderChips() {
        const want = new Map(); // key -> { cls, text, fn }
        const s = duel && duel.state;
        if (s) {
          // 战斗阶段（未进入攻击选择模式）：可攻击显示 ⚔ 攻击，不可攻击显示原因
          if (
            s.turnPlayer === "me" &&
            s.phase === "battle" &&
            !s.pending &&
            !s.resolving &&
            !mode
          ) {
            s.me.monsterZone.forEach((m, i) => {
              if (!m) return;
              const blk = duel.attackBlock(i);
              want.set(
                m.uid,
                blk.ok
                  ? { cls: "atk", text: "⚔ 攻击", fn: () => enterAttackMode(i) }
                  : {
                      cls: "dim",
                      text: "⛔ " + blk.reason,
                      fn: () => toast(blk.reason),
                    },
              );
            });
          }
          // 祭品选择：已选卡打勾
          if (mode === "tribute") {
            s.me.monsterZone.forEach((m, i) => {
              if (!m || !tributePool.includes(i)) return;
              want.set(m.uid + ":sel", {
                cls: "sel",
                text: "✓ 已选",
                fn: null,
              });
            });
          }
        }
        // 差异更新：不重建未变化的 chip，避免 popIn 动画反复重播引起抖动
        for (const [key, el] of chipEls) {
          if (!want.has(key)) {
            el.remove();
            chipEls.delete(key);
          }
        }
        for (const [key, w] of want) {
          let el = chipEls.get(key);
          if (!el) {
            el = document.createElement("div");
            stage.appendChild(el);
            chipEls.set(key, el);
          }
          if (el.__cls !== w.cls || el.__text !== w.text) {
            el.className = "card-chip " + w.cls;
            el.textContent = w.text;
            el.onclick = w.fn || null;
            el.__cls = w.cls;
            el.__text = w.text;
          }
        }
      }

      /* ===================== 弹窗 ===================== */
      function renderPrompt(s) {
        const mask = $("modal-mask");
        const modal = $("modal");
        if (s.winner) return;
        if (!s.pending) {
          if (!mask.dataset.gameover) {
            mask.classList.remove("show");
            modal.innerHTML = "";
          }
          return;
        }
        const p = s.pending;
        mask.classList.add("show");
        if (p.kind === "select") {
          modal.innerHTML = `<h3>${p.msg}</h3><div class="opts" id="opts"></div>`;
          const opts = $("opts");
          (p.options || []).forEach((o) => {
            const w = document.createElement("div");
            w.className = "opt";
            const ce = cardEl(o.card, {});
            w.appendChild(ce);
            const lab = document.createElement("div");
            lab.className = "opt-label";
            lab.textContent = o.label || o.card.name;
            w.appendChild(lab);
            w.onclick = () => duel.answer(o.value);
            opts.appendChild(w);
          });
        } else if (p.kind === "chain") {
          const ev = p.event || {};
          let title = "是否连锁？";
          if (ev.kind === "attack_declare")
            title = `是否连锁？（${ev.attacker ? ev.attacker.name + " 攻击宣言" : "攻击"}）`;
          else if (ev.kind === "summon")
            title = `是否连锁？（${ev.monster ? (ev.hidden ? "怪兽覆盖" : ev.monster.name + " 召唤") : "召唤"}）`;
          else if (ev.kind === "activate")
            title = `是否连锁？（${ev.card ? ev.card.name + " 发动" : ""}）`;
          else if (ev.kind === "damage_calc") title = `是否连锁？（伤害计算）`;
          modal.innerHTML = `<h3>${title}</h3><div class="opts" id="opts"></div><div class="btns"></div>`;
          const opts = $("opts");
          (p.options || []).forEach((o) => {
            const w = document.createElement("div");
            w.className = "opt";
            const ce = cardEl(o.card, {});
            w.appendChild(ce);
            const lab = document.createElement("div");
            lab.className = "opt-label";
            lab.textContent = o.card.name;
            w.appendChild(lab);
            w.onclick = () => duel.answer(o);
            opts.appendChild(w);
          });
          const btns = modal.querySelector(".btns");
          const pass = document.createElement("button");
          pass.className = "btn ghost";
          pass.textContent = "不连锁";
          pass.onclick = () => duel.answer({ pass: true });
          btns.appendChild(pass);
        } else if (p.kind === "confirm") {
          modal.innerHTML = `<h3>${p.msg}</h3><div class="btns"></div>`;
          const btns = modal.querySelector(".btns");
          const yes = document.createElement("button");
          yes.className = "btn";
          yes.textContent = "是";
          yes.onclick = () => duel.answer(true);
          btns.appendChild(yes);
          const no = document.createElement("button");
          no.className = "btn ghost";
          no.textContent = "否";
          no.onclick = () => duel.answer(false);
          btns.appendChild(no);
        }
      }

      /* ===================== 日志/Toast/列表 ===================== */
      function pushLog(msg) {
        logBuf.push(msg);
        if (logBuf.length > 300) logBuf.shift();
        const body = $("log-body");
        const div = document.createElement("div");
        div.className =
          "entry" +
          (/破坏|全灭|无效|伤害|获胜|平局|祭品|特殊召唤|除外/.test(msg)
            ? " imp"
            : "");
        div.textContent = msg;
        body.appendChild(div);
        body.scrollTop = body.scrollHeight;
      }
      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove("show"), 2000);
      }
      function openListModal(title, list) {
        const mask = $("modal-mask");
        const modal = $("modal");
        mask.dataset.gameover = "";
        mask.classList.add("show");
        modal.innerHTML = `<h3>${title}（${list.length}）</h3><div class="opts" id="opts"></div><div class="btns"><button class="btn ghost" id="pile-close">关闭</button></div>`;
        const opts = $("opts");
        list.forEach((c) => {
          const w = document.createElement("div");
          w.className = "opt";
          w.appendChild(
            cardEl(c, { stats: c.type === "monster" ? duel.stats(c) : null }),
          );
          const lab = document.createElement("div");
          lab.className = "opt-label";
          lab.textContent = c.name;
          w.appendChild(lab);
          opts.appendChild(w);
        });
        $("pile-close").onclick = () => {
          delete mask.dataset.gameover;
          mask.classList.remove("show");
        };
      }

      /* ===================== 帮助/结束/卡组选择 ===================== */
      function showHelp() {
        const mask = $("modal-mask");
        const modal = $("modal");
        mask.dataset.gameover = "";
        mask.classList.add("show");
        modal.innerHTML = `<h3>游戏说明（3D 版）</h3><div class="help-list">
          <p><b>阶段</b>：抽卡→准备→主要1→战斗→主要2→结束。用底部回合条推进；先手首回合不抽卡、不能攻击。</p>
          <p><b>操作</b>：点击 3D 卡牌弹出操作菜单（召唤/覆盖/发动/攻击等）；点击卡组/墓地堆可查看。</p>
          <p><b>召唤</b>：通常召唤每回合1次；5-6星需1祭品、7星以上需2祭品；覆盖=里侧守备；翻转召唤翻开里侧。</p>
          <p><b>战斗</b>：ATK对ATK比攻差伤害；ATK对守备比攻守，不足部分反伤。含贯穿、直接攻击、攻击响应陷阱。</p>
          <p><b>魔陷</b>：魔法可当回合从手牌发动；陷阱须先覆盖且当回合不可发动。装备给己方怪兽，场地全场生效。</p>
          <p><b>连锁</b>：咒文速度 通常魔法/起动1、陷阱2、反击陷阱3，LIFO结算。伤害步骤可丢弃栗子球免伤。</p>
          <p><b>胜负</b>：LP归0 或 抽卡时卡组为0 即败。右上角 ▶ 调节奏、🔊 开关音效。</p>
        </div><div class="btns"><button class="btn ghost" id="help-close">关闭</button></div>`;
        $("help-close").onclick = () => {
          delete mask.dataset.gameover;
          mask.classList.remove("show");
        };
      }
      function showGameOver(winner) {
        winnerShown = true;
        const mask = $("modal-mask");
        const modal = $("modal");
        mask.dataset.gameover = "1";
        mask.classList.add("show");
        const win = winner === "me",
          draw = winner === "draw";
        modal.innerHTML = `<div class="gameover"><h2 class="${win ? "win" : "lose"}">${draw ? "平局" : win ? "胜利！" : "败北…"}</h2><p style="color:var(--dim);">${draw ? "双方同归于尽" : win ? "你击败了 AI" : "AI 取得了胜利"}</p><div class="btns"><button class="btn" id="again">再来一局</button></div></div>`;
        $("again").onclick = () => {
          delete mask.dataset.gameover;
          mask.classList.remove("show");
          newGame();
        };
      }
      const DECK_LABELS = {
        classic: "经典卡组",
        hero: "元素英雄（游城十代）",
        machine: "机械族",
        blueeyes: "青眼白龙",
        darkmagician: "黑魔术师",
        redeyes: "真红眼黑龙",
        harpie: "神鹰女郎",
        magnet: "磁石战士",
        warrior: "战士族",
        zombie: "不死族",
        fairy: "天使族",
      };
      const DECK_EMOJIS = {
        classic: "⚔️",
        hero: "🦸",
        machine: "⚙️",
        blueeyes: "🐉",
        darkmagician: "🧙",
        redeyes: "🐲",
        harpie: "🦅",
        magnet: "🧲",
      };
      function openDeckSelect() {
        const mask = $("modal-mask");
        const modal = $("modal");
        mask.dataset.gameover = "";
        mask.classList.add("show");
        const presets = window.YGO_DECK_PRESETS || ["classic"];
        let selMe = deckChoice,
          selAi = aiDeckChoice;
        modal.innerHTML = `<h3>选择卡组</h3>
          <div class="pick-label">你的卡组</div><div class="pick-row" id="pick-me"></div>
          <div class="pick-label">AI 的卡组</div><div class="pick-row" id="pick-ai"></div>
          <div class="btns"><button class="btn ghost" id="deck-cancel">取消</button><button class="btn" id="deck-start">开始对局</button></div>`;
        const buildRow = (elId, cur, onPick) => {
          const row = $(elId);
          for (const name of presets) {
            const w = document.createElement("div");
            w.className = "opt" + (name === cur ? " picked" : "");
            const card = document.createElement("div");
            card.className = "card menu-card";
            card.style.cssText =
              "width:84px;height:118px;display:grid;place-items:center;background:linear-gradient(160deg,#223,#445);border-radius:10px;";
            const em = document.createElement("div");
            em.style.cssText = "font-size:30px;";
            em.textContent = DECK_EMOJIS[name] || "🃏";
            card.appendChild(em);
            w.appendChild(card);
            const lab = document.createElement("div");
            lab.className = "opt-label";
            lab.textContent = DECK_LABELS[name] || name;
            w.appendChild(lab);
            w.onclick = () => onPick(name, row);
            row.appendChild(w);
          }
        };
        buildRow("pick-me", selMe, (name, row) => {
          selMe = name;
          row
            .querySelectorAll(".opt")
            .forEach((o) => o.classList.remove("picked"));
          row
            .querySelectorAll(".opt")
            [presets.indexOf(name)].classList.add("picked");
        });
        buildRow("pick-ai", selAi, (name, row) => {
          selAi = name;
          row
            .querySelectorAll(".opt")
            .forEach((o) => o.classList.remove("picked"));
          row
            .querySelectorAll(".opt")
            [presets.indexOf(name)].classList.add("picked");
        });
        $("deck-start").onclick = () => {
          delete mask.dataset.gameover;
          mask.classList.remove("show");
          deckChoice = selMe;
          aiDeckChoice = selAi;
          newGame();
        };
        $("deck-cancel").onclick = () => {
          delete mask.dataset.gameover;
          mask.classList.remove("show");
        };
      }

      /* ===================== 特效（3D + DOM 横幅混合） ===================== */
      const PHASE_TIPS = {
        draw: ["抽卡阶段", "自动从卡组抽 1 张"],
        standby: ["准备阶段", "自动推进"],
        main1: ["主要阶段 1", "点击卡牌：召唤怪兽 / 发动魔法 / 覆盖卡牌"],
        battle: ["战斗阶段", "点击攻击表示的怪兽发起攻击"],
        main2: ["主要阶段 2", "还可召唤、覆盖魔法·陷阱卡"],
        end: ["结束阶段", "手卡多于 6 张需丢弃"],
      };
      function fxEl(inner, x, y, cls, opts = {}) {
        const el = document.createElement("div");
        el.className = "fx " + cls;
        if (x != null && y != null) {
          el.style.left = x + "px";
          el.style.top = y + "px";
        }
        el.innerHTML = inner;
        document.body.appendChild(el);
        // anime 统一驱动：滑入放大 → 停留 → 上浮淡出移除
        const hold = opts.hold != null ? opts.hold : 1100;
        animate(el, {
          opacity: [0, 1],
          y: [14, 0],
          scale: [0.92, 1],
          duration: opts.dur || 300,
          ease: "outCubic",
          onComplete: () => {
            animate(el, {
              opacity: 0,
              y: -14,
              duration: 420,
              delay: hold,
              ease: "inQuad",
              onComplete: () => el.remove(),
            });
          },
        });
        return el;
      }
      function fxTurnBanner(player, turn) {
        const me = player === "me";
        const tip = me ? PHASE_TIPS.main1[1] : "AI 行动中…";
        fxEl(
          `<div class="turn-banner-inner ${me ? "me" : "ai"}"><b>${me ? "你的回合" : "AI 的回合"}</b><span>第 ${turn} 回合 · ${tip}</span></div>`,
          null,
          null,
          "fx-turn-banner",
          { dur: 340, hold: 1500 },
        );
      }
      function fxActBanner(card, actor) {
        const name = card ? card.name : "";
        const extra =
          card && card.cid === "kuriboh" ? "（该次战斗伤害无效）" : "";
        fxEl(
          `<span class="fx-act-txt">✨ ${actor === "me" ? "玩家" : "AI"} 发动：${name}${extra}</span>`,
          null,
          null,
          "fx-act-banner",
          { dur: 260, hold: 900 },
        );
      }
      function fxPhaseBanner(phase, player) {
        const t = PHASE_TIPS[phase];
        if (!t) return;
        const me = player === "me";
        fxEl(
          `<div class="fx-phase-inner ${me ? "me" : "ai"}"><b>${t[0]}</b>${t[1] ? `<span>${t[1]}</span>` : ""}</div>`,
          null,
          null,
          "fx-phase-banner",
          { dur: 300, hold: 1300 },
        );
      }
      function projectCard3D(uid) {
        const g = cardMeshes.get(uid);
        if (!g) return null;
        const v = g.position.clone().project(camera);
        const rect = renderer.domElement.getBoundingClientRect();
        return {
          x: (v.x * 0.5 + 0.5) * rect.width + rect.left,
          y: (-v.y * 0.5 + 0.5) * rect.height + rect.top,
        };
      }
      function fxGlow3D(card, color) {
        const p = projectCard3D(card.uid);
        if (!p) return;
        fxEl(`<div class="fx-burst-txt">✨</div>`, p.x, p.y - 40, "fx-burst");
      }
      function fxAttack3D(attacker, target) {
        const ag = cardMeshes.get(attacker.uid);
        if (!ag) return;
        const fromPos = ag.position.clone();
        const tg = target ? cardMeshes.get(target.uid) : null;
        const toPos = tg
          ? tg.position.clone().add(new THREE.Vector3(0, 0, -0.55))
          : fromPos.clone().add(new THREE.Vector3(0, 0.4, -2.2));
        sfx("attack");
        // 1) 突进（贝塞尔急冲）→ 2) 命中：冲击波 + 闪光 + 目标受击后退 → 3) 弹性回弹
        tween3D(ag, { pos: toPos }, 150, "attack", () => {
          shockwave3D(tg ? tg.position.clone() : toPos);
          burst3D(toPos, "#e6b24a", 10);
          if (tg) {
            flashMesh3D(tg);
            const base = tg.position.clone();
            const nudge = base.clone().add(new THREE.Vector3(0, 0, 0.22));
            tween3D(tg, { pos: nudge }, 90, "easeIn", () => {
              tween3D(tg, { pos: base }, 240, "easeOut", null);
            });
          }
          shakeBoard();
          tween3D(ag, { pos: fromPos }, 420, "recoil", null);
        });
      }
      function fxImpact3D(ev) {
        const dmg = ev.damage || 0;
        const posCard = ev.direct
          ? null
          : ev.damageTo === "def"
            ? ev.target
            : ev.attacker;
        let p = posCard ? projectCard3D(posCard.uid) : null;
        if (!p) {
          const who = ev.damageTo || "ai";
          const bar = $(`lp-${who}-bar`);
          const r = bar.getBoundingClientRect();
          p = { x: r.x + r.width / 2, y: r.y };
        }
        if (ev.direct)
          fxEl(
            `<div class="fx-burst-txt">💥 直接攻击！</div>`,
            p.x,
            p.y - 54,
            "fx-burst",
          );
        else
          fxEl(
            `<div class="fx-burst-txt">${ev.damageTo === "def" ? "💥" : "↩"}</div>`,
            p.x,
            p.y - 30,
            "fx-burst",
          );
        if (dmg > 0)
          fxEl(`<b class="fx-dmg-txt">−${dmg}</b>`, p.x, p.y - 58, "fx-dmg");
        shakeBoard();
        sfx("damage");
      }
      function fxBurst3D(card, color) {
        const g = cardMeshes.get(card.uid);
        if (!g) return;
        shatter3D(g, color || "#ffd24a"); // 碎裂飞散
        burst3D(g.position.clone(), color || "#ffd24a", 12); // 碎屑
        sfx("destroy");
      }
      function fxSummon3D(card) {
        fxGlow3D(card, "#e6b24a");
        sfx("summon");
      }
      function fxPause(ms) {
        return new Promise((r) => setTimeout(r, ms));
      }

      function fxEvent(ev) {
        if (!ev || !ev.kind) return null;
        switch (ev.kind) {
          case "turn_start":
            fxTurnBanner(ev.player, ev.turn);
            sfx("turn");
            return fxPause(600);
          case "phase_start":
            if (ev.phase === "battle" || ev.phase === "main2") {
              fxPhaseBanner(ev.phase, ev.player);
              return fxPause(500);
            }
            return null;
          case "draw_card":
            sfx("draw");
            break;
          case "summon":
            if (!ev.hidden) {
              fxSummon3D(ev.monster);
              return fxPause(300);
            }
            break;
          case "activate":
            if (ev.source === "auto") {
              fxGlow3D(ev.card, "#e6b24a");
              break;
            }
            fxActBanner(ev.card, ev.actor);
            fxGlow3D(ev.card, "#e6b24a");
            sfx("activate");
            return fxPause(320);
          case "attack_declare":
            fxAttack3D(ev.attacker, ev.target);
            return fxPause(340);
          case "damage_calc":
            fxImpact3D(ev);
            return fxPause(290);
          case "destroyed_by_battle":
            fxBurst3D(ev.card, "#ffd24a");
            return fxPause(240);
          case "sent_to_grave":
            if (ev.from === "field") {
              if (ev.reason === "effect" || ev.reason === "negate")
                fxBurst3D(ev.card, "#ff6b4a");
              else if (ev.reason === "tribute" || ev.reason === "fusion")
                fxGlow3D(ev.card, "#c9a86a");
            }
            break;
          case "flip":
            if (ev.monster) {
              const g = cardMeshes.get(ev.monster.uid);
              if (g) tween3D(g, { rotY: Math.PI * 2 }, 380, "easeInOut", null);
              sfx("flip");
              return fxPause(240);
            }
            break;
          case "lp_change":
            fxLpFloat(ev.player, ev.delta);
            if (ev.delta < 0) shakeBoard();
            break;
        }
        return null;
      }
      function fxLpFloat(player, delta) {
        if (delta >= 0) return;
        const bar = $(`lp-${player}-bar`);
        const r = bar.getBoundingClientRect();
        fxEl(
          `<b class="fx-dmg-txt small">−${-delta}</b>`,
          r.x + r.width / 2,
          r.y - 14,
          "fx-dmg",
        );
      }

      /* ===================== 启动 ===================== */
      function newGame() {
        logBuf = [];
        $("log-body").innerHTML = "";
        winnerShown = false;
        prevLp = { me: 8000, ai: 8000 };
        lastChainLen = 0;
        const mask = $("modal-mask");
        delete mask.dataset.gameover;
        mask.classList.remove("show");
        $("modal").innerHTML = "";
        $("log-panel").classList.remove("show");
        closeMenu();
        exitMode();
        // 清空 3D 场景
        for (const [, g] of cardMeshes) scene.remove(g);
        cardMeshes.clear();
        texCache.clear();
        artCache.clear();
        if (duel) {
          duel.state.winner = null;
          duel = null;
        }
        duel = new Duel(
          {
            playerPreset: deckChoice,
            aiPreset: aiDeckChoice,
            pace: PACE_PRESETS[paceMode].pace,
            promptDelay: PACE_PRESETS[paceMode].promptDelay,
          },
          {
            onState: () => {
              render();
              sync3D();
            },
            onLog: (m) => pushLog(m),
            onToast: (m) => toast(m),
            onEvent: (ev) => fxEvent(ev),
            onGameOver: (who) => {
              sfx(who === "me" ? "win" : who === "draw" ? "chain" : "lose");
            },
          },
        );
        duel.start();
      }

      // 事件
      $("btn-new").onclick = () => openDeckSelect();
      const canAct = () =>
        duel &&
        duel.state &&
        duel.state.turnPlayer === "me" &&
        !duel.state.pending &&
        !duel.state.resolving &&
        !duel.state.winner;
      $("tb-main").onclick = () => {
        if (canAct() && ["main1", "battle", "main2"].includes(duel.state.phase))
          duel.nextPhase();
      };
      $("tb-alt").onclick = () => {
        if (canAct() && duel.state.phase === "battle") duel.nextPhase();
      };
      $("tb-end").onclick = () => {
        if (canAct() && ["main1", "battle"].includes(duel.state.phase))
          duel.endTurn();
      };
      $("btn-sfx").onclick = () => {
        sfxOn = !sfxOn;
        $("btn-sfx").textContent = sfxOn ? "🔊" : "🔇";
        if (sfxOn) sfx("turn");
      };
      $("btn-pace").onclick = () => {
        const order = ["fast", "normal", "slow"];
        paceMode = order[(order.indexOf(paceMode) + 1) % order.length];
        try {
          localStorage.setItem("ygoPace2", paceMode);
        } catch (e) {
          /* 忽略存储失败 */
        }
        $("btn-pace").textContent = PACE_PRESETS[paceMode].label.charAt(0);
        $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
        toast("游戏节奏：" + PACE_PRESETS[paceMode].label);
      };
      $("btn-pace").textContent = PACE_PRESETS[paceMode].label.charAt(0);
      $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
      $("btn-log").onclick = () => $("log-panel").classList.toggle("show");
      $("btn-log-close").onclick = () =>
        $("log-panel").classList.remove("show");
      $("btn-help").onclick = () => showHelp();
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeMenu();
          if (mode) exitMode();
          $("log-panel").classList.remove("show");
        }
      });

      newGame();
    </script>
  </body>
</html>
