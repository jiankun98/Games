<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏王·决斗对战</title>
    <script src="./cards.js"></script>
    <script src="./index.js"></script>
    <script src="./ai-player.js"></script>
    <style>
      :root {
        --bg: #0b0e16;
        --mat-1: #161c2b;
        --mat-2: #1d2436;
        --mat-edge: #2b3550;
        --panel: #1a2030;
        --panel-2: #232b3f;
        --border: #324056;
        --text: #eef1f7;
        --dim: #8a93a8;
        --accent: #e6b24a;
        --accent-2: #c75548;
        --mon: #d9b441;
        --spell: #2fae63;
        --trap: #a45fdc;
        --lp-me: #4aa3ff;
        --lp-ai: #e5484d;
        --ok: #43b581;
        --slot: rgba(255, 255, 255, 0.04);
        --slot-border: rgba(230, 178, 74, 0.22);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(230,178,74,0.08), transparent 55%),
          radial-gradient(ellipse at 50% 100%, rgba(199,85,72,0.08), transparent 55%),
          var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        user-select: none;
      }

      /* ============ 顶栏 ============ */
      header {
        height: 46px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
        padding: 0 16px; background: rgba(16,20,32,0.7); backdrop-filter: blur(6px);
        border-bottom: 1px solid var(--border); z-index: 20;
      }
      header a.home { color: var(--dim); text-decoration: none; font-size: 13px; }
      header a.home:hover { color: var(--accent); }
      header .title { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
      header .title b { color: var(--accent); }
      .phase-tag {
        padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600;
        background: var(--panel-2); border: 1px solid var(--border); transition: all 0.3s;
      }
      .phase-tag.me { color: var(--lp-me); border-color: var(--lp-me); box-shadow: 0 0 10px rgba(74,163,255,0.3); }
      .phase-tag.ai { color: var(--lp-ai); border-color: var(--lp-ai); box-shadow: 0 0 10px rgba(229,72,77,0.3); }
      .turn-info { font-size: 12px; color: var(--dim); }
      header .spacer { flex: 1; }
      .icon-btn {
        width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer;
        background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
        font-size: 15px; color: var(--text); transition: all 0.15s;
      }
      .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
      .icon-btn .badge { position: absolute; }
      .btn {
        background: linear-gradient(180deg, var(--accent), #c89432); color: #1a1208; border: none;
        border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer;
        box-shadow: 0 2px 8px rgba(230,178,74,0.3); transition: all 0.15s;
      }
      .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }
      .btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); box-shadow: none; }

      /* ============ 棋盘 ============ */
      .board { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 6px 12px; gap: 4px; }

      .lp-row { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
      .lp-name { font-size: 13px; font-weight: 700; width: 56px; }
      .lp-name.ai { color: var(--lp-ai); }
      .lp-name.me { color: var(--lp-me); }
      .lp-bar { flex: 1; height: 14px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; position: relative; }
      .lp-fill { height: 100%; transition: width 0.6s cubic-bezier(.2,.8,.2,1); }
      .lp-fill.me { background: linear-gradient(90deg, #1e5fa0, var(--lp-me)); }
      .lp-fill.ai { background: linear-gradient(90deg, #8a2f2f, var(--lp-ai)); }
      .lp-bar.flash { animation: lpFlash 0.5s ease; }
      @keyframes lpFlash { 0%,100% { box-shadow: none; } 30% { box-shadow: 0 0 18px rgba(229,72,77,0.9); } }
      .lp-val { font-size: 13px; font-weight: 700; width: 52px; text-align: right; font-variant-numeric: tabular-nums; }

      /* 手牌 */
      .hand { display: flex; justify-content: center; align-items: flex-end; min-height: 70px; padding: 2px 0; }
      .hand.opp { align-items: flex-start; }
      .hand .card { margin-left: -34px; }
      .hand .card:first-child { margin-left: 0; }
      .hand.me .card { width: 90px; height: 126px; }
      .hand.opp .card { width: 60px; height: 84px; }

      /* 卡垫 */
      .mat {
        flex: 1; min-height: 0; position: relative;
        background:
          radial-gradient(ellipse at 50% 50%, rgba(230,178,74,0.06), transparent 70%),
          linear-gradient(180deg, var(--mat-1), var(--mat-2));
        border: 1px solid var(--mat-edge); border-radius: 14px;
        box-shadow: inset 0 0 40px rgba(0,0,0,0.5), 0 6px 24px rgba(0,0,0,0.4);
        display: flex; flex-direction: column; overflow: hidden;
      }
      .mat::before {
        content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
        background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 10px, transparent 10px 20px);
      }
      .field {
        flex: 1; display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; padding: 3px 14px;
        align-items: center; position: relative; z-index: 1;
      }
      .side-col { display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; }
      .pile {
        width: 44px; height: 60px; border-radius: 5px; display: grid; place-items: center;
        font-size: 10px; color: var(--dim); cursor: pointer; position: relative;
        background: rgba(0,0,0,0.25); border: 1px solid var(--border); transition: all 0.15s;
      }
      .pile:hover { border-color: var(--accent); color: var(--accent); }
      .pile .cnt { position: absolute; bottom: -2px; right: -4px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 0 4px; font-size: 10px; color: var(--text); }
      .pile.field-pile { border-style: dotted; }
      .zones { display: flex; justify-content: center; }
      .zone-row { display: flex; gap: 5px; justify-content: center; align-items: center; }
      /* 魔陷槽（保持原尺寸，紫色调） */
      .slot {
        width: 100px; height: 136px; border-radius: 7px; background: rgba(164,95,220,0.05);
        border: 1.5px dashed rgba(164,95,220,0.35); display: grid; place-items: center; position: relative;
        transition: border-color 0.2s, background 0.2s;
      }
      /* 怪兽槽（更大更突出，金色调） */
      .slot.mz {
        width: 106px; height: 152px; background: rgba(230,178,74,0.05);
        border-color: var(--slot-border);
      }
      .slot.mz:empty::after {
        content: "⚔"; position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 22px; opacity: 0.2; pointer-events: none;
      }
      .slot.sz:empty::after {
        content: "✨"; position: absolute; inset: 0; display: grid; place-items: center;
        font-size: 15px; opacity: 0.15; pointer-events: none;
      }
      .slot.has { border-style: solid; border-color: transparent; background: transparent; }
      .slot.target-hint { border-color: var(--accent-2); background: rgba(199,85,72,0.08); }

      /* ============ 卡牌（立绘铺满 + 悬浮数值） ============ */
      .card {
        border-radius: 7px; position: relative; cursor: pointer; flex-shrink: 0;
        width: 100%; height: 100%; /* 悬浮布局后需显式尺寸撑开容器 */
        display: flex; flex-direction: column; overflow: hidden;
        border: 1px solid rgba(0,0,0,0.5); box-shadow: 0 2px 6px rgba(0,0,0,0.45);
        transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      }
      .card.monster { background: linear-gradient(160deg, #e8c64b, #b8902a); }
      .card.spell { background: linear-gradient(160deg, #3fb06c, #247a42); }
      .card.trap { background: linear-gradient(160deg, #a85fd6, #6e3392); }
      /* 名字条：悬浮在卡面顶部 */
      .card .namebar {
        position: absolute; top: 0; left: 0; right: 0; z-index: 4;
        background: linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.28));
        color: #fff; font-size: 9px; padding: 2px 5px; line-height: 1.15; overflow: hidden; font-weight: 700;
        text-shadow: 0 1px 2px rgba(0,0,0,0.85);
      }
      /* 卡面主体：占满整卡（立绘/emoji 在此） */
      .card .art { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
      .card .art::before { /* 程序化卡面的光晕质感 */
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(circle at 50% 42%, rgba(255,255,255,0.20), transparent 55%);
      }
      .card .art .em { font-size: 26px; opacity: 0.92; text-shadow: 0 1px 3px rgba(0,0,0,0.45); position: relative; }
      .card .attr {
        position: absolute; top: 16px; right: 3px; z-index: 3; font-size: 10px;
        background: rgba(0,0,0,0.35); border-radius: 4px; padding: 0 3px; line-height: 1.4;
      }
      .card .stars { position: absolute; top: 15px; left: 0; right: 0; text-align: center; z-index: 3; font-size: 7px; color: #ffe08a; letter-spacing: 0.5px; text-shadow: 0 1px 1px #000; }
      /* 数值条：悬浮在卡面底部（常驻显示） */
      .card .foot {
        position: absolute; bottom: 0; left: 0; right: 0; z-index: 4;
        background: linear-gradient(rgba(0,0,0,0.20), rgba(0,0,0,0.82));
        color: #fff; font-size: 10px; padding: 2px 5px 3px; display: flex; justify-content: space-between;
        font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.85); letter-spacing: 0.3px;
      }
      .card .foot b { color: #ffe08a; font-variant-numeric: tabular-nums; }
      .card .sub {
        position: absolute; bottom: 18px; left: 0; right: 0; z-index: 3;
        font-size: 7px; color: rgba(255,255,255,0.92); padding: 0; text-align: center;
        text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      }
      /* 立绘加载成功：隐藏悬浮条与 emoji，露出完整卡图；数值条常驻保留 */
      .card.has-art .namebar, .card.has-art .attr, .card.has-art .stars, .card.has-art .sub, .card.has-art .em { display: none; }
      .card.has-art:hover .namebar { display: block; }
      /* 大手牌 */
      .hand.me .card .namebar { font-size: 12px; padding: 4px 8px; }
      .hand.me .card .art .em { font-size: 38px; }
      .hand.me .card .attr { font-size: 13px; top: 23px; right: 5px; }
      .hand.me .card .stars { top: 23px; font-size: 10px; }
      .hand.me .card .foot { font-size: 12px; padding: 3px 8px 4px; }
      .hand.me .card .sub { font-size: 9px; bottom: 22px; }

      .card.back { background: repeating-linear-gradient(45deg, #3a2350 0 8px, #2c1a3e 8px 16px); border: 1px solid #5a3a78; }
      .card.back .art::after { content: "✦"; font-size: 22px; color: rgba(255,255,255,0.45); }
      .card.back .namebar, .card.back .foot, .card.back .stars, .card.back .attr, .card.back .sub { display: none; }
      /* 弹窗（选目标/看墓地等）与卡组堆中的卡：悬浮布局下需要显式尺寸 */
      .modal .opt .card { width: 96px; height: 134px; }
      .pile .card { width: 100%; height: 100%; }
      .card.set { background: repeating-linear-gradient(45deg, #3a2350 0 8px, #2c1a3e 8px 16px); border: 1px solid #5a3a78; transform: rotate(90deg); }
      .card.set .namebar, .card.set .art, .card.set .foot, .card.set .stars, .card.set .attr, .card.set .sub { display: none; }
      .card.def-pos { transform: rotate(90deg); }

      .card:hover { transform: translateY(-6px) scale(1.04); box-shadow: 0 12px 22px rgba(0,0,0,0.6); z-index: 30; }
      .hand.me .card:hover { transform: translateY(-14px) scale(1.1); z-index: 40; }
      .card.set:hover, .card.def-pos:hover { transform: rotate(90deg) translateY(-6px) scale(1.04); }
      .card.selected { box-shadow: 0 0 0 3px var(--accent), 0 8px 18px rgba(0,0,0,0.6); animation: selPulse 1.4s ease-in-out infinite; }
      @keyframes selPulse { 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 20px rgba(230,178,74,0.6); } }
      .card.targetable { box-shadow: 0 0 0 3px var(--accent-2); animation: tgtPulse 0.9s ease-in-out infinite; cursor: crosshair; }
      @keyframes tgtPulse { 50% { box-shadow: 0 0 0 3px var(--accent-2), 0 0 16px rgba(199,85,72,0.7); } }
      .card.legal { box-shadow: 0 0 0 2px rgba(230,178,74,0.55), 0 2px 6px rgba(0,0,0,0.45); }
      .card.legal:hover { box-shadow: 0 0 0 3px var(--accent), 0 10px 20px rgba(0,0,0,0.6); }
      .card.enter { animation: cardIn 0.28s cubic-bezier(.2,.9,.3,1.2); }
      @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(0.85); } to { opacity: 1; } }
      .card.summon-sick { filter: saturate(0.85); }
      /* 立绘（ygoprodeck 全卡图） */
      .card .scan { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; border-radius: 7px; }
      .card .stats-badge { position: absolute; left: 3px; bottom: 3px; z-index: 5; background: rgba(0,0,0,0.72); color: #ffe08a; font-size: 9px; padding: 1px 4px; border-radius: 4px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
      .hand.me .card .stats-badge { font-size: 11px; padding: 2px 6px; }

      /* 卡牌上的操作提示徽章 */
      .card .action-hint {
        position: absolute; top: 3px; left: 3px; display: none; gap: 3px; z-index: 5;
      }
      .card:hover .action-hint { display: flex; }
      .action-hint .chip {
        background: rgba(0,0,0,0.6); color: var(--accent); border: 1px solid var(--accent);
        border-radius: 8px; font-size: 10px; width: 18px; height: 18px; display: grid; place-items: center;
      }

      /* ============ 中部信息条 ============ */
      .center-strip {
        display: flex; align-items: center; gap: 10px; padding: 2px 14px;
        border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
        background: rgba(0,0,0,0.2); position: relative; z-index: 2;
      }
      .log-ticker {
        flex: 1; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; cursor: pointer; font-family: "SF Mono", Consolas, monospace;
      }
      .log-ticker:hover { color: var(--accent); }
      .phase-dots { display: flex; gap: 4px; }
      .phase-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: all 0.3s; }
      .phase-dots .dot.active { background: var(--accent); box-shadow: 0 0 8px var(--accent); transform: scale(1.3); }
      .phase-dots .dot.done { background: var(--dim); }

      /* ============ popover 卡牌操作菜单 ============ */
      .backdrop { position: fixed; inset: 0; z-index: 60; }
      .card-menu {
        position: fixed; z-index: 61; background: var(--panel); border: 1px solid var(--accent);
        border-radius: 12px; padding: 12px; box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 0 0 1px rgba(230,178,74,0.2);
        display: flex; gap: 12px; min-width: 280px; animation: popIn 0.16s ease;
      }
      @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(6px); } to { opacity: 1; transform: scale(1); } }
      .card-menu .menu-card { width: 116px; height: 162px; flex-shrink: 0; }
      .card-menu .menu-card .namebar { font-size: 11px; padding: 3px 6px; }
      .card-menu .menu-card .art .em { font-size: 44px; }
      .card-menu .menu-card .attr { font-size: 13px; top: 22px; right: 5px; }
      .card-menu .menu-card .stars { top: 22px; font-size: 9px; }
      .card-menu .menu-card .foot { font-size: 11px; padding: 2px 7px 3px; }
      .card-menu .menu-card .sub { font-size: 8px; bottom: 19px; }
      .card-menu .menu-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
      .card-menu .meta { font-size: 11px; color: var(--dim); line-height: 1.4; }
      .card-menu .meta b { color: var(--text); font-size: 13px; }
      .card-menu .text { font-size: 11px; line-height: 1.5; color: #c8c0d2; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 6px 8px; max-height: 70px; overflow-y: auto; }
      .card-menu .actions { display: flex; flex-direction: column; gap: 6px; }
      .card-menu .act-btn {
        display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
        background: var(--panel-2); border: 1px solid var(--border); color: var(--text); font-size: 13px;
        font-weight: 600; transition: all 0.12s;
      }
      .card-menu .act-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateX(2px); background: rgba(230,178,74,0.1); }
      .card-menu .act-btn.primary { background: linear-gradient(180deg, var(--accent), #c89432); color: #1a1208; border-color: transparent; }
      .card-menu .act-btn .ic { width: 22px; height: 22px; display: grid; place-items: center; font-size: 15px; }
      .card-menu .empty { font-size: 12px; color: var(--dim); padding: 8px 0; }

      /* ============ 浮动操作条（攻击/祭品模式） ============ */
      .mode-bar {
        position: fixed; bottom: 76px; left: 50%; transform: translateX(-50%); z-index: 55;
        background: rgba(16,20,32,0.95); border: 1px solid var(--accent); border-radius: 24px;
        padding: 8px 10px; display: none; gap: 8px; align-items: center;
        box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: popIn 0.16s ease;
      }
      .mode-bar.show { display: flex; }
      .mode-bar .lbl { font-size: 12px; color: var(--dim); padding: 0 8px; }
      .mode-bar .btn { padding: 6px 14px; font-size: 12px; }

      /* ============ 回合控制条（棋盘布局流内，不遮挡卡牌） ============ */
      .turn-bar {
        flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 6px 14px; border-top: 1px solid var(--border);
        background: rgba(16,20,32,0.88); border-radius: 0 0 12px 12px;
      }
      .turn-bar .tb-phase { display: flex; flex-direction: column; gap: 1px; min-width: 200px; }
      .turn-bar .tb-phase > div:first-child { font-size: 13px; font-weight: 700; color: var(--lp-me); letter-spacing: 1px; white-space: nowrap; }
      .turn-bar .tb-tip { font-size: 11px; color: var(--dim); white-space: nowrap; letter-spacing: 0.5px; }
      .turn-bar.ai .tb-phase > div:first-child { color: var(--lp-ai); }
      .tb-btn {
        border: none; border-radius: 18px; padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
        transition: transform 0.12s ease, filter 0.12s ease, box-shadow 0.12s ease; white-space: nowrap;
      }
      .tb-btn.primary {
        background: linear-gradient(180deg, var(--accent), #c89432); color: #1a1208;
        box-shadow: 0 3px 12px rgba(230,178,74,0.4);
      }
      .tb-btn.ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
      .tb-btn:hover { filter: brightness(1.12); transform: translateY(-2px); }
      .tb-btn:active { transform: translateY(0) scale(0.94); filter: brightness(0.95); }
      .tb-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; filter: none; }

      /* 棋盘震动 */
      .board.shake { animation: boardShake 0.4s ease; }
      @keyframes boardShake {
        0%, 100% { transform: none; }
        20% { transform: translateX(-6px); }
        40% { transform: translateX(6px); }
        60% { transform: translateX(-4px); }
        80% { transform: translateX(4px); }
      }

      /* ============ 日志面板 ============ */
      .log-panel {
        position: fixed; bottom: 0; left: 0; right: 0; height: 240px; z-index: 50;
        background: rgba(12,16,26,0.97); border-top: 1px solid var(--accent); display: none;
        flex-direction: column; box-shadow: 0 -8px 30px rgba(0,0,0,0.5); animation: slideUp 0.2s ease;
      }
      .log-panel.show { display: flex; }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      .log-panel header { height: 38px; border-bottom: 1px solid var(--border); background: var(--panel); }
      .log-panel .log-body { flex: 1; overflow-y: auto; padding: 10px 16px; font-family: "SF Mono", Consolas, monospace; font-size: 12px; line-height: 1.6; }
      .log-panel .entry { color: #cdd3dc; }
      .log-panel .entry.imp { color: var(--accent); }
      .log-panel .entry:hover { background: rgba(255,255,255,0.04); }

      /* ============ 模态 ============ */
      .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; place-items: center; z-index: 70; padding: 20px; backdrop-filter: blur(2px); }
      .modal-mask.show { display: grid; animation: fadeIn 0.15s; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; max-width: 680px; width: 100%; max-height: 84vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(0,0,0,0.6); animation: popIn 0.18s ease; }
      .modal h3 { margin: 0 0 14px; font-size: 16px; }
      .modal .opts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .pick-label { font-size: 13px; font-weight: 700; color: var(--accent); margin: 12px 0 8px; letter-spacing: 2px; }
      .pick-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .opt.picked .card { box-shadow: 0 0 0 3px var(--accent), 0 0 18px rgba(230,178,74,0.55); }
      .modal .opt { cursor: pointer; text-align: center; }
      .modal .opt:hover .card { transform: translateY(-6px) scale(1.05); }
      .modal .opt-label { font-size: 11px; color: var(--dim); margin-top: 4px; max-width: 96px; }
      .modal .btns { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
      .help-list { font-size: 13px; color: var(--dim); line-height: 1.8; }
      .help-list b { color: var(--accent); }
      .help-list p { margin: 8px 0; }
      .gameover { text-align: center; }
      .gameover h2 { font-size: 32px; margin: 10px 0; }
      .gameover h2.win { color: var(--ok); text-shadow: 0 0 20px rgba(67,181,129,0.5); }
      .gameover h2.lose { color: var(--lp-ai); text-shadow: 0 0 20px rgba(229,72,77,0.5); }

      /* ============ 连锁横幅 ============ */
      .chain-banner {
        position: fixed; top: 56px; left: 50%; transform: translateX(-50%); z-index: 40;
        background: rgba(16,20,32,0.96); border: 1px solid var(--accent); border-radius: 10px;
        padding: 8px 14px; font-size: 12px; display: none; max-width: 70vw;
        box-shadow: 0 6px 22px rgba(0,0,0,0.5);
      }
      .chain-banner.show { display: block; animation: popIn 0.18s ease; }
      .chain-banner .links { display: flex; gap: 6px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
      .chain-banner .link { font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; animation: linkIn 0.2s ease; }
      @keyframes linkIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; } }

      .toast {
        position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
        background: rgba(16,20,32,0.95); color: #fff; padding: 9px 18px; border-radius: 20px;
        font-size: 13px; border: 1px solid var(--accent); opacity: 0; transition: opacity 0.25s, transform 0.25s;
        z-index: 80; pointer-events: none;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

      .screen-flash { position: fixed; inset: 0; pointer-events: none; z-index: 90; opacity: 0; }
      .screen-flash.on { animation: scrFlash 0.4s ease; }
      @keyframes scrFlash { 0% { opacity: 0; } 20% { opacity: 0.5; } 100% { opacity: 0; } }

      /* ============ 特效反馈 ============ */
      .fx { position: fixed; pointer-events: none; z-index: 95; }
      .fx-dmg { transform: translate(-50%, -50%); }
      .fx-dmg .fx-dmg-txt, .fx-dmg b.fx-dmg-txt {
        display: block; font-size: 30px; font-weight: 900; color: #ff6b6b; font-style: normal;
        text-shadow: 0 2px 10px rgba(0,0,0,0.9); animation: fxDmgUp 1s ease-out forwards; transform: translate(-50%, -50%);
      }
      .fx-dmg .fx-dmg-txt.small { font-size: 19px; color: #ff9d9d; }
      @keyframes fxDmgUp {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        15% { opacity: 1; transform: translate(-50%, -62%) scale(1.2); }
        100% { opacity: 0; transform: translate(-50%, -170%) scale(1); }
      }
      .fx-burst-txt {
        font-size: 32px; font-weight: 900; color: #ffd24a; white-space: nowrap;
        text-shadow: 0 0 16px rgba(255,120,40,0.9); transform: translate(-50%, -50%); animation: fxBurstPop 0.55s ease-out forwards;
      }
      @keyframes fxBurstPop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1.35); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.55); }
      }
      .fx-act-banner, .fx-turn-banner { left: 0; right: 0; text-align: center; }
      .fx-act-banner { top: 30%; animation: fxBannerIn 1s ease forwards; }
      .fx-act-txt {
        display: inline-block; background: rgba(10,14,24,0.94); border: 1px solid var(--accent); border-radius: 12px;
        padding: 8px 20px; font-size: 16px; font-weight: 700; color: var(--accent);
        box-shadow: 0 0 26px rgba(230,178,74,0.35);
      }
      .fx-turn-banner { top: 34%; animation: fxBannerIn 1.3s ease forwards; }
      /* 阶段提示横幅（位于棋盘中部，避开双方手牌） */
      .fx-phase-banner { left: 0; right: 0; top: 26%; text-align: center; animation: fxBannerIn 1.5s ease forwards; }
      .fx-phase-inner {
        display: inline-block; background: rgba(16,20,32,0.93); border: 1px solid var(--lp-me); border-radius: 12px;
        padding: 7px 22px; box-shadow: 0 0 22px rgba(74,163,255,0.28);
      }
      .fx-phase-inner b { display: block; color: var(--lp-me); font-size: 17px; letter-spacing: 3px; }
      .fx-phase-inner span { display: block; color: #b8c2d8; font-size: 12px; margin-top: 3px; letter-spacing: 1px; }
      .fx-phase-inner.ai { border-color: var(--lp-ai); box-shadow: 0 0 22px rgba(229,72,77,0.28); }
      .fx-phase-inner.ai b { color: var(--lp-ai); }
      .turn-banner-inner {
        display: inline-block; padding: 12px 36px; border-radius: 16px; background: rgba(10,14,24,0.94);
        border: 2px solid var(--accent); box-shadow: 0 0 44px rgba(230,178,74,0.4); position: relative; overflow: hidden;
      }
      .turn-banner-inner::after { /* 扫光 */
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
        transform: translateX(-100%); animation: tbSweep 0.9s ease 0.1s;
      }
      @keyframes tbSweep { to { transform: translateX(100%); } }
      .turn-banner-inner b { display: block; font-size: 32px; letter-spacing: 10px; color: var(--accent); }
      .turn-banner-inner span { font-size: 13px; color: var(--dim); letter-spacing: 4px; }
      .turn-banner-inner.me b { color: var(--lp-me); }
      .turn-banner-inner.ai b { color: var(--lp-ai); }
      @keyframes fxBannerIn {
        0% { opacity: 0; transform: translateY(-14px); }
        14% { opacity: 1; transform: translateY(0); }
        78% { opacity: 1; }
        100% { opacity: 0; transform: translateY(8px); }
      }
      .fx-attack { height: 0; border-top: 2px solid rgba(230,178,74,0.95); transform: rotate(var(--rot)); transform-origin: left center; box-shadow: 0 0 8px rgba(230,178,74,0.6); animation: fxAtkLine 0.36s ease-out forwards; }
      .fx-ico { position: absolute; right: -14px; top: -15px; font-size: 22px; animation: fxAtkIco 0.36s ease-out; }
      @keyframes fxAtkLine {
        0% { opacity: 0; transform: rotate(var(--rot)) scaleX(0.1); }
        55% { opacity: 1; transform: rotate(var(--rot)) scaleX(1); }
        100% { opacity: 0; transform: rotate(var(--rot)) scaleX(1); }
      }
      @keyframes fxAtkIco { 0% { opacity: 0; transform: scale(0.4); } 40% { opacity: 1; transform: scale(1.3); } 100% { opacity: 0; transform: scale(1); } }
      .fx-glow { width: 92px; height: 128px; transform: translate(-50%, -50%); border-radius: 8px; border: 2px solid var(--accent); box-shadow: 0 0 26px rgba(230,178,74,0.85), inset 0 0 26px rgba(230,178,74,0.4); animation: fxGlowPop 0.6s ease-out forwards; }
      .fx-glow-small { width: 70px; height: 98px; transform: translate(-50%, -50%); border-radius: 8px; border: 2px solid rgba(230,178,74,0.7); box-shadow: 0 0 18px rgba(230,178,74,0.5); animation: fxGlowPop 0.55s ease-out forwards; }
      @keyframes fxGlowPop {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.65); }
        25% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
      }
      .card.fx-hit-attacker { animation: fxShake 0.38s ease; }
      .card.fx-hit-target { animation: fxHitPulse 0.42s ease; }
      @keyframes fxShake { 0%, 100% { transform: none; filter: none; } 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
      @keyframes fxHitPulse { 0%, 100% { filter: none; transform: none; } 40% { filter: brightness(1.7) saturate(1.4); transform: scale(1.05); } }
      .card.attacking { box-shadow: 0 0 0 3px var(--accent), 0 0 26px rgba(230,178,74,0.85); animation: atkGlow 0.5s ease-in-out infinite; }
      @keyframes atkGlow { 50% { box-shadow: 0 0 0 3px var(--accent), 0 0 46px rgba(230,178,74,1); } }
      /* 装备指示：怪兽被装备时左上角金色小徽章 */
      .card.equipped::before {
        content: "⚒"; position: absolute; left: -3px; top: -3px; z-index: 6;
        width: 20px; height: 20px; display: grid; place-items: center;
        background: linear-gradient(135deg, #e6b24a, #a87f2a); border-radius: 50%;
        font-size: 11px; color: #1a1208; box-shadow: 0 0 8px rgba(230,178,74,0.8);
      }

      @media (max-width: 900px) {
        .slot { width: 58px; height: 78px; }
        .slot.mz { width: 64px; height: 92px; }
        .hand.me .card { width: 68px; height: 96px; }
        .field { grid-template-columns: 48px 1fr 48px; }
        .zone-row { gap: 4px; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="home" href="../../index.html">← 主页</a>
      <div class="title">游戏王 · <b>决斗</b></div>
      <span class="phase-tag" id="phase-tag">准备</span>
      <span class="turn-info" id="turn-info">第 1 回合</span>
      <div class="spacer"></div>
      <div class="icon-btn" id="btn-pace" title="游戏节奏">▶</div>
      <div class="icon-btn" id="btn-sfx" title="音效开关">🔊</div>
      <div class="icon-btn" id="btn-log" title="对局日志">📜</div>
      <div class="icon-btn" id="btn-help" title="说明">❓</div>
      <button class="btn" id="btn-new">新对局</button>
    </header>

    <div class="board">
      <div class="lp-row">
        <span class="lp-name ai">AI</span>
        <div class="lp-bar" id="lp-ai-bar"><div class="lp-fill ai" id="lp-ai-fill"></div></div>
        <span class="lp-val" id="lp-ai">8000</span>
      </div>
      <div class="hand opp" id="hand-ai"></div>

      <div class="mat">
        <div class="field" id="field-ai"></div>
        <div class="center-strip">
          <div class="phase-dots" id="phase-dots"></div>
          <div class="log-ticker" id="log-ticker">—</div>
        </div>
        <div class="field" id="field-me"></div>
      </div>

      <div class="hand me" id="hand-me"></div>
      <div class="lp-row">
        <span class="lp-name me">玩家</span>
        <div class="lp-bar" id="lp-me-bar"><div class="lp-fill me" id="lp-me-fill"></div></div>
        <span class="lp-val" id="lp-me">8000</span>
      </div>
      <div class="turn-bar" id="turn-bar">
        <div class="tb-phase">
          <div id="tb-phase">—</div>
          <div class="tb-tip" id="tb-tip">—</div>
        </div>
        <button class="tb-btn primary" id="tb-main">⚔ 进入战斗</button>
        <button class="tb-btn ghost" id="tb-alt">🛠 主阶段 2</button>
        <button class="tb-btn" id="tb-end">▶ 结束回合</button>
      </div>
    </div>

    <div class="mode-bar" id="mode-bar"></div>
    <div class="chain-banner" id="chain-banner"></div>
    <div class="log-panel" id="log-panel">
      <header><div style="font-size:14px;font-weight:700;">对局日志</div><div class="spacer" style="flex:1;"></div><div class="icon-btn" id="btn-log-close">✕</div></header>
      <div class="log-body" id="log-body"></div>
    </div>
    <div class="modal-mask" id="modal-mask"><div class="modal" id="modal"></div></div>
    <div class="toast" id="toast"></div>
    <div class="screen-flash" id="screen-flash"></div>

    <script>
      "use strict";
      const $ = (id) => document.getElementById(id);
      const ATTR_EM = { "光": "☀", "暗": "☾", "地": "⛰", "水": "💧", "炎": "🔥", "风": "🌬" };
      const RACE_EM = { "龙族": "🐉", "魔法师族": "🧙", "恶魔族": "😈", "战士族": "⚔", "岩石族": "🪨", "兽族": "🐺", "机械族": "⚙", "昆虫族": "🐛", "水族": "🐟", "爬虫类族": "🦎", "兽战士族": "🦁", "鸟兽族": "🦅", "雷族": "⚡", "植物族": "🌿", "天使族": "👼" };

      let duel;
      let selCard = null;       // 当前在 popover 中展示的卡
      let selInfo = null;       // {kind, who, idx, handIdx}
      let mode = null;          // null | 'attack' | 'tribute'
      let attackZone = null;    // 攻击方区域 idx
      let tributeHandIdx = null;
      let tributePool = [];
      let toastTimer = null;
      let logBuf = [];
      let seenUids = new Set();
      let prevLp = { me: 8000, ai: 8000 };
      let winnerShown = false;
      let menuOpen = false;
      let deckChoice = "classic";
      let aiDeckChoice = "classic";
      let lastChainLen = 0;
      // 游戏节奏配置：动作最小间隔 + 弹窗前置延迟（三档可切换，localStorage 持久化）
      const PACE_PRESETS = {
        fast: { label: "⚡ 快速", pace: 120, promptDelay: 100 },
        normal: { label: "▶ 标准", pace: 350, promptDelay: 220 },
        slow: { label: "🐢 悠闲", pace: 650, promptDelay: 400 },
      };
      let paceMode = (() => { try { return localStorage.getItem("ygoPace") || "normal"; } catch (e) { return "normal"; } })();
      if (!PACE_PRESETS[paceMode]) paceMode = "normal";
      const cardEls = new Map(); // uid -> {el, who, kind, idx, handIdx}（特效定位用）

      // ---------- 卡牌渲染 ----------
      function cardEl(card, opts = {}) {
        const el = document.createElement("div");
        if (!card) return el;
        if (opts.back) { el.className = "card back" + (opts.extraClass || ""); return el; }
        el.className = "card " + card.type + (opts.extraClass || "");
        if (opts.set) { el.className = "card set"; return el; }
        if (opts.def) el.classList.add("def-pos");

        const nb = document.createElement("div"); nb.className = "namebar"; nb.textContent = card.name; el.appendChild(nb);
        const art = document.createElement("div"); art.className = "art";
        const em = document.createElement("div"); em.className = "em";
        em.textContent = card.type === "monster" ? (RACE_EM[card.race] || "★") : (card.type === "spell" ? "✨" : "🪤");
        art.appendChild(em);
        // 裁切立绘（语言无关插画）放进画区；加载成功隐藏 emoji 与悬浮条（露出完整卡图），失败回退
        if (card.password && !opts.back && !opts.set) {
          const img = document.createElement("img"); img.className = "scan";
          img.src = "https://images.ygoprodeck.com/images/cards_cropped/" + String(Number(card.password)) + ".jpg"; // 图片按数字 id 命名，去掉卡密前导零
          img.onerror = () => img.remove();
          img.onload = () => { el.classList.add("has-art"); em.style.display = "none"; };
          art.appendChild(img);
        }
        el.appendChild(art);
        if (card.type === "monster") {
          const attr = document.createElement("div"); attr.className = "attr"; attr.textContent = ATTR_EM[card.attribute] || ""; el.appendChild(attr);
          if (card.level) { const stars = document.createElement("div"); stars.className = "stars"; stars.textContent = "★".repeat(Math.min(card.level, 12)); el.appendChild(stars); }
        } else { const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = card.subtype || ""; el.appendChild(sub); }
        const foot = document.createElement("div"); foot.className = "foot";
        if (card.type === "monster") {
          const st = opts.stats || { atk: card.atk, def: card.def };
          foot.innerHTML = `<span>ATK <b>${st.atk ?? "?"}</b></span><span>DEF <b>${st.def ?? "?"}</b></span>`;
        } else { foot.innerHTML = `<span>${card.type === "spell" ? "魔法" : "陷阱"}</span><span></span>`; }
        el.appendChild(foot);

        // 操作提示徽章
        if (opts.hints && opts.hints.length) {
          const h = document.createElement("div"); h.className = "action-hint";
          for (const ic of opts.hints.slice(0, 3)) { const c = document.createElement("div"); c.className = "chip"; c.textContent = ic; h.appendChild(c); }
          el.appendChild(h);
        }
        return el;
      }

      function cardHints(card, info) {
        const s = duel.state; const hints = [];
        const myTurn = s.turnPlayer === "me" && !s.pending && !s.resolving;
        const inMain = s.phase === "main1" || s.phase === "main2";
        if (info && info.handIdx != null && myTurn && inMain) {
          if (card.type === "monster") {
            hints.push(card.level >= 5 ? "祭" : "召");
            if (duel.manualCondOk(card)) hints.push("效");
          }
          else if (card.type === "spell") hints.push(duel.manualCondOk(card) ? "发" : "盖");
          else hints.push("盖");
        }
        if (info && info.kind === "monster" && info.who === "me" && myTurn) {
          if (card.faceDown) { if (inMain) hints.push("翻"); }
          else {
            // 战斗阶段：攻击表示且未攻击过才提示"攻"（先手第一回合引擎不允许攻击，此处以 s.turn > 1 同步）
            if (s.phase === "battle" && card.position === "atk" && !s.me.attacked[info.idx] && s.turn > 1) hints.push("攻");
            if (inMain) { if (duel.manualCondOk(card)) hints.push("效"); hints.push("换"); }
          }
        }
        if (info && info.kind === "st" && info.who === "me" && card.faceDown && myTurn && inMain && card.turnSet < s.turn) hints.push("发");
        return hints;
      }
      function timingManual(m) { return !!(m.effect && m.effect.triggers && m.effect.triggers.some((t) => t.event === "manual" && !t.auto)); }

      // ---------- 渲染 ----------
      function render() {
        const s = duel && duel.state; if (!s) return;
        // LP（持久元素，带动画）
        updateLP("me", s.me.lp); updateLP("ai", s.ai.lp);
        // 阶段
        const phaseNames = { draw: "抽卡", standby: "准备", main1: "主要1", battle: "战斗", main2: "主要2" };
        const tp = s.turnPlayer;
        $("phase-tag").textContent = (tp === "me" ? "你的回合 · " : "AI 回合 · ") + (phaseNames[s.phase] || s.phase);
        $("phase-tag").className = "phase-tag " + tp;
        $("turn-info").textContent = `第 ${s.turn} 回合`;
        renderPhaseDots(s);
        renderTurnBar(s);

        renderField(s.ai, "field-ai", "ai");
        renderField(s.me, "field-me", "me");
        renderHand(s.ai, "hand-ai", true);
        renderHand(s.me, "hand-me", false);

        renderChainBanner(s);
        renderPrompt(s);
        renderModeBar();
        renderLogTicker();
        if (s.winner && !winnerShown) showGameOver(s.winner);
      }

      // 回合控制条（底部）：随阶段切换按钮，并常驻显示当前阶段可做的操作
      function renderTurnBar(s) {
        const mine = s.turnPlayer === "me" && !s.pending && !s.resolving && !s.winner;
        const bar = $("turn-bar");
        const phaseNames = { draw: "抽卡阶段", standby: "准备阶段", main1: "主要阶段 1", battle: "战斗阶段", main2: "主要阶段 2" };
        $("tb-phase").textContent = (mine ? "你的回合" : "AI 回合") + " · " + (phaseNames[s.phase] || s.phase);
        const phaseTips = {
          draw: "自动从卡组抽 1 张", standby: "自动推进",
          main1: "点击手牌：召唤怪兽 / 发动魔法 / 覆盖卡牌", battle: "点击攻击表示怪兽发起攻击",
          main2: "还可召唤、覆盖魔法·陷阱卡", end: "手卡多于 6 张需丢弃",
        };
        $("tb-tip").textContent = mine ? (phaseTips[s.phase] || "") : "AI 行动中…";
        bar.className = "turn-bar" + (mine ? "" : " ai");
        const mainBtn = $("tb-main"), altBtn = $("tb-alt"), endBtn = $("tb-end");
        const set = (b, label, show, primary, enabled) => {
          b.textContent = label;
          b.style.display = show ? "" : "none";
          b.className = "tb-btn" + (primary ? " primary" : " ghost");
          b.disabled = !(mine && enabled);
        };
        if (s.phase === "main1") {
          set(mainBtn, "⚔ 进入战斗", true, true, true);
          set(altBtn, "", false, false, false);
          set(endBtn, "▶ 结束回合", true, false, true);
        } else if (s.phase === "battle") {
          set(mainBtn, "🛠 主阶段 2", true, true, true);
          set(altBtn, "", false, false, false);
          set(endBtn, "▶ 结束回合", true, false, true);
        } else if (s.phase === "main2") {
          set(mainBtn, "▶ 结束回合", true, true, true);
          set(altBtn, "", false, false, false);
          set(endBtn, "", false, false, true);
        } else {
          set(mainBtn, "—", true, false, false);

      function renderField(p, elId, who) {

      // ---------- popover 菜单 ----------

      function positionMenu(menu, anchorEl) {
        if (!anchorEl) { menu.style.left = "50%"; menu.style.top = "50%"; menu.style.transform = "translate(-50%,-50%)"; return; }
        const r = anchorEl.getBoundingClientRect(); const mw = menu.offsetWidth, mh = menu.offsetHeight;
        let left = r.left + r.width / 2 - mw / 2;
        let top = r.bottom + 8;
        if (top + mh > window.innerHeight - 8) top = r.top - mh - 8;
        if (top < 8) top = 8;
        left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
        menu.style.left = left + "px"; menu.style.top = top + "px"; menu.style.transform = "none";
      }
      function closeMenu() {
        const m = $("card-menu"); if (m) m.remove();

      function availableActions(card, info) {
        const s = duel.state; const acts = [];
        const myTurn = s.turnPlayer === "me" && !s.pending && !s.resolving;
        const inMain = s.phase === "main1" || s.phase === "main2";
        if (info && info.handIdx != null && myTurn && inMain) {
          if (card.type === "monster") {
            if (card.level < 5) {
              acts.push({ icon: "⚔", label: "通常召唤·攻击表示", primary: true, fn: () => { duel.normalSummon(info.handIdx, null, "atk"); closeMenu(); } });
              acts.push({ icon: "🛡", label: "通常召唤·守备表示", fn: () => { duel.normalSummon(info.handIdx, null, "def"); closeMenu(); } });
              acts.push({ icon: "🎴", label: "覆盖（里侧守备）", fn: () => { duel.setMonster(info.handIdx, null); closeMenu(); } });
            } else {
              acts.push({ icon: "⚔", label: `祭品召唤（需${card.level >= 7 ? 2 : 1}祭品）`, primary: true, fn: () => { startTribute(info.handIdx); } });
            }
            if (duel.manualCondOk(card)) acts.push({ icon: "✨", label: "发动效果", fn: () => { duel.activateHandMonsterEffect(info.handIdx); closeMenu(); } });
          } else if (card.type === "spell") {
            const canFire = duel.manualCondOk(card);
            if (canFire) acts.push({ icon: "✨", label: "发动", primary: true, fn: () => { duel.activateHandSpell(info.handIdx); closeMenu(); } });
            acts.push({ icon: "🎴", label: "覆盖", primary: !canFire, fn: () => { duel.setSpellTrap(info.handIdx); closeMenu(); } });
          } else if (card.type === "trap") {
            acts.push({ icon: "🎴", label: "覆盖", primary: true, fn: () => { duel.setSpellTrap(info.handIdx); closeMenu(); } });
          }
        }
        if (info && info.kind === "monster" && info.who === "me" && myTurn) {
          const idx = info.idx;
          if (card.faceDown) { if (inMain) acts.push({ icon: "🔄", label: "翻转召唤", primary: true, fn: () => { duel.flipSummon(idx); closeMenu(); } }); }
          else {
            if (s.phase === "battle" && card.position === "atk" && !s.me.attacked[idx] && s.turn > 1)
              acts.push({ icon: "⚔", label: "攻击", primary: true, fn: () => { enterAttackMode(idx); } });
            if (inMain) {
              acts.push({ icon: "🔄", label: "切换表示形式", fn: () => { duel.changePosition(idx); closeMenu(); } });
              if (duel.manualCondOk(card)) acts.push({ icon: "✨", label: "发动效果", fn: () => { duel.activateMonsterEffect(idx); closeMenu(); } });
            }

          acts.push({ icon: "✨", label: "发动", primary: true, fn: () => { duel.activateSetTrap(info.idx); closeMenu(); } });
        return acts;
      }

      /* ============ 特效反馈（消费引擎 onEvent） ============ */
      // 在 body 上叠一层固定定位动画元素，动画结束自动移除；x/y 传 null 表示居中横幅
      function fxEl(inner, x, y, cls) {

      }
      // 阶段切换横幅：提示当前小回合能做的具体操作
      const PHASE_TIPS = {
        draw: ["抽卡阶段", "自动从卡组抽 1 张"],
        standby: ["准备阶段", "自动推进"],
        main1: ["主要阶段 1", "点击手牌：召唤怪兽 / 发动魔法 / 覆盖卡牌"],
        battle: ["战斗阶段", "点击攻击表示的怪兽发起攻击"],
        main2: ["主要阶段 2", "还可召唤、覆盖魔法·陷阱卡"],
        end: ["结束阶段", "手卡多于 6 张需丢弃"],
      };
      function fxPhaseBanner(phase, player) {
        const t = PHASE_TIPS[phase];
        if (!t) return;
        const me = player === "me";
        fxEl(`<div class="fx-phase-inner ${me ? "me" : "ai"}"><b>${t[0]}</b>${t[1] ? `<span>${t[1]}</span>` : ""}</div>`, null, null, "fx-phase-banner");
      }
      function fxActBanner(card, actor) {
        const name = card ? card.name : "";
        // 栗子球等免伤手坑附加效果说明，解释"为什么没有掉血"
        const extra = card && card.cid === "kuriboh" ? "（该次战斗伤害无效）" : "";
        fxEl(`<span class="fx-act-txt">✨ ${actor === "me" ? "玩家" : "AI"} 发动：${name}${extra}</span>`, null, null, "fx-act-banner");
      }
      function fxAtCard(card, cls, label) {
        const pos = rectOf(card);
        if (!pos) { if (label) fxEl(`<span class="fx-act-txt">${label}</span>`, null, null, "fx-act-banner"); return; }
        fxEl(`<div class="fx-burst-txt">${label || ""}</div>`, pos.cx, pos.cy - 34, cls);
      }
      function fxAttack(attacker, target) {
        const a = rectOf(attacker);
        if (!a) return;
        let b = target ? rectOf(target) : lpBarCenter(attacker.controller === "me" ? "ai" : "me");
        if (!b) return;
        const dx = b.cx - a.cx, dy = b.cy - a.cy;
        const len = Math.max(30, Math.hypot(dx, dy));
        const ang = Math.atan2(dy, dx) * 180 / Math.PI;
        const el = fxEl(`<span class="fx-ico">⚔</span>`, a.cx, a.cy, "fx-attack");
        el.style.width = len + "px";
        el.style.setProperty("--rot", ang + "deg");
        const ai = cardEls.get(attacker.uid);
        if (ai && ai.el) ai.el.classList.add("fx-hit-attacker");
        if (target) { const ti = cardEls.get(target.uid); if (ti && ti.el) ti.el.classList.add("fx-hit-target"); }
      }
      function fxImpact(ev) {
        const dmg = ev.damage || 0;
        if (ev.direct) {
          const p = lpBarCenter(ev.damageTo);
          if (!p) return;
          if (dmg > 0) fxEl(`<b class="fx-dmg-txt">−${dmg}</b>`, p.cx, p.cy - 18, "fx-dmg");
          fxEl(`<div class="fx-burst-txt">💥 直接攻击！</div>`, p.cx, p.cy - 54, "fx-burst");
          return;
        }
        const card = ev.damageTo === "def" ? ev.target : ev.attacker;
        const pos = rectOf(card);
        if (!pos) return;
        fxEl(`<div class="fx-burst-txt">${ev.damageTo === "def" ? "💥" : "↩"}</div>`, pos.cx, pos.cy - 26, "fx-burst");
        if (dmg > 0) fxEl(`<b class="fx-dmg-txt">−${dmg}</b>`, pos.cx, pos.cy - 56, "fx-dmg");
        if (card) { const ci = cardEls.get(card.uid); if (ci && ci.el) ci.el.classList.add("fx-hit-target"); }
      }
      function fxBurst(card) {
        const pos = rectOf(card);
        fxEl(`<div class="fx-burst-txt">💥 破坏</div>`, pos ? pos.cx : 640, pos ? pos.cy : 360, "fx-burst");
      }
      function fxLpFloat(player, delta) {
        if (delta >= 0) return;
        const p = lpBarCenter(player);
        if (!p) return;
        fxEl(`<b class="fx-dmg-txt small">−${-delta}</b>`, p.cx, p.cy - 16, "fx-dmg");
      }
      /* ============ 音效（Web Audio 合成，无需资源文件） ============ */
      let sfxOn = true;
      let ac = null;
      function acCtx() {
        if (!sfxOn) return null;
        if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
        if (ac.state === "suspended") ac.resume().catch(() => {});
        return ac;
      }
      function tone(freq, dur, type, vol, slideTo, delay) {
        const ctx = acCtx(); if (!ctx) return;
        const t0 = ctx.currentTime + (delay || 0);
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.type = type || "sine";
        o.frequency.setValueAtTime(freq, t0);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
        g.gain.setValueAtTime(vol || 0.12, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        o.connect(g); g.connect(ctx.destination);
        o.start(t0); o.stop(t0 + dur + 0.03);
      }
      function sfx(kind) {
        if (!sfxOn) return;
        switch (kind) {
          case "turn": tone(392, 0.12, "triangle", 0.1); tone(523, 0.18, "triangle", 0.1, null, 0.09); break;
          case "draw": tone(660, 0.08, "sine", 0.06, 920); break;
          case "summon": tone(220, 0.1, "sawtooth", 0.06, 520); tone(520, 0.14, "triangle", 0.1, 780, 0.08); break;
          case "activate": tone(520, 0.1, "square", 0.05, 700); tone(700, 0.16, "triangle", 0.08, 1040, 0.08); break;
          case "attack": tone(900, 0.12, "sawtooth", 0.07, 200); break;
          case "damage": tone(160, 0.22, "square", 0.14, 55); tone(95, 0.28, "sawtooth", 0.12, 40, 0.04); break;
          case "destroy": tone(320, 0.26, "sawtooth", 0.12, 60); tone(190, 0.18, "square", 0.08, 50, 0.02); break;
          case "flip": tone(500, 0.09, "sine", 0.07, 720); break;
          case "win": [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, "triangle", 0.1, null, i * 0.12)); break;
          case "lose": [392, 330, 262, 196].forEach((f, i) => tone(f, 0.24, "sawtooth", 0.08, null, i * 0.14)); break;
          case "chain": tone(600, 0.07, "square", 0.05, 900); break;
        }
      }
      function shakeBoard() {
        const b = document.querySelector(".board");
        if (!b) return;
        b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      }

      // 引擎事件 -> 特效 + 音效 + 节奏控制（返回延迟让动画播完）
      function fxEvent(ev) {
        if (!ev || !ev.kind) return null;
        switch (ev.kind) {
          case "turn_start": fxTurnBanner(ev.player, ev.turn); sfx("turn"); return fxPause(600);
          case "phase_start":
            // 仅战斗/主2阶段提示；回合横幅已含主1提示，抽卡/准备/结束阶段不再弹（避免横幅连发覆盖）
            if (ev.phase === "battle" || ev.phase === "main2") { fxPhaseBanner(ev.phase, ev.player); return fxPause(500); }
            return null;
          case "draw_card": sfx("draw"); break;
          case "summon": if (!ev.hidden) { fxAtCard(ev.monster, "fx-summon", ev.summonKind === "fusion" ? "✦ 融合召唤" : ev.summonKind === "special" ? "✦ 特殊召唤" : "✦ 召唤"); sfx("summon"); return fxPause(260); } break;
          case "activate":
            if (ev.source === "auto") { fxAtCard(ev.card, "fx-glow-small", ""); break; }
            fxActBanner(ev.card, ev.actor); fxAtCard(ev.card, "fx-glow", ""); sfx("activate"); return fxPause(320);
          case "attack_declare": fxAttack(ev.attacker, ev.target); sfx("attack"); return fxPause(340);
          case "damage_calc": fxImpact(ev); sfx("damage"); shakeBoard(); return fxPause(290);
          case "destroyed_by_battle": fxBurst(ev.card); sfx("destroy"); return fxPause(240);
          // 离场反馈：效果破坏（雷击/黑洞等）弹破坏特效；解放弹提示；战斗破坏由 destroyed_by_battle 处理，不重复
          case "sent_to_grave":
            if (ev.from === "field") {
              if (ev.reason === "effect" || ev.reason === "negate") { fxBurst(ev.card); sfx("destroy"); }
              else if (ev.reason === "tribute" || ev.reason === "fusion") { fxAtCard(ev.card, "fx-summon", "🕊"); }
            }
            break;
          case "flip": fxAtCard(ev.monster, "fx-glow-small", "🔄"); sfx("flip"); return fxPause(200);
          case "lp_change": fxLpFloat(ev.player, ev.delta); if (ev.delta < 0) shakeBoard(); break;
        }
        return null;
      }
      function fxPause(ms) { return new Promise((r) => setTimeout(r, ms)); }

      // ---------- 帮助/游戏结束 ----------
      function showHelp() {
        const mask = $("modal-mask"); const modal = $("modal"); mask.dataset.gameover = ""; mask.classList.add("show");
        modal.innerHTML = `<h3>游戏说明</h3><div class="help-list">
          <p><b>阶段</b>：抽卡→准备→主要1→战斗→主要2→结束。用底部回合条推进（⚔进入战斗 → 🛠主阶段2 → ▶结束回合）；先手首回合不抽卡、不能攻击。</p>
          <p><b>操作</b>：点击卡牌弹出操作菜单（召唤/覆盖/发动/攻击等）。攻击时选攻击对象；祭品召唤时点选祭品。</p>
          <p><b>召唤</b>：通常召唤每回合1次；5-6星需1祭品、7星以上需2祭品；覆盖=里侧守备；翻转召唤翻开里侧（覆盖当回合不可）。</p>
          <p><b>战斗</b>：ATK对ATK比攻差伤害；ATK对守备比攻守，不足部分反伤。含贯穿、直接攻击、攻击响应陷阱。</p>
          <p><b>魔陷</b>：魔法可当回合从手牌发动；陷阱须先覆盖且当回合不可发动。装备给己方怪兽，场地全场生效。</p>
          <p><b>连锁</b>：咒文速度 通常魔法/起动1、陷阱2、反击陷阱3（只能被反击陷阱连锁），LIFO结算。伤害步骤可丢弃栗子球免伤。</p>
          <p><b>胜负</b>：LP归0 或 抽卡时卡组为0 即败。</p>
          <p style="color:var(--dim);">范围：经典规则（融合/仪式/同调/超量/连接/灵摆未纳入），精选约50张卡。点击场上的卡组/墓地可查看详情。右上角 🔊 可开关音效。</p>
        </div><div class="btns"><button class="btn ghost" id="help-close">关闭</button></div>`;
        $("help-close").onclick = () => { delete mask.dataset.gameover; mask.classList.remove("show"); };
      }
      function showGameOver(winner) {
        winnerShown = true; const mask = $("modal-mask"); const modal = $("modal"); mask.dataset.gameover = "1"; mask.classList.add("show");
        const win = winner === "me", draw = winner === "draw";
        modal.innerHTML = `<div class="gameover"><h2 class="${win ? "win" : "lose"}">${draw ? "平局" : win ? "胜利！" : "败北…"}</h2><p style="color:var(--dim);">${draw ? "双方同归于尽" : win ? "你击败了 AI" : "AI 取得了胜利"}</p><div class="btns"><button class="btn" id="again">再来一局</button></div></div>`;
        $("again").onclick = () => { delete mask.dataset.gameover; mask.classList.remove("show"); newGame(); };
      }

      // ---------- 启动 ----------
      // 卡组选择（开局双方各自选卡组）
      const DECK_LABELS = { classic: "经典卡组", hero: "元素英雄（游城十代）", machine: "机械族", blueeyes: "青眼白龙", darkmagician: "黑魔术师", redeyes: "真红眼黑龙", harpie: "神鹰女郎", magnet: "磁石战士" };
      const DECK_EMOJIS = { classic: "⚔️", hero: "🦸", machine: "⚙️", blueeyes: "🐉", darkmagician: "🧙", redeyes: "🐲", harpie: "🦅", magnet: "🧲" };
      function openDeckSelect() {
        const mask = $("modal-mask"); const modal = $("modal"); mask.dataset.gameover = ""; mask.classList.add("show");
        const presets = window.YGO_DECK_PRESETS || ["classic"];
        let selMe = deckChoice, selAi = aiDeckChoice;
        modal.innerHTML = `<h3>选择卡组</h3>
          <div class="pick-label">你的卡组</div><div class="pick-row" id="pick-me"></div>
          <div class="pick-label">AI 的卡组</div><div class="pick-row" id="pick-ai"></div>
          <div class="btns"><button class="btn ghost" id="deck-cancel">取消</button><button class="btn" id="deck-start">开始对局</button></div>`;
        const buildRow = (elId, cur, onPick) => {
          const row = $(elId);
          for (const name of presets) {
            const w = document.createElement("div"); w.className = "opt" + (name === cur ? " picked" : "");
            const card = document.createElement("div"); card.className = "card menu-card";
            card.style.cssText = "width:84px;height:118px;display:grid;place-items:center;background:linear-gradient(160deg,#223,#445);border-radius:10px;";
            const em = document.createElement("div"); em.style.cssText = "font-size:30px;";
            em.textContent = DECK_EMOJIS[name] || "🃏";
            card.appendChild(em); w.appendChild(card);
            const lab = document.createElement("div"); lab.className = "opt-label"; lab.textContent = DECK_LABELS[name] || name; w.appendChild(lab);
            w.onclick = () => onPick(name, row);
            row.appendChild(w);
          }
        };
        buildRow("pick-me", selMe, (name, row) => {
          selMe = name;
          row.querySelectorAll(".opt").forEach((o) => o.classList.remove("picked"));
          row.querySelectorAll(".opt")[presets.indexOf(name)].classList.add("picked");
        });
        buildRow("pick-ai", selAi, (name, row) => {
          selAi = name;
          row.querySelectorAll(".opt").forEach((o) => o.classList.remove("picked"));
          row.querySelectorAll(".opt")[presets.indexOf(name)].classList.add("picked");
        });
        $("deck-start").onclick = () => {
          delete mask.dataset.gameover; mask.classList.remove("show");
          deckChoice = selMe; aiDeckChoice = selAi;
          newGame();
        };
        $("deck-cancel").onclick = () => { delete mask.dataset.gameover; mask.classList.remove("show"); };
      }

      function newGame() {
        logBuf = []; $("log-body").innerHTML = ""; winnerShown = false; prevLp = { me: 8000, ai: 8000 }; seenUids = new Set(); cardEls.clear(); lastChainLen = 0;
        const mask = $("modal-mask"); delete mask.dataset.gameover; mask.classList.remove("show"); $("modal").innerHTML = "";
        $("log-panel").classList.remove("show");
        closeMenu(); exitMode();
        duel = new Duel({ playerPreset: deckChoice, aiPreset: aiDeckChoice, pace: PACE_PRESETS[paceMode].pace, promptDelay: PACE_PRESETS[paceMode].promptDelay }, { onState: () => { render(); trackSeen(); }, onLog: (m) => pushLog(m), onToast: (m) => toast(m), onEvent: (ev) => fxEvent(ev), onGameOver: (who) => { sfx(who === "me" ? "win" : who === "draw" ? "chain" : "lose"); } });
        duel.start();
      }

      // 事件
      $("btn-new").onclick = () => openDeckSelect();
      const canAct = () => duel && duel.state && duel.state.turnPlayer === "me" && !duel.state.pending && !duel.state.resolving && !duel.state.winner;
      $("tb-main").onclick = () => { if (canAct() && ["main1", "battle", "main2"].includes(duel.state.phase)) duel.nextPhase(); };
      $("tb-alt").onclick = () => { if (canAct() && duel.state.phase === "battle") duel.nextPhase(); };
      $("tb-end").onclick = () => { if (canAct() && ["main1", "battle"].includes(duel.state.phase)) duel.endTurn(); };
      $("btn-sfx").onclick = () => { sfxOn = !sfxOn; $("btn-sfx").textContent = sfxOn ? "🔊" : "🔇"; if (sfxOn) sfx("turn"); };
      // 节奏切换：快 -> 标准 -> 慢 循环
      $("btn-pace").onclick = () => {
        const order = ["fast", "normal", "slow"];
        paceMode = order[(order.indexOf(paceMode) + 1) % order.length];
        try { localStorage.setItem("ygoPace", paceMode); } catch (e) { /* 忽略存储失败 */ }
        $("btn-pace").textContent = PACE_PRESETS[paceMode].label.charAt(0);
        $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label + "（每回合/每次行动间隔约 " + PACE_PRESETS[paceMode].pace + "ms，弹窗前 " + PACE_PRESETS[paceMode].promptDelay + "ms）";
        toast("游戏节奏：" + PACE_PRESETS[paceMode].label);
      };
      $("btn-pace").textContent = PACE_PRESETS[paceMode].label.charAt(0);
      $("btn-pace").title = "游戏节奏：" + PACE_PRESETS[paceMode].label;
      $("btn-log").onclick = () => $("log-panel").classList.toggle("show");
      $("btn-log-close").onclick = () => $("log-panel").classList.remove("show");
      $("btn-help").onclick = () => showHelp();
      $("log-ticker").onclick = () => $("log-panel").classList.add("show");
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenu(); if (mode) exitMode(); $("log-panel").classList.remove("show"); } });
      document.body.onclick = (e) => {
        if (menuOpen || duel?.state?.pending || duel?.state?.resolving) return;
        if (mode) return;
        if (e.target.closest(".card") || e.target.closest("button") || e.target.closest(".modal-mask") || e.target.closest(".mode-bar") || e.target.closest(".pile") || e.target.closest("header")) return;
      };

      newGame();
    </script>
  </body>
</html>
