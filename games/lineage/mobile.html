<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>族谱·传家 (手机版)</title>
    <script src="./index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f3ead2;
        --paper-2: #ece0c2;
        --ink: #2c241b;
        --ink-2: #4a3f30;
        --ink-soft: #6b5d48;
        --vermilion: #9e3b2e;
        --vermilion-2: #b04a3a;
        --gold: #b8924a;
        --gold-2: #d4b06a;
        --gold-soft: #e3cf9a;
        --jade: #3e6b5a;
        --card: #fbf6e8;
        --card-edge: #cdb98a;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overscroll-behavior: none; }
      body {
        font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "宋体", serif;
        color: var(--ink);
        background: var(--paper);
        background-image:
          radial-gradient(ellipse at 18% 8%, rgba(255,252,238,0.7), transparent 55%),
          radial-gradient(ellipse at 85% 90%, rgba(210,185,140,0.30), transparent 55%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
        overflow: hidden;
      }
      #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }

      /* ===== 顶栏 ===== */
      header {
        flex-shrink: 0;
        display: flex; align-items: center; justify-content: space-between;
        padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top));
        background: linear-gradient(180deg, rgba(247,238,214,0.96), rgba(236,224,194,0.96));
        border-bottom: 1px solid var(--gold);
        box-shadow: 0 2px 8px rgba(80,55,25,0.10);
      }
      .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .seal {
        width: 32px; height: 32px; background: var(--vermilion); color: #fbf6e8;
        display: grid; place-items: center; font-family: "Ma Shan Zheng", serif; font-size: 19px;
        border-radius: 4px; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(158,59,46,0.25);
        transform: rotate(-3deg);
      }
      .dyn { font-family: "Ma Shan Zheng", serif; font-size: 17px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ctrls { display: flex; gap: 6px; flex-shrink: 0; }
      .ctrls .btn {
        min-width: 40px; height: 40px; padding: 0 10px; font-size: 15px;
        display: grid; place-items: center;
      }

      .btn {
        font-family: inherit; font-size: 13px; color: var(--ink);
        background: linear-gradient(180deg, #fbf6e8, #f0e4c6);
        border: 1px solid var(--gold); border-radius: 4px; padding: 7px 12px; cursor: pointer;
        box-shadow: 0 1px 0 rgba(184,146,74,0.4); transition: all 0.12s;
      }
      .btn:active { transform: translateY(1px); box-shadow: none; }
      .btn.primary { background: linear-gradient(180deg, var(--vermilion-2), var(--vermilion)); color: #fbf6e8; border-color: var(--vermilion); }
      .btn.on { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #2a1f10; }

      /* HUD 条 */
      .hud-bar {
        flex-shrink: 0; display: flex; gap: 1px; background: var(--gold-soft);
        border-bottom: 1px solid var(--gold); font-size: 12px;
      }
      .hud-bar span { flex: 1; background: rgba(251,246,232,0.85); padding: 5px 4px; text-align: center; display: flex; flex-direction: column; gap: 1px; }
      .hud-bar i { font-style: normal; font-size: 10px; color: var(--ink-soft); }
      .hud-bar b { font-size: 13px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
      .hud-bar b.neg { color: var(--vermilion); }
      .hud-bar b.pos { color: var(--jade); }

      /* ===== 主体 ===== */
      main { flex: 1; position: relative; min-height: 0; }
      #tree-viewport {
        position: absolute; inset: 0; overflow: hidden; cursor: grab;
        touch-action: none; background: var(--paper);
      }
      #tree-viewport.grabbing { cursor: grabbing; }
      #tree-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
      #tree-svg { position: absolute; top: 0; left: 0; overflow: visible; }
      #tree-cards { position: absolute; top: 0; left: 0; }
      .ln-marriage { stroke: var(--vermilion); stroke-width: 2; opacity: 0.7; }
      .ln-descent { stroke: var(--ink-soft); stroke-width: 1.4; fill: none; opacity: 0.55; }

      .tree-tools {
        position: absolute; right: 12px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; z-index: 5;
      }
      .tree-tools .btn { min-width: 40px; min-height: 40px; padding: 0; font-size: 16px; }

      /* 族人卡片 */
      .mcard {
        position: absolute; width: 124px; height: 88px;
        background: linear-gradient(180deg, var(--card), #f6efdb);
        border: 1px solid var(--card-edge); border-radius: 4px; box-shadow: 0 2px 6px rgba(80,55,25,0.14);
        display: flex; align-items: center; gap: 7px; padding: 7px 8px; cursor: pointer; overflow: hidden;
      }
      .mcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
      .mcard.female::before { background: var(--vermilion-2); }
      .mcard.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft), 0 6px 16px rgba(120,90,30,0.28); }
      .mcard.dead { filter: grayscale(0.85); opacity: 0.62; }
      .mcard.marriedin { border-style: dashed; }
      .mcard-portrait { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 1px var(--gold-soft); }
      .mcard-info { min-width: 0; flex: 1; }
      .mcard-name { font-family: "Ma Shan Zheng", serif; font-size: 17px; color: var(--ink); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mcard-name .exsur { font-size: 10px; color: var(--ink-soft); margin-left: 2px; }
      .mcard-meta { font-size: 10px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mcard-meta .edu { display: inline-block; background: var(--gold); color: #2a1f10; font-size: 8px; padding: 0 4px; border-radius: 2px; margin-left: 3px; }

      /* ===== 底部抽屉 ===== */
      .sheet {
        position: absolute; left: 0; right: 0; bottom: 0;
        background: var(--paper); border-top: 1px solid var(--gold);
        border-radius: 14px 14px 0 0; box-shadow: 0 -6px 24px rgba(40,25,10,0.22);
        max-height: 68%; transform: translateY(100%); transition: transform 0.32s cubic-bezier(.2,.7,.3,1);
        z-index: 10; display: flex; flex-direction: column;
        padding-bottom: env(safe-area-inset-bottom);
      }
      .sheet.open { transform: translateY(0); }
      .sheet-head {
        flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
        padding: 12px 16px; font-family: "Ma Shan Zheng", serif; font-size: 16px; color: var(--ink);
        border-bottom: 1px solid rgba(184,146,74,0.3);
      }
      .sheet-head .close { font-size: 18px; color: var(--ink-soft); padding: 2px 8px; cursor: pointer; }
      .sheet-body { overflow-y: auto; padding: 12px 14px; -webkit-overflow-scrolling: touch; }
      .sheet-backdrop {
        position: absolute; inset: 0; background: rgba(40,30,18,0.25);
        opacity: 0; pointer-events: none; transition: opacity 0.32s; z-index: 9;
      }
      .sheet-backdrop.open { opacity: 1; pointer-events: auto; }

      /* 详情 */
      .dec-empty { font-size: 13px; color: var(--ink-soft); text-align: center; padding: 24px 0; font-style: italic; }
      .dt-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
      .dt-portrait { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--gold-soft); flex-shrink: 0; }
      .dt-name { font-family: "Ma Shan Zheng", serif; font-size: 22px; color: var(--ink); }
      .dt-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
      .dt-row { display: flex; justify-content: space-between; font-size: 13px; padding: 7px 0; border-bottom: 1px dotted rgba(184,146,74,0.3); }
      .dt-row span { color: var(--ink-soft); }
      .dt-row b { color: var(--ink); font-weight: 600; }
      .btn-line {
        font-family: inherit; font-size: 14px; width: 100%; margin-top: 14px;
        background: linear-gradient(180deg, var(--vermilion-2), var(--vermilion));
        color: #fbf6e8; border: 1px solid var(--vermilion); border-radius: 4px; padding: 11px; cursor: pointer;
      }

      /* 日志 */
      .log-line { font-size: 13px; line-height: 1.7; color: var(--ink-2); padding: 1px 0; }
      .log-line.epic { color: var(--vermilion); font-weight: 600; border-left: 2px solid var(--vermilion); padding-left: 7px; margin: 4px 0; }
      .log-line.event { color: var(--ink); }
      .log-line.ledger { color: var(--ink-soft); font-size: 12px; font-style: italic; }
      .log-line.death { color: #6a5a45; }
      .log-line.decide { color: var(--gold); }
      .log-line.result { color: var(--jade); padding-left: 10px; }

      /* ===== 底部导航 ===== */
      .bottom-nav {
        flex-shrink: 0; display: flex; border-top: 1px solid var(--gold);
        background: linear-gradient(180deg, rgba(247,238,214,0.96), rgba(236,224,194,0.96));
        padding-bottom: env(safe-area-inset-bottom);
      }
      .bottom-nav button {
        flex: 1; padding: 10px 0 12px; font-family: inherit; font-size: 13px; color: var(--ink-soft);
        background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .bottom-nav button .ic { font-size: 17px; }
      .bottom-nav button.active { color: var(--vermilion); }
      .bottom-nav button.active::after { content: ""; display: block; width: 22px; height: 2px; background: var(--vermilion); border-radius: 2px; margin-top: 1px; }

      /* ===== 模态 ===== */
      .modal {
        position: fixed; inset: 0; z-index: 50; background: rgba(40,30,18,0.55);
        backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 12px;
      }
      .modal.show { display: flex; }
      .modal-box {
        background: var(--paper); border: 1px solid var(--gold); border-radius: 6px;
        box-shadow: 0 0 0 4px rgba(184,146,74,0.15), 0 18px 50px rgba(40,25,10,0.4);
        width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto; padding: 20px 18px;
        background-image:
          radial-gradient(ellipse at 15% 5%, rgba(255,252,238,0.7), transparent 55%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      .modal-box h2 { margin: 0 0 4px; font-family: "Ma Shan Zheng", serif; font-size: 22px; color: var(--ink); display: flex; align-items: center; gap: 10px; }
      .modal-box h2 .seal { width: 28px; height: 28px; font-size: 16px; }
      .modal-box .sub { color: var(--ink-soft); font-size: 12px; margin-bottom: 14px; }
      .sec-label { font-family: "Ma Shan Zheng", serif; font-size: 14px; color: var(--vermilion); margin: 14px 0 8px; }

      .surname-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      .surname-display { font-family: "Ma Shan Zheng", serif; font-size: 34px; color: var(--vermilion); width: 60px; height: 60px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--gold-soft); border-radius: 4px; }
      .gender-pair { display: flex; gap: 8px; }
      .gender-opt { flex: 1; text-align: center; padding: 12px; cursor: pointer; border: 1px solid var(--card-edge); border-radius: 4px; background: var(--card); font-size: 14px; }
      .gender-opt.sel { border-color: var(--gold); background: linear-gradient(180deg, #fdf3d6, #f0dca6); box-shadow: 0 0 0 2px var(--gold-soft); }
      .gender-opt .gicon { font-size: 22px; display: block; margin-bottom: 3px; }
      .bg-list { display: flex; flex-direction: column; gap: 7px; }
      .bg-opt { background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
      .bg-opt.sel { border-color: var(--gold); background: linear-gradient(180deg, #fdf3d6, #f0dca6); box-shadow: 0 0 0 2px var(--gold-soft); }
      .bg-opt b { font-size: 15px; color: var(--ink); }
      .bg-opt span { font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; }
      .bg-opt span i { font-style: normal; color: var(--gold); }
      .modal-foot { margin-top: 18px; display: flex; justify-content: flex-end; gap: 8px; }
      .modal-foot .btn { flex: 1; padding: 12px; font-size: 15px; }

      /* 事件弹窗 */
      .ev-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .ev-badge { font-family: "Ma Shan Zheng", serif; font-size: 18px; color: var(--vermilion); background: rgba(158,59,46,0.10); border: 1px solid var(--vermilion); border-radius: 3px; padding: 4px 12px; }
      .ev-progress { font-size: 11px; color: var(--ink-soft); margin-left: auto; }
      .ev-body { display: flex; flex-direction: column; gap: 12px; }
      .ev-target { display: flex; align-items: center; gap: 12px; background: rgba(184,146,74,0.10); border: 1px solid var(--gold-soft); border-radius: 4px; padding: 10px 12px; }
      .ev-target .ev-portrait { width: 52px; height: 52px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--gold-soft); flex-shrink: 0; }
      .ev-target .ev-name { font-family: "Ma Shan Zheng", serif; font-size: 20px; color: var(--ink); }
      .ev-target .ev-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
      .ev-text { font-size: 15px; line-height: 1.75; color: var(--ink); padding: 2px; }
      .ev-choices { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; }
      .ev-choice {
        font-family: inherit; font-size: 15px; cursor: pointer; text-align: left;
        background: linear-gradient(180deg, #fbf6e8, #f0e4c6); border: 1px solid var(--gold); border-radius: 4px;
        padding: 13px 14px; color: var(--ink); display: flex; align-items: center; justify-content: space-between; gap: 8px;
        box-shadow: 0 1px 0 rgba(184,146,74,0.4);
      }
      .ev-choice i { font-size: 12px; color: var(--ink-soft); font-style: normal; }
      .ev-choice.col { border-color: var(--gold-2); background: linear-gradient(180deg, #fdf3d6, #f0dca6); }
      .ev-choice.accept { border-color: var(--jade); color: var(--jade); }
      .ev-choice.decline { border-color: var(--ink-soft); color: var(--ink-soft); }
      .ev-choice:active { transform: translateY(1px); box-shadow: none; }

      /* 结局 */
      .end-head { text-align: center; margin-bottom: 12px; }
      .end-grade { font-family: "Ma Shan Zheng", serif; font-size: 64px; line-height: 1; margin: 4px 0; }
      .end-grade.g-s { color: var(--gold); } .end-grade.g-a { color: var(--vermilion); } .end-grade.g-b { color: var(--jade); }
      .end-grade.g-c { color: var(--ink-2); } .end-grade.g-d, .end-grade.g-f { color: #8a7a60; }
      .end-title { font-family: "Ma Shan Zheng", serif; font-size: 20px; color: var(--ink); }
      #end-summary p { font-size: 13px; margin: 4px 0; } #end-summary .muted { color: var(--ink-soft); }
      .end-stats { display: flex; gap: 6px; margin: 12px 0; flex-wrap: wrap; }
      .end-stats div { flex: 1; min-width: 70px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; padding: 8px 4px; text-align: center; }
      .end-stats b { display: block; font-size: 17px; color: var(--vermilion); }
      .end-stats span { font-size: 10px; color: var(--ink-soft); }
      #end-log { max-height: 200px; overflow-y: auto; background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; padding: 10px; margin: 8px 0 14px; }

      /* 浮动通知 */
      #toast-container { position: fixed; top: max(72px, calc(env(safe-area-inset-top) + 60px)); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: max-content; max-width: 90vw; }
      .toast { background: linear-gradient(180deg, rgba(251,246,232,0.98), rgba(240,228,198,0.98)); border: 1px solid var(--gold); border-left: 3px solid var(--vermilion); border-radius: 3px; padding: 7px 14px; box-shadow: 0 4px 14px rgba(80,55,25,0.25); display: flex; flex-direction: column; align-items: center; gap: 1px; animation: toast-in 0.3s ease; }
      .toast b { font-family: "Ma Shan Zheng", serif; font-size: 14px; color: var(--ink); }
      .toast span { font-size: 10px; color: var(--ink-soft); }
      .toast.birth { border-left-color: var(--jade); } .toast.birth b { color: var(--jade); }
      .toast.death { border-left-color: #6a5a45; }
      .toast.warn { border-left-color: var(--vermilion); } .toast.warn b { color: var(--vermilion); }
      .toast.out { opacity: 0; transform: translateY(-10px); transition: opacity 0.4s, transform 0.4s; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(184,146,74,0.5); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <div class="seal" id="brand-seal">族</div>
          <div class="dyn" id="hud-dynasty">族谱·传家</div>
        </div>
        <div class="ctrls">
          <button class="btn" id="btn-advance">▶</button>
          <button class="btn on" id="btn-auto">⏸</button>
          <button class="btn" id="btn-restart">↻</button>
          <a class="btn" href="../../index.html" title="返回主页">🏠</a>
        </div>
      </header>
      <div class="hud-bar">
        <span><i>纪年</i><b id="hud-year">-</b></span>
        <span><i>家产</i><b id="hud-treasury">-</b></span>
        <span><i>族人</i><b id="hud-members">-</b></span>
        <span><i>世代</i><b id="hud-gen">-</b></span>
        <span><i>名望</i><b id="hud-prestige">0</b></span>
      </div>
      <style>
        /* 飘字动效（移动端）：进账红 / 支出绿 */
        .hud-bar span { position: relative; }
        .float-delta {
          position: absolute; left: 50%; top: 100%;
          transform: translateX(-50%);
          font-size: 13px; font-weight: 700; white-space: nowrap;
          font-variant-numeric: tabular-nums;
          pointer-events: none; z-index: 30;
          text-shadow: 0 1px 2px rgba(251,246,232,0.95);
          animation: float-up 1.4s ease-out forwards;
        }
        .float-delta.gain { color: var(--vermilion); }
        .float-delta.loss { color: var(--jade); }
        @keyframes float-up {
          0%   { opacity: 0; transform: translate(-50%, 6px) scale(0.75); }
          18%  { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
          100% { opacity: 0; transform: translate(-50%, -24px) scale(0.95); }
        }
        .amt-gain { color: var(--vermilion); font-weight: 600; }
        .amt-loss { color: var(--jade); font-weight: 600; }
      </style>

      <main>
        <div id="tree-viewport">
          <div id="tree-world">
            <svg id="tree-svg"></svg>
            <div id="tree-cards"></div>
          </div>
        </div>
        <div class="tree-tools">
          <button class="btn" id="btn-zin">＋</button>
          <button class="btn" id="btn-zout">－</button>
          <button class="btn" id="btn-zfit">⊡</button>
        </div>
        <div class="sheet-backdrop" id="sheet-bd"></div>
        <div class="sheet" id="sheet-detail">
          <div class="sheet-head">族人详情 <span class="close" data-close>✕</span></div>
          <div class="sheet-body" id="detail"></div>
        </div>
        <div class="sheet" id="sheet-log">
          <div class="sheet-head">家乘轶事 <span class="close" data-close>✕</span></div>
          <div class="sheet-body" id="log"></div>
        </div>
      </main>

      <nav class="bottom-nav">
        <button data-tab="detail"><span class="ic">人</span>族人</button>
        <button data-tab="tree" class="active"><span class="ic">谱</span>族谱</button>
        <button data-tab="log"><span class="ic">乘</span>家乘</button>
      </nav>
    </div>

    <!-- 开局创建 -->
    <div class="modal show" id="creation">
      <div class="modal-box">
        <h2><span class="seal">族</span>开基立业</h2>
        <div class="sub">择姓氏、定性别、选出身，开启一族兴衰。</div>
        <div class="sec-label">▎姓氏</div>
        <div class="surname-row">
          <div class="surname-display" id="c-surname">赵</div>
          <button class="btn" id="c-roll-surname">🎲 另择</button>
        </div>
        <div class="sec-label">▎性别</div>
        <div class="gender-pair">
          <div class="gender-opt" id="c-gender-m"><span class="gicon">♂</span>男</div>
          <div class="gender-opt" id="c-gender-f"><span class="gicon">♀</span>女</div>
        </div>
        <div class="sec-label">▎出身</div>
        <div class="bg-list" id="c-bg"></div>
        <div class="modal-foot">
          <button class="btn primary" id="c-start">立族开宗 ▶</button>
        </div>
      </div>
    </div>

    <!-- 事件弹窗 -->
    <div class="modal" id="event-modal">
      <div class="modal-box ev-box">
        <div class="ev-head">
          <div class="ev-badge" id="ev-title">事务</div>
          <div class="ev-progress" id="ev-progress"></div>
        </div>
        <div class="ev-body">
          <div class="ev-target" id="ev-target" style="display:none"></div>
          <div class="ev-text" id="ev-text"></div>
        </div>
        <div class="ev-choices" id="ev-choices"></div>
      </div>
    </div>

    <!-- 终局 -->
    <div class="modal" id="ending">
      <div class="modal-box">
        <div class="end-head">
          <div class="sub" style="margin:0">族谱终卷</div>
          <div class="end-grade" id="end-grade">-</div>
          <div class="end-title" id="end-title">-</div>
        </div>
        <div id="end-summary"></div>
        <div class="sec-label">▎族谱后记</div>
        <div id="end-log"></div>
        <div class="modal-foot">
          <button class="btn primary" id="end-restart">↻ 再续一族</button>
        </div>
      </div>
    </div>

    <div id="toast-container"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const game = new LineageGame(document.getElementById("app"));
      game.start();

      $("btn-advance").onclick = () => game.advance();
      $("btn-auto").onclick = () => game.toggleAuto();
      $("btn-restart").onclick = () => game.restart();
      $("end-restart").onclick = () => game.restart();
      $("btn-zin").onclick = () => { const vp = $("tree-viewport").getBoundingClientRect(); game.zoomBy(1.2, vp.left + vp.width/2, vp.top + vp.height/2); };
      $("btn-zout").onclick = () => { const vp = $("tree-viewport").getBoundingClientRect(); game.zoomBy(1/1.2, vp.left + vp.width/2, vp.top + vp.height/2); };
      $("btn-zfit").onclick = () => game.centerOnRoot();

      // 同步顶栏印章为姓氏
      const _origRender = game.renderHud.bind(game);
      game.renderHud = function () {
        _origRender();
        const seal = $("brand-seal");
        if (this.state) seal.textContent = this.state.surname;
        // 同步家产配色
        const tr = $("hud-treasury");
        if (this.state) tr.className = this.state.treasury < 0 ? "neg" : "";
      };
      setTimeout(() => game.state && game.renderHud(), 0);

      // ===== 底部抽屉切换 =====
      const sheets = { detail: $("sheet-detail"), log: $("sheet-log") };
      const bd = $("sheet-bd");
      let openSheetName = null;
      function openSheet(name) {
        Object.values(sheets).forEach((s) => s.classList.remove("open"));
        if (name && sheets[name]) { sheets[name].classList.add("open"); bd.classList.add("open"); openSheetName = name; }
        else closeSheet();
        document.querySelectorAll(".bottom-nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === (name || "tree")));
      }
      function closeSheet() {
        Object.values(sheets).forEach((s) => s.classList.remove("open"));
        bd.classList.remove("open"); openSheetName = null;
        document.querySelectorAll(".bottom-nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === "tree"));
      }
      document.querySelectorAll(".bottom-nav button").forEach((b) => {
        b.onclick = () => { if (b.dataset.tab === "tree") closeSheet(); else openSheet(b.dataset.tab); };
      });
      document.querySelectorAll("[data-close]").forEach((el) => el.onclick = closeSheet);
      bd.onclick = closeSheet;

      // 点击族人卡片 -> 打开详情抽屉
      $("tree-cards").addEventListener("click", (e) => {
        if (e.target.closest(".mcard")) setTimeout(() => openSheet("detail"), 60);
      });
    </script>
  </body>
</html>
