<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>族谱·传家 — 家族传承模拟</title>
    <script src="./index.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
    <style>
      :root {
        --paper: #f3ead2;
        --paper-2: #ece0c2;
        --paper-dark: #e2d4b0;
        --ink: #2c241b;
        --ink-2: #4a3f30;
        --ink-soft: #6b5d48;
        --vermilion: #9e3b2e;
        --vermilion-2: #b04a3a;
        --gold: #b8924a;
        --gold-2: #d4b06a;
        --gold-soft: #e3cf9a;
        --jade: #3e6b5a;
        --card: #fbf6e8;
        --card-edge: #cdb98a;
        --shadow: 0 2px 0 rgba(60,40,20,0.06), 0 6px 18px rgba(80,55,25,0.12);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "宋体", serif;
        color: var(--ink);
        background: var(--paper);
        overflow: hidden;
        /* 宣纸纹理：渐变 + 纤维 + 颗粒 */
        background-image:
          radial-gradient(ellipse at 18% 8%, rgba(255,252,238,0.7), transparent 55%),
          radial-gradient(ellipse at 85% 90%, rgba(210,185,140,0.30), transparent 55%),
          radial-gradient(ellipse at 70% 20%, rgba(180,150,90,0.10), transparent 50%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      #app { height: 100%; display: flex; flex-direction: column; }

      /* ===== 顶栏 ===== */
      header {
        flex-shrink: 0;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        background: linear-gradient(180deg, rgba(247,238,214,0.96), rgba(236,224,194,0.96));
        border-bottom: 1px solid var(--gold);
        box-shadow: 0 2px 10px rgba(80,55,25,0.10), inset 0 -2px 0 rgba(184,146,74,0.25);
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .seal {
        width: 38px; height: 38px;
        background: var(--vermilion);
        color: #fbf6e8;
        display: grid; place-items: center;
        font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
        font-size: 22px; font-weight: 900;
        border-radius: 4px;
        box-shadow: 0 0 0 2px rgba(158,59,46,0.25), 0 2px 6px rgba(120,40,30,0.3);
        transform: rotate(-3deg);
      }
      .brand .titles { line-height: 1.15; }
      .brand .t1 { font-family: "Ma Shan Zheng", "Noto Serif SC", serif; font-size: 22px; color: var(--ink); letter-spacing: 2px; }
      .brand .t2 { font-size: 11px; color: var(--ink-soft); letter-spacing: 4px; text-transform: uppercase; }

      .hud { display: flex; align-items: center; gap: 10px; }
      .stat {
        position: relative;
        background: rgba(251,246,232,0.7);
        border: 1px solid var(--gold-soft);
        border-radius: 3px;
        padding: 5px 12px;
        text-align: center;
        min-width: 76px;
      }
      .stat .k { font-size: 10px; color: var(--ink-soft); letter-spacing: 2px; }
      .stat .v { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
      /* 中式行情配色：进账/盈余为红，支出/亏损为绿 */
      .stat .v.pos { color: var(--vermilion); }
      .stat .v.neg { color: var(--jade); }
      .stat.gold .v { color: var(--gold); }
      .stat .v .amt-gain, .amt-gain { color: var(--vermilion); font-weight: 600; }
      .stat .v .amt-loss, .amt-loss { color: var(--jade); font-weight: 600; }

      /* 数值飘字动效 */
      .float-delta {
        position: absolute; left: 50%; top: 100%;
        transform: translateX(-50%);
        font-size: 14px; font-weight: 700; white-space: nowrap;
        font-variant-numeric: tabular-nums;
        pointer-events: none; z-index: 30;
        text-shadow: 0 1px 2px rgba(251,246,232,0.95), 0 0 6px rgba(251,246,232,0.8);
        animation: float-up 1.4s ease-out forwards;
      }
      .float-delta.gain { color: var(--vermilion); }
      .float-delta.loss { color: var(--jade); }
      @keyframes float-up {
        0%   { opacity: 0; transform: translate(-50%, 8px) scale(0.75); }
        18%  { opacity: 1; transform: translate(-50%, 0) scale(1.12); }
        32%  { transform: translate(-50%, -3px) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -30px) scale(0.95); }
      }
      /*  stat 底色脉冲  */
      @keyframes stat-pulse-gain { 0% { background: rgba(158,59,46,0.30); border-color: var(--vermilion); } 100% { background: rgba(251,246,232,0.7); } }
      @keyframes stat-pulse-loss { 0% { background: rgba(62,107,90,0.32); border-color: var(--jade); } 100% { background: rgba(251,246,232,0.7); } }
      .stat.pulse-gain { animation: stat-pulse-gain 0.9s ease-out; }
      .stat.pulse-loss { animation: stat-pulse-loss 0.9s ease-out; }

      .ctrls { display: flex; align-items: center; gap: 7px; }
      .btn {
        font-family: inherit;
        font-size: 13px;
        color: var(--ink);
        background: linear-gradient(180deg, #fbf6e8, #f0e4c6);
        border: 1px solid var(--gold);
        border-radius: 3px;
        padding: 8px 13px;
        cursor: pointer;
        box-shadow: 0 1px 0 rgba(184,146,74,0.4);
        transition: all 0.12s;
        white-space: nowrap;
      }
      .btn:hover { background: linear-gradient(180deg, #fff8e6, #f5e8c8); border-color: var(--gold-2); }
      .btn:active { transform: translateY(1px); box-shadow: none; }
      .btn.primary { background: linear-gradient(180deg, var(--vermilion-2), var(--vermilion)); color: #fbf6e8; border-color: var(--vermilion); }
      .btn.primary:hover { background: linear-gradient(180deg, #c25444, var(--vermilion-2)); }
      .btn.on { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #2a1f10; border-color: var(--gold); }
      .btn.icon { padding: 8px 10px; min-width: 34px; }
      a.btn { text-decoration: none; display: inline-flex; align-items: center; }

      /* ===== 主体 ===== */
      main { flex: 1; display: flex; min-height: 0; }
      .tree-pane {
        flex: 1; min-width: 0; position: relative;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(255,250,235,0.5), transparent 60%),
          var(--paper);
        overflow: hidden;
      }
      #tree-viewport {
        position: absolute; inset: 0;
        overflow: hidden;
        cursor: grab;
      }
      #tree-viewport.grabbing { cursor: grabbing; }
      #tree-world { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
      #tree-svg { position: absolute; top: 0; left: 0; overflow: visible; }
      #tree-cards { position: absolute; top: 0; left: 0; }
      .ln-marriage { stroke: var(--vermilion); stroke-width: 2; stroke-dasharray: 0; opacity: 0.7; }
      .ln-descent { stroke: var(--ink-soft); stroke-width: 1.4; fill: none; opacity: 0.55; }

      /* 族人卡片 */
      .mcard {
        position: absolute;
        width: 136px; height: 96px;
        background: linear-gradient(180deg, var(--card), #f6efdb);
        border: 1px solid var(--card-edge);
        border-radius: 4px;
        box-shadow: var(--shadow);
        display: flex; align-items: center; gap: 8px;
        padding: 8px 10px;
        cursor: pointer;
        transition: box-shadow 0.15s, transform 0.1s, border-color 0.15s;
        overflow: hidden;
      }
      .mcard::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
        background: var(--gold);
      }
      .mcard.female::before { background: var(--vermilion-2); }
      .mcard:hover { border-color: var(--gold-2); box-shadow: 0 2px 0 rgba(60,40,20,0.06), 0 8px 22px rgba(80,55,25,0.2); }
      .mcard.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft), 0 8px 22px rgba(120,90,30,0.28); }
      .mcard.dead { filter: grayscale(0.85); opacity: 0.62; }
      .mcard.dead::before { background: #9a8d6a; }
      .mcard.marriedin { border-style: dashed; }
      .mcard-portrait {
        width: 46px; height: 46px; flex-shrink: 0;
        border-radius: 50%;
        overflow: hidden;
        box-shadow: 0 0 0 1px var(--gold-soft), inset 0 0 0 1px rgba(255,255,255,0.4);
      }
      .mcard-info { min-width: 0; flex: 1; }
      .mcard-name {
        font-family: "Ma Shan Zheng", "Noto Serif SC", "KaiTi", serif;
        font-size: 18px; color: var(--ink); line-height: 1.1;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .mcard-name .exsur { font-size: 11px; color: var(--ink-soft); font-family: serif; margin-left: 2px; }
      .mcard-meta { font-size: 10.5px; color: var(--ink-soft); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mcard-meta .edu { display: inline-block; background: var(--gold); color: #2a1f10; font-size: 9px; padding: 0 4px; border-radius: 2px; margin-left: 3px; }

      /* 世代标尺 */
      .tree-hint {
        position: absolute; left: 14px; top: 12px;
        font-size: 11px; color: var(--ink-soft);
        background: rgba(251,246,232,0.8); border: 1px solid var(--gold-soft);
        padding: 5px 10px; border-radius: 3px;
        pointer-events: none; z-index: 5;
      }
      .tree-tools {
        position: absolute; right: 14px; bottom: 14px;
        display: flex; flex-direction: column; gap: 6px; z-index: 5;
      }
      .tree-tools .btn { min-width: 36px; padding: 7px 0; text-align: center; }

      /* ===== 侧栏 ===== */
      .sidebar {
        width: 330px; flex-shrink: 0;
        background: linear-gradient(180deg, rgba(247,238,214,0.96), rgba(240,230,200,0.96));
        border-left: 1px solid var(--gold);
        box-shadow: inset 2px 0 0 rgba(184,146,74,0.15);
        display: flex; flex-direction: column;
        overflow: hidden;
      }
      .panel { display: flex; flex-direction: column; min-height: 0; border-bottom: 1px solid rgba(184,146,74,0.3); }
      .panel-head {
        flex-shrink: 0;
        padding: 9px 16px;
        font-family: "Ma Shan Zheng", "Noto Serif SC", serif;
        font-size: 15px; color: var(--ink);
        background: rgba(184,146,74,0.10);
        border-bottom: 1px solid rgba(184,146,74,0.25);
        display: flex; align-items: center; gap: 8px;
      }
      .panel-head .dot { width: 7px; height: 7px; background: var(--vermilion); border-radius: 50%; }
      .panel-head .count { margin-left: auto; font-size: 11px; color: var(--ink-soft); font-family: serif; }
      .panel-body { overflow-y: auto; padding: 10px 12px; }
      #log { flex: 1; min-height: 120px; }

      /* 决策卡 */
      .dec-empty { font-size: 12px; color: var(--ink-soft); text-align: center; padding: 16px 0; font-style: italic; }
      .dec-card {
        background: var(--card);
        border: 1px solid var(--card-edge);
        border-left: 3px solid var(--vermilion);
        border-radius: 3px;
        padding: 9px 11px;
        margin-bottom: 9px;
        box-shadow: 0 1px 4px rgba(80,55,25,0.08);
      }
      .dec-title { font-size: 13px; color: var(--ink); font-weight: 600; margin-bottom: 6px; }
      .dec-prospect { font-size: 12px; color: var(--ink-2); margin-bottom: 7px; line-height: 1.5; }
      .dec-college { font-size: 11px; color: var(--gold); margin-bottom: 5px; }
      .dec-opts { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 5px; }
      .dec-opt {
        font-family: inherit; font-size: 12px;
        background: linear-gradient(180deg, #fbf6e8, #f0e4c6);
        border: 1px solid var(--gold);
        border-radius: 3px; padding: 5px 9px; cursor: pointer; color: var(--ink);
        display: flex; flex-direction: column; align-items: center; gap: 1px;
        min-width: 52px; transition: all 0.12s;
      }
      .dec-opt i { font-size: 9.5px; color: var(--ink-soft); font-style: normal; }
      .dec-opt:hover { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #2a1f10; }
      .dec-opt.opt-col { border-color: var(--gold-2); background: linear-gradient(180deg, #fdf3d6, #f0dca6); }
      .dec-opt.opt-accept { border-color: var(--jade); color: var(--jade); }
      .dec-opt.opt-accept:hover { background: linear-gradient(180deg, #6fa090, var(--jade)); color: #fbf6e8; }
      .dec-opt.opt-decline { border-color: var(--ink-soft); color: var(--ink-soft); }
      .dec-opt.disabled { opacity: 0.5; cursor: not-allowed; }

      /* 详情 */
      .dt-head { display: flex; align-items: center; gap: 11px; margin-bottom: 10px; }
      .dt-portrait { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--gold-soft); }
      .dt-name { font-family: "Ma Shan Zheng", serif; font-size: 22px; color: var(--ink); }
      .dt-sub { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
      .dt-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 5px 0; border-bottom: 1px dotted rgba(184,146,74,0.3); }
      .dt-row span { color: var(--ink-soft); }
      .dt-row b { color: var(--ink); font-weight: 600; }
      .btn-line {
        font-family: inherit; font-size: 12.5px; width: 100%; margin-top: 10px;
        background: linear-gradient(180deg, var(--vermilion-2), var(--vermilion));
        color: #fbf6e8; border: 1px solid var(--vermilion); border-radius: 3px; padding: 7px; cursor: pointer;
      }
      .btn-line:hover { background: linear-gradient(180deg, #c25444, var(--vermilion-2)); }

      /* 日志 */
      .log-line { font-size: 12px; line-height: 1.65; color: var(--ink-2); padding: 1px 0; }
      .log-line.epic { color: var(--vermilion); font-weight: 600; border-left: 2px solid var(--vermilion); padding-left: 7px; margin: 4px 0; }
      .log-line.event { color: var(--ink); }
      .log-line.ledger { color: var(--ink-soft); font-size: 11px; font-style: italic; }
      .log-line.death { color: #6a5a45; }
      .log-line.decide { color: var(--gold); }
      .log-line.result { color: var(--jade); padding-left: 10px; }

      /* ===== 模态 ===== */
      .modal {
        position: fixed; inset: 0; z-index: 50;
        background: rgba(40,30,18,0.55);
        backdrop-filter: blur(3px);
        display: none; align-items: center; justify-content: center; padding: 24px;
      }
      .modal.show { display: flex; }
      .modal-box {
        background: var(--paper);
        border: 1px solid var(--gold);
        border-radius: 5px;
        box-shadow: 0 0 0 4px rgba(184,146,74,0.15), 0 18px 50px rgba(40,25,10,0.4);
        width: 560px; max-width: 100%; max-height: 90vh; overflow: auto;
        padding: 26px 30px;
        background-image:
          radial-gradient(ellipse at 15% 5%, rgba(255,252,238,0.7), transparent 55%),
          url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0 0.16  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      .modal-box h2 {
        margin: 0 0 4px; font-family: "Ma Shan Zheng", serif; font-size: 26px; color: var(--ink);
        display: flex; align-items: center; gap: 12px;
      }
      .modal-box h2 .seal { width: 30px; height: 30px; font-size: 18px; transform: rotate(-4deg); }
      .modal-box .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 18px; }
      .sec-label { font-family: "Ma Shan Zheng", serif; font-size: 14px; color: var(--vermilion); margin: 16px 0 9px; letter-spacing: 1px; }

      .gender-pair { display: flex; gap: 10px; }
      .gender-opt {
        flex: 1; text-align: center; padding: 14px; cursor: pointer;
        border: 1px solid var(--card-edge); border-radius: 4px; background: var(--card);
        font-size: 14px; transition: all 0.12s;
      }
      .gender-opt.sel { border-color: var(--gold); background: linear-gradient(180deg, #fdf3d6, #f0dca6); box-shadow: 0 0 0 2px var(--gold-soft); }
      .gender-opt .gicon { font-size: 26px; display: block; margin-bottom: 4px; }

      .surname-row { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
      .surname-display {
        font-family: "Ma Shan Zheng", serif; font-size: 40px; color: var(--vermilion);
        width: 70px; height: 70px; display: grid; place-items: center;
        background: var(--card); border: 1px solid var(--gold-soft); border-radius: 4px;
      }

      .bg-list { display: flex; flex-direction: column; gap: 8px; }
      .bg-opt {
        background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px;
        padding: 10px 13px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; transition: all 0.12s;
      }
      .bg-opt.sel { border-color: var(--gold); background: linear-gradient(180deg, #fdf3d6, #f0dca6); box-shadow: 0 0 0 2px var(--gold-soft); }
      .bg-opt b { font-size: 15px; color: var(--ink); }
      .bg-opt span { font-size: 12px; color: var(--ink-soft); display: flex; justify-content: space-between; }
      .bg-opt span i { font-style: normal; color: var(--gold); }

      .modal-foot { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; }

      /* 结局 */
      .end-head { text-align: center; margin-bottom: 14px; }
      .end-grade { font-family: "Ma Shan Zheng", serif; font-size: 76px; line-height: 1; margin: 4px 0; text-shadow: 2px 3px 0 rgba(120,90,30,0.2); }
      .end-grade.g-s { color: var(--gold); }
      .end-grade.g-a { color: var(--vermilion); }
      .end-grade.g-b { color: var(--jade); }
      .end-grade.g-c { color: var(--ink-2); }
      .end-grade.g-d, .end-grade.g-f { color: #8a7a60; }
      .end-title { font-family: "Ma Shan Zheng", serif; font-size: 22px; color: var(--ink); }
      #end-summary p { font-size: 13px; margin: 4px 0; }
      #end-summary .muted { color: var(--ink-soft); }
      .end-stats { display: flex; gap: 8px; margin: 14px 0; flex-wrap: wrap; }
      .end-stats div { flex: 1; min-width: 80px; background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; padding: 9px 6px; text-align: center; }
      .end-stats b { display: block; font-size: 20px; color: var(--vermilion); font-variant-numeric: tabular-nums; }
      .end-stats span { font-size: 11px; color: var(--ink-soft); }
      #end-log { max-height: 180px; overflow-y: auto; background: var(--card); border: 1px solid var(--card-edge); border-radius: 4px; padding: 10px 12px; margin: 10px 0 16px; }

      /* 事件弹窗 */
      .ev-box { width: 480px; }
      .ev-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
      .ev-badge { font-family: "Ma Shan Zheng", serif; font-size: 20px; color: var(--vermilion); background: rgba(158,59,46,0.10); border: 1px solid var(--vermilion); border-radius: 3px; padding: 4px 14px; }
      .ev-progress { font-size: 12px; color: var(--ink-soft); margin-left: auto; }
      .ev-body { display: flex; flex-direction: column; gap: 14px; }
      .ev-target { display: flex; align-items: center; gap: 12px; background: rgba(184,146,74,0.10); border: 1px solid var(--gold-soft); border-radius: 4px; padding: 10px 12px; }
      .ev-target .ev-portrait { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px var(--gold-soft); flex-shrink: 0; }
      .ev-target .ev-name { font-family: "Ma Shan Zheng", serif; font-size: 22px; color: var(--ink); }
      .ev-target .ev-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
      .ev-text { font-size: 15px; line-height: 1.8; color: var(--ink); padding: 4px 2px; }
      .ev-choices { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
      .ev-choice {
        font-family: inherit; font-size: 14px; cursor: pointer;
        background: linear-gradient(180deg, #fbf6e8, #f0e4c6); border: 1px solid var(--gold); border-radius: 4px;
        padding: 10px 16px; color: var(--ink); display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 92px;
        box-shadow: 0 1px 0 rgba(184,146,74,0.4); transition: all 0.12s;
      }
      .ev-choice i { font-size: 11px; color: var(--ink-soft); font-style: normal; }
      .ev-choice:hover { background: linear-gradient(180deg, var(--gold-2), var(--gold)); color: #2a1f10; }
      .ev-choice:hover i { color: #2a1f10; }
      .ev-choice.col { border-color: var(--gold-2); background: linear-gradient(180deg, #fdf3d6, #f0dca6); }
      .ev-choice.accept { border-color: var(--jade); color: var(--jade); }
      .ev-choice.accept:hover { background: linear-gradient(180deg, #6fa090, var(--jade)); color: #fbf6e8; }
      .ev-choice.decline { border-color: var(--ink-soft); color: var(--ink-soft); }
      .ev-choice.decline:hover { background: linear-gradient(180deg, #8a7a60, #6b5d48); color: #fbf6e8; }

      /* 浮动通知 */
      #toast-container { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
      .toast { background: linear-gradient(180deg, rgba(251,246,232,0.98), rgba(240,228,198,0.98)); border: 1px solid var(--gold); border-left: 3px solid var(--vermilion); border-radius: 3px; padding: 8px 16px; box-shadow: 0 4px 16px rgba(80,55,25,0.25); display: flex; flex-direction: column; align-items: center; gap: 1px; animation: toast-in 0.3s ease; min-width: 140px; }
      .toast b { font-family: "Ma Shan Zheng", serif; font-size: 15px; color: var(--ink); }
      .toast span { font-size: 11px; color: var(--ink-soft); }
      .toast.birth { border-left-color: var(--jade); }
      .toast.birth b { color: var(--jade); }
      .toast.death { border-left-color: #6a5a45; }
      .toast.warn { border-left-color: var(--vermilion); }
      .toast.warn b { color: var(--vermilion); }
      .toast.out { opacity: 0; transform: translateY(-10px); transition: opacity 0.4s, transform 0.4s; }
      @keyframes toast-in { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }

      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(184,146,74,0.5); border-radius: 5px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(184,146,74,0.75); }

      @media (max-width: 880px) {
        .sidebar { width: 280px; }
        .hud .stat { min-width: 60px; padding: 4px 8px; }
        .brand .t2 { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <div class="seal" id="brand-seal">族</div>
          <div class="titles">
            <div class="t1" id="hud-dynasty">族谱·传家</div>
            <div class="t2">LINEAGE · 家族传承</div>
          </div>
        </div>
        <div class="hud">
          <div class="stat"><div class="k">纪年</div><div class="v" id="hud-year">—</div></div>
          <div class="stat"><div class="k">族人</div><div class="v" id="hud-members">—</div></div>
          <div class="stat"><div class="k">世代</div><div class="v" id="hud-gen">—</div></div>
          <div class="stat gold"><div class="k">家产</div><div class="v" id="hud-treasury">—</div></div>
          <div class="stat"><div class="k">收支/月</div><div class="v" id="hud-cashflow">—</div></div>
          <div class="stat"><div class="k">名望</div><div class="v" id="hud-prestige">0</div></div>
        </div>
        <div class="ctrls">
          <button class="btn primary" id="btn-advance">▶ 推进一年</button>
          <button class="btn" id="btn-auto">⏩ 自动</button>
          <button class="btn" id="btn-restart">↻ 重开</button>
          <a class="btn" href="./mobile.html" title="手机版">📱</a>
          <a class="btn" href="../../index.html" title="返回主页">🏠</a>
        </div>
      </header>

      <main>
        <section class="tree-pane">
          <div class="tree-hint">滚轮缩放 · 拖拽平移 · 点选族人</div>
          <div id="tree-viewport">
            <div id="tree-world">
              <svg id="tree-svg"></svg>
              <div id="tree-cards"></div>
            </div>
          </div>
          <div class="tree-tools">
            <button class="btn icon" id="btn-zin">＋</button>
            <button class="btn icon" id="btn-zout">－</button>
            <button class="btn icon" id="btn-zfit">⊡</button>
          </div>
        </section>

        <aside class="sidebar">
          <div class="panel" style="flex: 0 0 auto;">
            <div class="panel-head"><span class="dot" style="background:var(--gold)"></span>族人详情</div>
            <div class="panel-body" id="detail"></div>
          </div>
          <div class="panel" style="flex: 1; min-height: 0;">
            <div class="panel-head"><span class="dot" style="background:var(--jade)"></span>家乘轶事</div>
            <div class="panel-body" id="log"></div>
          </div>
        </aside>
      </main>
    </div>

    <!-- 开局创建 -->
    <div class="modal show" id="creation">
      <div class="modal-box">
        <h2><span class="seal">族</span>开基立业</h2>
        <div class="sub">择一姓氏、定其性别、选其出身，自此开启一族兴衰。</div>

        <div class="sec-label">▎姓氏</div>
        <div class="surname-row">
          <div class="surname-display" id="c-surname">赵</div>
          <button class="btn" id="c-roll-surname">🎲 另择一姓</button>
          <div style="font-size:12px;color:var(--ink-soft);align-self:center;">族谱将以本姓传世，外姓嫁入者另标。</div>
        </div>

        <div class="sec-label">▎性别</div>
        <div class="gender-pair">
          <div class="gender-opt" id="c-gender-m"><span class="gicon">♂</span>男</div>
          <div class="gender-opt" id="c-gender-f"><span class="gicon">♀</span>女</div>
        </div>

        <div class="sec-label">▎出身</div>
        <div class="bg-list" id="c-bg"></div>

        <div class="modal-foot">
          <button class="btn primary" id="c-start">立族开宗 ▶</button>
        </div>
      </div>
    </div>

    <!-- 终局 -->
    <div class="modal" id="ending">
      <div class="modal-box">
        <div class="end-head">
          <div class="sub" style="margin:0">族谱终卷</div>
          <div class="end-grade" id="end-grade">-</div>
          <div class="end-title" id="end-title">-</div>
        </div>
        <div id="end-summary"></div>
        <div class="sec-label">▎族谱后记</div>
        <div id="end-log"></div>
        <div class="modal-foot">
          <button class="btn primary" id="end-restart">↻ 再续一族</button>
        </div>
      </div>
    </div>

    <!-- 事件弹窗（提亲/染疾/灾荒等，需抉择方继续） -->
    <div class="modal" id="event-modal">
      <div class="modal-box ev-box">
        <div class="ev-head">
          <div class="ev-badge" id="ev-title">事务</div>
          <div class="ev-progress" id="ev-progress"></div>
        </div>
        <div class="ev-body">
          <div class="ev-target" id="ev-target" style="display:none"></div>
          <div class="ev-text" id="ev-text"></div>
        </div>
        <div class="ev-choices" id="ev-choices"></div>
      </div>
    </div>

    <!-- 浮动通知 -->
    <div id="toast-container"></div>

    <script>
      const game = new LineageGame(document.getElementById("app"));
      game.start();

      document.getElementById("btn-advance").onclick = () => game.advance();
      document.getElementById("btn-auto").onclick = () => game.toggleAuto();
      document.getElementById("btn-restart").onclick = () => game.restart();
      document.getElementById("end-restart").onclick = () => game.restart();
      document.getElementById("btn-zin").onclick = () => {
        const vp = document.getElementById("tree-viewport").getBoundingClientRect();
        game.zoomBy(1.18, vp.left + vp.width/2, vp.top + vp.height/2);
      };
      document.getElementById("btn-zout").onclick = () => {
        const vp = document.getElementById("tree-viewport").getBoundingClientRect();
        game.zoomBy(1/1.18, vp.left + vp.width/2, vp.top + vp.height/2);
      };
      document.getElementById("btn-zfit").onclick = () => game.centerOnRoot();

      // 同步顶栏印章为姓氏
      const _origRender = game.renderHud.bind(game);
      game.renderHud = function () {
        _origRender();
        const seal = document.getElementById("brand-seal");
        if (this.state) seal.textContent = this.state.surname;
      };
      // 初次创建后重渲染一次印章
      setTimeout(() => game.state && game.renderHud(), 0);
    </script>
  </body>
</html>
